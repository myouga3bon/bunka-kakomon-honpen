<script>
const D={"S5_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−2/81", "−2/9 ÷ (−3)² = −2/9 ÷ 9 = −2/9 × 1/9 = −2/81。わり算は逆数のかけ算にする。"], ["(2)", "−3/2", "(−13+7) = −6、(1/2)² = 1/4 なので −6 × 1/4 = −3/2。かっこの中を先に計算する。"], ["(3)", "a³/2", "a²b ÷ 2b² × ab = a²b × ab / (2b²) = a³b² / 2b² = a³/2。÷は分母に回して約分する。"], ["(4)", "36xy + 9y²", "展開して引く。(2x+5y)² = 4x²+20xy+25y²、(2x−4y)² = 4x²−16xy+16y²。差は 36xy + 9y²。（A²−B²=(A+B)(A−B) でも (4x+y)(9y)×… と同じ結果）"], ["(5)", "5√6 − 6", "√24=2√6、√18×√2=√36=6、√54=3√6。2√6 − 6 + 3√6 = 5√6 − 6。"], ["(6)", "x = 5", "両辺を10倍して 8x+30=14x → 30=6x → x=5。"], ["(7)", "x = 0, 9", "2x(x−9)=0 より x=0, 9。（解答用紙の「0.9」は「0, 9」の意味）"], ["(8)", "150", "x²+6xy+9y² = (x+3y)²。x+3y = 2√6+3√6 = 5√6 なので (5√6)² = 25×6 = 150。式を因数分解してから代入するとラク。"]]}, {"t": "問2 小問集合", "items": [["(1)", "ウ・オ", "96 = 2⁵×3。√(96/n) が整数になるには 96/n が平方数。n=6→16、n=24→4で整数。n=2→48、3→32、16→6 は平方数でない。"], ["(2)", "a = −4", "y=ax−3 の変化の割合は常に a。y=x² の −3→−1 の変化の割合は {(−1)²−(−3)²}÷{−1−(−3)} = (1−9)÷2 = −4。よって a=−4。"], ["(3)", "a = 13、中央値 12.5点", "平均12.8×10人=合計128。a以外の合計は115なので a=13。並べると 8,9,10,11,12,13,15,15,17,18。10個なので5番目と6番目の平均 (12+13)÷2=12.5。"], ["(4)", "イ", "円柱は半径4・高さ8。表面積=2π×16+8π×8=96π、球は4π×16=64π。96π÷64π=3/2。体積は円柱128π、球256π/3 で円柱は球の3/2倍（ウ・エは誤り）。"], ["(5)", "65度", "直径ABと下の弦は平行。25°の錯角から、弧は 50°（平行な弦にはさまれた弧は等しい）。下半円180°から 50°+50° を引くと弧は80°。xが対する弧は 50+80=130° なので円周角は 65°。"], ["(6)", "12倍", "点Dは中点なので △ABD=△ABC の1/2。Eは BD の中点。座標を B(0,0)、C(2,0)、A(0,2) と置くと D(1,1)、E(½,½)、直線AEとBCの交点Fは (2/3, 0)。△BEF=1/6、△ABC=2 なので 12倍。（メネラウスの定理でも BF:FC=1:2 が出る）"], ["(7)", "80cm³", "正四角錐A-BCDEの体積240。△BCE は底面の半分なので 三角錐A-BCE=120。AF:FB=1:2 より F-BCE は高さが 2/3 倍になるので 120×2/3=80。"]]}, {"t": "問3 連立方程式の利用（リサイクル）", "items": [["(1)", "エ", "空き缶は4%減なので今月は (1−0.04)y = 96/100 y。つまり「今月の空き缶の回収量」。"], ["(2)", "112/100 x", "ペットボトルは12%増なので 今月は (1+0.12)x = 112/100 x。"], ["(3)", "ペットボトル168kg、空き缶96kg", "x+y=250、1.12x+0.96y=264。上の式を0.96倍して 0.96x+0.96y=240 を引くと 0.16x=24 → x=150、y=100。今月は 150×1.12=168kg、100×0.96=96kg。※「先月の量」ではなく「今月」を聞かれている点に注意。"]]}, {"t": "問4 関数（反比例と y=ax²）", "items": [["(1)", "4", "円は x軸・y軸の両方に接するので中心は (r, r)。①y=16/x 上にあるので r×r=16、r>0 より r=4。半径は4。A(4,4)。"], ["(2)", "a = 1/4", "②は A(4,4) を通るので 4=a×16 より a=1/4。"], ["(3)", "5", "x=−2 のとき B(−2,−8)（①）、C(−2,1)（②）。BC=9 を底辺にすると高さはAのx座標との差 4−(−2)=6 で △ABC=27。△ACDは 13.5。D(d,0) として △ACD を座標で計算すると |3d+12|/2=13.5 → 3d+12=27 → d=5。"]]}, {"t": "問5 図形（回転移動と合同の証明）", "items": [["(1)ア〜エ", "ア：CGD　イ：GD　ウ：EDC　エ：EDC", "正方形ABCDを点Dのまわりに回転させたものが EFGD なので、A→E、C→G に移る。△AED と △CGD が合同。ED=GD（正方形の辺）、∠ADE=90°−∠EDC、∠CDG=90°−∠EDC。"], ["(1)オ", "2組の辺とその間の角", "AD=CD、ED=GD、∠ADE=∠CDG の3つが「2組の辺とその間の角がそれぞれ等しい」なので合同。"], ["(1)カ", "対応する辺の長さ", "合同な図形では対応する辺の長さは等しい。だから AE=CG。"], ["(2)", "54度", "ED=AD（同じ正方形の辺）なので △ADE は二等辺三角形。∠DAE=72° → ∠ADE=180−72×2=36°。∠EDC=90−36=54°。四角形DEHCの内角の和360°から ∠E=90°、∠C=90°、∠EDC=54° を引くと ∠EHC=126°。∠EHB=180−126=54°。"]]}, {"t": "問6 規則性（数の表）", "items": [["(1)", "a=25、b=88", "右へ1列で+2、下へ1行で+3。(7,4)：(3,4)=13 から下に4行 → 13+3×4=25。(30,1)：1列目は1,4,7,…で1+3×29=88。"], ["(2)", "ウ", "1列目の (m,1)=1+3(m−1)=3m−2。そこから右に(n−1)列で +2(n−1)。合計 3m−2+2n−2 = 3m+2n−4。例：(3,4)=9+8−4=13 で確認できる。"], ["(3)", "c：5m−4、d：5m、e：5m+2", "(m,m)=3m+2m−4=5m−4。5つの数は 5m−4, 5m−2, 5m, 5m+2, 5m+4 で和は 25m=5×5m。(m,m+2)=3m+2(m+2)−4=5m。よって5倍。"]]}], "S5_english": [{"t": "問1 対話文（適切な文を選ぶ）", "items": [["(1)", "ウ", "「このぼうしはいくらですか」→「3,000円です」。How much（値段）にはIt's 3,000 yen.で答える。"], ["(2)", "ウ", "「（　）」— 「いい考えだね。図書館でやろう」。直前に「放課後に勉強しませんか（Why don't we ～?）」と誘ったと考える。"], ["(3)", "エ", "電話の会話。This is Bob.（こちらはボブです）に対して Speaking.（私です）と答えている → May I speak to Meg, please?（メグさんをお願いします）が自然。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "world", "「ナイル川は世界で一番長い川です」。in the world＝世界で。"], ["(2)", "month", "「3月は1年の3番目の月です」。"], ["(3)", "present", "「お誕生日おめでとう。これはあなたへのプレゼントです」。a present for you。"], ["(4)", "noisy", "「聞こえません」→「このへんはうるさいです」。n＋4文字で noisy。"]]}, {"t": "問3 適語選択", "items": [["(1)", "エ", "have＋過去分詞（経験）。「一度～したことがある」→ have seen。"], ["(2)", "イ", "「郵便局はどこですか。本屋のとなりです」→ Where。"], ["(3)", "ウ", "How long（どのくらいの間）に「30分ぐらい」と答える → for ～（期間）。"], ["(4)", "ア", "a book written in English（英語で書かれた本）。過去分詞の後置修飾。"], ["(5)", "イ", "water は数えられない名詞。「ほとんど～ない」の little を選ぶ（many・a few は数えられる名詞用）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "There / are", "Japan has about 130 million people. ＝ There are about 130 million people in Japan."], ["(2)", "old / as", "「私の高校は姉の高校より古い」＝「姉の高校は私の高校ほど古くない」。not as old as ～。"], ["(3)", "at / swimming", "a good swimmer ＝ good at swimming（泳ぐのが得意）。at のあとは動名詞。"], ["(4)", "During / his", "While he was staying ＝ During his stay。while＋文、during＋名詞。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：カ　5番目：ウ", "What birds can we see in this forest? （キ・オ・カ・イ・ウ・ア・エ）"], ["(2)", "3番目：カ　5番目：オ", "The students singing on the stage are members of the chorus club. （エ・キ・カ・イ・オ・ウ・ア）singing 以下が students を後ろから説明する。"], ["(3)", "3番目：イ　5番目：オ", "What are those children looking at on the hill? （ウ・キ・イ・カ・オ・エ・ア）"], ["(4)", "3番目：カ　5番目：イ", "Shall I show you another color of that shirt? （キ・ウ・カ・ア・イ・オ・エ）"], ["(5)", "3番目：オ　5番目：ア", "My mother gets up early in the morning. （カ・ウ・オ・イ・ア・キ・エ）"], ["(6)", "3番目：イ　5番目：カ", "I will finish doing my math homework soon. （ウ・オ・イ・キ・カ・ア・エ）finish は「～し終える」で、あとに doing（動名詞）。"]]}, {"t": "問6 長文：オンラインショッピング（討論）", "items": [["(1)①", "ウ", "「日曜日はとても疲れているので、その日は（外出したくない）」。直前の so tired that ～ の結果を表す文。"], ["(1)②", "エ", "アンの発言。オンライン書店は欲しい本がほぼそろっており、書店を歩き回る必要がないので「時間を節約するのに役立つ（save our time）」。"], ["(2)", "どのようにインターネット（オンライン）を使うべきか考えること。", "森先生の最後の発言「今日からそれをどのように使うべきか考えるのがよい」から。（別解：使い方をよく考えて利用すること）"], ["(3)(a)", "ア", "セイオリは「オンラインの方が物が届くのに時間がかかる。だからお店で買うほうがむしろいい」と言っている → Kota は買い物に行けば「すぐ手に入れられる」。"], ["(3)(b)", "ウ", "コウタの意見に賛成（オンラインで買うのはよい）なのはアン（問題ない・時間の節約になる）。ユキ・セイオリ・ジャックは反対。ナオミは自分のルールを話し、森先生はナオミのやり方がよいと言っている。"], ["(4)", "イ", "ナオミは「オンラインで買うときは母に注文してもらう」。ア・ウ・エは本文と合わない。"], ["(5)", "ウ", "アンは「オンライン書店には欲しい本がほとんどある」ので、買い物に行くより欲しい物を探しやすいと考えている。"]]}, {"t": "問7 長文：メアリーとケンのハイキング計画（メール）", "items": [["(1)①", "ウ", "メアリーのメール。コースCは一番簡単だが「そのコースには見るものがない（the course doesn't have anything to see）」ので退屈かもしれない。"], ["(1)②", "エ", "ケンのメール。「コースがきつすぎて続けられないとわかったら、頂上に行くのをあきらめよう（give up going to the top）。そして途中で昼食にしよう」。"], ["(2)(a)", "イ", "メアリーの計画は9:30スタート、コースCは2時間 → 11:30ごろ頂上に着く → 正午前に着ける。"], ["(2)(b)", "ア", "ケンはコースBを選びたい理由として、写真で見た景色に感動し、自分の目で見たいと書いている。"], ["(3)", "メアリーの計画：エ（No.113）　ケンの計画：ア（No.107）", "メアリーは High West に9:15ごろ着く電車 → No.113（9:13着）。ケンは「メアリーの計画より1時間早く High West に着く必要がある」→ 8:15ごろ → No.107（8:08着、East Lake 7:27発）。No.109 は 8:36 着で遅い。※手書き解答はケンを「イ」としているが、「1時間早く」で計算すると No.107（ア）。"], ["(4)", "エ", "コースBの途中で海が見えるチャンスがある（ケンのメール・ロコミ）。アは計画が違う、イは「1時間」ではなく本文はコースAより短い、ウは傘は不向きと書いている。"]]}, {"t": "問8 自由英作文（10〜15語）", "items": [["Last weekend, I ～", "例：Last weekend, I played baseball with my friends in the park.", "12語。過去形（played）を使い、主語・動詞のある1文で書く。10〜15語に収める。つづりミス・時制ミスに注意。（例：Last weekend, I went to a bookstore and bought a new English dictionary.）"]]}], "S6_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−64", "−(4/3)² × (−6)² ＝ −16/9 × 36 ＝ −64。−(4/3)²は「−をつけた2乗」なので符号はマイナスのまま。"], ["(2)", "7", "20−5² ＝ 20−25 ＝ −5。−35 ÷ (−5) ＝ 7。"], ["(3)", "(8a+10b)/9", "通分して (9a+3b) − (a−7b) ＝ 8a+10b。→ (8a+10b)/9。かっこをつけて引くのでb の符号に注意。"], ["(4)", "a(3x−2)²", "共通因数 a をくくり出し、9x²−12x+4 ＝ (3x−2)²。"], ["(5)", "4√6", "−24/√6 ＝ −4√6。√32×(−2√3) ＝ −8√6。−4√6 −(−8√6) ＝ 4√6。"], ["(6)", "x = 10", "0.4x+2 ＝ 0.5x+1 → 1 ＝ 0.1x → x ＝ 10。"], ["(7)", "x = 1/3、y = 4/3", "上の式を6倍：2x−5y＝−6、下の式を8倍：4x+5y＝8。たすと 6x＝2 → x＝1/3。代入して y＝4/3。"], ["(8)", "イ", "S＝2πrh の両辺を 2πr でわると h＝S/(2πr)。"]]}, {"t": "問2 小問集合", "items": [["(1)", "−36−24√2", "a²−2ab−3b² ＝ (a−3b)(a+b) に因数分解。a+b＝6、a−3b＝3−√2−9−3√2＝−6−4√2。積は −36−24√2。"], ["(2)", "1/4", "大小2個のさいころで36通り。Pは右回りにa（大）、Qは左回りにb（小）進む。同じ頂点で出会うのは a+b が4の倍数のとき。和が4：3通り、8：5通り、12：1通りで計9通り。9/36 ＝ 1/4。"], ["(3)", "ア：②　イ：③　ウ：③　エ：①", "数学は Q1＝45・Q3＝85（四分位範囲40）、国語は Q1＝40・Q3＝75（35）。ア：国語のほうが大きいとはいえない（②）。イ：箱ひげ図では平均点はわからない（③）。ウ：85点の生徒がいるかは、最大値・四分位数の位置だけではわからない（③）。エ：第1四分位数が数学45点・国語40点なので、36人の1/4（9人）以上が45点以下（①）。"], ["(4)", "ウ", "立方体の面を、AからEFを通ってGまでの線が一直線になるよう展開する。展開図ウのように、辺EFをまたぐ2つの面が横にならんだ図で、A〜Gが直線になるものが最短の糸の通り道。"], ["(5)", "65度", "AB∥DO より ∠OAB＝∠AOD＝50°（錯角）。OA＝OB の二等辺三角形なので ∠AOB＝80°。∠BOD＝80°＋50°＝130°。円周角 ∠BCD＝130°÷2＝65°。"], ["(6)", "12cm", "水の量が1/8になると、水面の相似比は 1/2（体積比＝相似比の3乗）。深さは 24×1/2 ＝ 12cm。"], ["(7)", "1/24倍", "平行四辺形を、B(0,0)、C(3,0)、A(0,3)、D(3,3) の正方形に置いて考える（面積の比は変わらない）。O(1.5,1.5)、E(2,0)。直線DEとACの交点F(2.25,0.75)、OG∥BC なので G(2.5,1.5)。△OFG＝OG(1)×高さ(0.75)÷2＝0.375。0.375÷9＝1/24。"]]}, {"t": "問3 連立方程式（予防接種）", "items": [["(1)", "3000人", "12000人の75％＝9000人が1回または2回受けた。受けていない住民は 12000−9000＝3000人。"], ["(2)", "80/100 x + y", "8月1日に2回目を終えていた人＝2月1日にすでに2回目を終えていた人 y ＋ 1回目だけを終えていた人 x の80％。0.8x＋y＝8400。"], ["(3)", "1回目：3000人　2回目：6000人", "x＋y＝9000、0.8x＋y＝8400 を引くと 0.2x＝600 → x＝3000、y＝6000。"]]}, {"t": "問4 関数（放物線と直線）", "items": [["(1)", "a = 1/9", "点Aは直線 y＝x/3＋2 上で x＝−3 なので y＝1。y＝ax² が A(−3,1) を通るので 1＝9a → a＝1/9。"], ["(2)", "(3, 5)", "点B(6,4)。AOBCが平行四辺形なので、C＝A＋B−O ＝ (−3+6, 1+4) ＝ (3,5)。"], ["(3)", "27/2 cm²", "直線CAの傾きは 4/6＝2/3。A(−3,1)から x＝0 までで y＝1+2＝3 → D(0,3)。四角形DOBCの面積を座標から計算すると（D(0,3)・O(0,0)・B(6,4)・C(3,5)）、27÷2＝27/2。（△DOB＋△DBC などに分けても同じ）"]]}, {"t": "問5 図形（合同の証明と面積比）", "items": [["(1)ア", "FEB", "△AEC と △FEB の合同を示す。∠AEC＝∠FEB＝90°（仮定より）。"], ["(1)イ", "直角二等辺", "∠EBC＝45° かつ ∠BEC＝90° なので △EBC は直角二等辺三角形。"], ["(1)ウ", "EC", "直角二等辺三角形の2辺なので EC＝EB。"], ["(1)エ", "90", "∠ACE＝180°−∠AEC−∠EAC＝180°−90°−∠EAC＝90°−∠EAC。"], ["(1)オ", "1組の辺とその両端の角（がそれぞれ等しい）", "EC＝EB、∠AEC＝∠FEB＝90°、∠ACE＝∠FBE。"], ["(2)", "3：1", "EB＝4 なら EC＝4、AE＝6−4＝2。AE＝FE（合同）なので FE＝2、FC＝4−2＝2。△ABC＝6×4÷2＝12、△FBC＝FC×BE÷2＝2×4÷2＝4。12：4＝3：1。"]]}, {"t": "問6 数の性質（因数分解の利用）", "items": [["(1)", "m = 4、n = 2", "m²−n²＝(m+n)(m−n)＝12。m+n＞m−n で3通りの連立方程式（12×1、6×2、4×3）のうち、m、nが自然数になるのは m+n＝6、m−n＝2 → m＝4、n＝2。"], ["(2)", "2³×11×23", "2024÷2＝1012、÷2＝506、÷2＝253＝11×23。"], ["(3)", "4組", "2024＝(m+n)(m−n)で、m+n と m−n はともに偶数。2024＝2³×11×23 なので、2つの偶数の積に分けると (1012,2)、(506,4)、(92,22)、(46,44) の4通り（m+n＞m−n）。それぞれ m、n が自然数になる。"]]}], "S6_english": [{"t": "問1 対話文", "items": [["(1)", "イ", "「（　）I go to the festival tonight, mom?」「いいよ。でも8時までに帰ってきなさい」。許可を求める Can I ～?（～してもいい？）。"], ["(2)", "エ", "電話の定番表現。May I speak to Judy? に Speaking.（私です）と答える。"], ["(3)", "エ", "「水族館までの道を教えてください」→「いいですよ。あの青いバスに乗ってください（Take that blue bus.）」。"]]}, {"t": "問2 語を書く", "items": [["(1)", "between", "the day between Tuesday and Thursday（火曜と木曜の間の日）。"], ["(2)", "key", "箱を開けるために探すのは「かぎ（key）」。"], ["(3)", "long", "How long do you usually sleep?（どのくらいの間）—「約7時間」。"], ["(4)", "weather", "How's the weather there?（そちらの天気は？）—「くもりです」。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ウ", "last night（昨夜）なので過去形。an apple は単数 → was。"], ["(2)", "ア", "「このノートはだれの？」→「私のです（mine）」。It's のあとに名詞がないので「～のもの」を表す mine。"], ["(3)", "エ", "値段をたずねる How much。「3,000円です」と答えている。"], ["(4)", "イ", "乗り物の手段は by ＋乗り物（by bus）。"], ["(5)", "ウ", "「英語で書かれた手紙」→ written in English（言語は in）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "that / time", "then（そのとき）＝ at that time。"], ["(2)", "Dancing / is", "It is ～ for me to dance. ＝ Dancing is ～ for me。動名詞を主語にする。"], ["(3)", "taken / him", "The photos he took ＝ The photos taken by him（過去分詞の後置修飾）。"], ["(4)", "where / to", "where I should put ～ ＝ where to put ～（疑問詞＋to不定詞）。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：ウ　5番目：イ", "This shirt looks nicest of the three.（キ・カ・ウ・イ・エ・オ・ア）"], ["(2)", "3番目：エ　5番目：カ", "I was taking a bath when you called me.（キ・オ・エ・ア・カ・イ・ウ）when のあとに「あなたが電話した」。"], ["(3)", "3番目：キ　5番目：ア", "You don't have to come with me.（エ・イ・キ・ウ・ア・カ・オ）「～する必要はない」＝ don't have to。"], ["(4)", "3番目：エ　5番目：カ", "I was very surprised to see the scenery.（ウ・キ・エ・イ・カ・オ・ア）「～して驚いた」＝ surprised to ～。"], ["(5)", "3番目：ウ　5番目：ア", "My brother is good at playing basketball.（キ・イ・ウ・オ・ア・カ・エ）be good at ～ing＝～が得意。"], ["(6)", "3番目：オ　5番目：ア", "Is this town visited by many foreign tourists?（エ・イ・オ・キ・ア・カ・ウ）受け身の疑問文。"]]}, {"t": "問6 長文：日本での生活と言葉の問題", "items": [["(1)①", "ウ", "「一部の日本人、特に高齢者が私と話そうとせず、目をそらす。たぶん（私は彼らに好かれていない）」。I'm not liked by them。マコトが「誤解している」と返すので、ジュディの思い込みを表す。"], ["(1)④", "エ", "ユキの発言。もう1つ言語を学ぶのは「私には無理（it's impossible for me）」。英語でさえ簡単ではないと続く。"], ["(2)", "ウ", "language problem＝言葉の問題。日本の店員さんたちが外国人観光客の言葉を話せず、意思疎通がうまくできないこと。"], ["(3)", "Ⓐ：オ　Ⓑ：ア", "1位は日本に近い国（South Korea）、15位は France。会話中の「No.1は日本に最も近い国のひとつ」がヒント。アメリカが多い、ヨーロッパの国は2つだけ、がチャートの読み取り。"], ["(4)", "ウ", "「ジュディは日本に来て10週間」なので日本生まれではない。ア・イ・エは本文に合う。"], ["(5)", "イ", "マコト「アメリカには日本のファンがたくさんいる」。ウは「アメリカでは英語を話さない人が増えている」であり、日本ではない。"]]}, {"t": "問7 長文：北海道旅行のメール", "items": [["(1)①", "エ", "ケンのメールの First のあと「新幹線か飛行機か（2つの選択肢）」。→ how should we go to Hokkaido?（どうやって行くか）。"], ["(1)②", "ウ", "アンディ「5時のバスに乗らなければならない。（そんなに早く起きられる？）」。"], ["(2)(a)", "ウ", "新幹線は25,000円、飛行機は約20,000円。アンディが見つけた切符は8,000円。ケンの考えた飛行機（20,000円）より 12,000円安い。"], ["(2)(b)", "ア", "バスは朝5時発、空港に7時までに着く。選択肢の中で「2時間以内」に当たるのは約100分（手書き解答はア）。"], ["(3)", "イ", "行き方：飛行機（by air）。ケンは古い建物、アンディは美術館へ（別行動）。いっしょに行くのは野球場（baseball stadium）と夜景。表のイが合う。"], ["(4)", "エ・カ", "エ：ケンが見たい夜景は日本で最も美しい夜景のひとつとして有名。カ：アンディは「できれば新幹線で行きたい」＝1人なら飛行機に乗らない。アは「すでに買った」が不一致、イは時間の差が逆、ウは理由が違う、オは「新幹線が飛行機より速い」が逆。"]]}, {"t": "問8 英作文（5〜7語）", "items": [["彼女は私が理科を勉強するのを手伝ってくれました。", "She helped me study science.", "help A (to) 動詞の原形＝Aが～するのを手伝う。過去形 helped。5語。to を入れた She helped me to study science. でも正解（6語）。"]]}], "S7_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "3", "−5² は「5²の符号を変えたもの」で −25。−25 − 4×(−7) ＝ −25 + 28 ＝ 3。"], ["(2)", "32/3", "10−(−2)² ＝ 10−4 ＝ 6。(−3/4)² ＝ 9/16。6 ÷ 9/16 ＝ 6 × 16/9 ＝ 32/3。"], ["(3)", "−8ab/3", "4a²b ÷ 9a²b² × (−6ab²) ＝ −(4a²b × 6ab²)/(9a²b²) ＝ −24a³b³/9a²b² ＝ −8ab/3。÷は分母に、約分してから整理。"], ["(4)", "4x² + 2xy + 7y²", "(x−2y)² ＝ x²−4xy+4y²、3(x+y)² ＝ 3x²+6xy+3y²。たすと 4x²+2xy+7y²。"], ["(5)", "−3√2 + 4√3 − 6", "−12/√8 ＝ −12/(2√2) ＝ −6/√2 ＝ −3√2。−√2×(√18−√24) ＝ −√2×3√2 ＋ √2×2√6 ＝ −6 + 2√12 ＝ −6 + 4√3。"], ["(6)", "ア", "√15≒3.87、9/√5＝9√5/5≒4.02。√15 ＜ 4 ＜ 9/√5。"], ["(7)", "x = 4", "0.24x ＝ 0.96 → x＝4。"], ["(8)", "x = 6, −5", "展開して整理：x²+2x+1−3x−6−25 ＝ x²−x−30 ＝ (x−6)(x+5)＝0。"]]}, {"t": "問2 小問集合", "items": [["(1)", "5", "a²−3ab+b² ＝ (a+b)² − 5ab。a+b＝2√5、ab＝5−2＝3 → 20−15＝5。（対称式は a+b と ab で表す）"], ["(2)", "7/10", "袋は0〜4の5個。順に2個取るので 5×4＝20通り（同じ玉は取れない）。12の約数は 1,2,3,4,6,12。a+b＝1：2通り、2：2通り（(1,1)は不可）、3：4通り、4：4通り、6：2通り（(3,3)は不可）。合計14通り → 14/20＝7/10。"], ["(3)", "ウ", "ヒストグラムから、最小値30〜35、最大値65〜70、第1四分位数は45〜50、第2四分位数（中央値）は50〜55、第3四分位数は55〜60の階級。これに合う箱ひげ図がウ。"], ["(4)", "イ", "球の半径をrとすると、円柱は半径r・高さ2r。水の体積＝円柱−球＝2πr³−4/3πr³＝2/3πr³。底面積πr²で割ると水の高さ＝2/3r。全体の高さ2rの 1/3倍。"], ["(5)", "120度", "∠COD＝130°より、弧CDの円周角 ∠CAD＝65°。∠BAD＝95°なので ∠BAC＝30°。弧AB＝弧BC なので ∠ADB＝∠BDC＝30°。∠ADC＝60° → 円に内接する四角形の対角の和は180°なので x＝∠ABC＝180°−60°＝120°。"], ["(6)", "1/3倍", "BE・CD は中線なので、F は △ABC の重心。重心は中線を 2：1 に分けるので、△FBC は △ABC の 1/3。"], ["(7)", "207π cm³", "FC（辺CDの上）を軸に回転させる。正方形（1辺6cm）を回転させると円柱（半径6・高さ6）＝216π。切り取った直角二等辺三角形DEFを回転させると円すい（半径3・高さ3）＝1/3×9π×3＝9π。216π−9π＝207π。"]]}, {"t": "問3 方程式の利用（なしとももの販売）", "items": [["(1)⑦", "31−x", "箱は全部で35個。なしが x 箱なら、ももは 35−x 箱。そのうち4箱は値引きなので、定価で売れたのは (35−x)−4＝31−x 箱。"], ["(1)①", "4", "売れ残った4箱を 900円の10％引き（900×0.9）で売った。"], ["(2)⑦", "x/4 + y/3", "1箱になしが4個、ももが3個。なし x 個は x/4 箱、もも y 個は y/3 箱。合計35箱。"], ["(2)①", "y − 12", "4箱（1箱3個）は値引きなので 12個。定価で売れたももは y−12 個。"], ["(3)", "なし72個、もも51個", "①：x/4＋y/3＝35 → 3x＋4y＝420。②：250x＋300(y−12)＋3240＝32940 → 5x＋6y＝666。①×3：9x＋12y＝1260、②×2：10x＋12y＝1332。引くと x＝72、y＝51。（確認：72÷4＝18箱、51÷3＝17箱、合計35箱）"]]}, {"t": "問4 関数（放物線）", "items": [["(1)", "(−4, −16)", "B(4, −16)（y＝−x²）。CはBと y 座標が等しく、y＝−x² 上の点なので、x＝−4 → C(−4, −16)。"], ["(2)", "a = 1/4", "A(4, 16a)。BC＝8、AB＝16a＋16。△ABC＝ABを底辺にすると、高さは C と直線 AB の距離 8。1/2×(16a+16)×8＝80 → 16a＋16＝20 → a＝1/4。"], ["(3)", "(0, −7)", "a＝1/8 → A(4, 2)、B(4, −16)。AD＝BD より D は線分ABの垂直二等分線上。AB の中点の y 座標は (2−16)/2＝−7。D は y軸上なので D(0, −7)。"]]}, {"t": "問5 図形（合同の証明）", "items": [["(1)⑦", "①③", "AB＝DC（①）、DC＝FD（③）より AB＝FD（⑤）。"], ["(1)①", "②④", "AD＝BC（②）、BC＝BE（④）より BE＝DA（⑥）。"], ["(1)⑦", "⑤⑥⑨", "AB＝FD、BE＝DA、∠ABE＝∠FDA。"], ["(1)Ⓐ", "CDF", "∠FDA＝∠CDA−∠CDF＝90°−60°＝30°。"], ["(1)Ⓑ", "2組の辺とその間の角", "2組の辺とその間の角がそれぞれ等しいので、△ABE≡△FDA。"], ["(2)", "15度", "∠ABE＝30°、∠AGE＝75°は △ABG の外角なので ∠GAB（＝∠FAB）＝75°−30°＝45°。合同より ∠BAE＝∠AFD。△FDA で ∠FDA＝30°、∠DAF＝90°−45°＝45° → ∠AFD＝105°。∠BAE＝105° → ∠DAE＝105°−90°＝15°。"]]}, {"t": "問6 平方根と整数部分・小数部分", "items": [["(1)⑦・①", "⑦：2　①：√5−2", "2²＜5＜3² より 2＜√5＜3。整数部分は2、小数部分は √5−2。"], ["(2)⑦", "5−2√5", "x＝√5−2 を x(x+2) に代入：(√5−2)×√5＝5−2√5。"], ["(3)", "a = (1+√17)/2", "a²＝6＋b、0≦b＜1 より 6≦a²＜7。2²＜a²＜3² なので a の整数部分は 2。a＝2＋b → b＝a−2。a²＝6＋(a−2) → a²−a−4＝0 → a＝(1±√17)/2。a＞0 より a＝(1+√17)/2。"]]}], "S7_english": [{"t": "問1 対話文", "items": [["(1)", "エ", "Thank you for your support.（応援ありがとう）。thank you for ～＝～をありがとう。"], ["(2)", "ア", "What's wrong?（どうしたの？）— 頭痛がします。具合の悪い人にたずねる決まり文句。"], ["(3)", "イ", "I'm looking forward to seeing you.（お会いするのを楽しみにしています）。look forward to ～ing。"]]}, {"t": "問2 語を書く", "items": [["(1)", "color", "Which color do you like better, black or blue?（どちらの色が好き？）"], ["(2)", "would", "What would you like to have today?（今日は何になさいますか）。would like to ～＝～したい（ていねいな言い方）。"], ["(3)", "Thursday", "Thursday is the day between Wednesday and Friday.（水曜日と金曜日の間の日）。"], ["(4)", "umbrella", "急に雨が降り出したが、かさ（umbrella）を持っていなかったので、ぬれた。"]]}, {"t": "問3 適語選択", "items": [["(1)", "エ", "How long are you going to stay ...?（どのくらいの期間）— 3日間。期間をたずねる。"], ["(2)", "イ", "Wash your hands before you have lunch.（昼食を食べる前に手を洗いなさい）。"], ["(3)", "ウ", "What does your uncle call you?（おじさんはあなたを何と呼ぶ？）— シンちゃん。call A B＝AをBと呼ぶ。"], ["(4)", "ア", "a small park next to my house（私の家のとなりの小さな公園）。"], ["(5)", "エ", "it is written in French（それはフランス語で書かれている）。受け身。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "when / was", "at the age of 28 ＝ when she was 28（28歳のときに）。"], ["(2)", "gave / me", "I got a book from her. ＝ She gave me a book."], ["(3)", "Both / and", "Both Koji and Yuki are from Nagano City.（コウジもユキも）。both A and B は複数扱い（are）。"], ["(4)", "higher / other", "the highest ＝ higher than any other ～（ほかのどの～よりも高い）。other のあとは単数名詞。"]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：ウ　5番目：イ", "I have lived in this town for ten years.（キ・カ・ウ・オ・イ・ア・エ）"], ["(2)", "3番目：ア　5番目：エ", "She was listening to music in her room.（ウ・キ・ア・オ・エ・カ・イ）"], ["(3)", "3番目：イ　5番目：ウ", "That dog running over there is mine.（カ・エ・イ・キ・ウ・オ・ア）running over there が dog を後ろから説明。"], ["(4)", "3番目：イ　5番目：エ", "That house which has a red roof was built last year.（ウ・キ・イ・カ・エ・ア・オ）関係代名詞 which。"], ["(5)", "3番目：エ　5番目：ア", "I believe that it will be sunny tomorrow.（オ・イ・エ・キ・ア・カ・ウ）believe that ～。"], ["(6)", "3番目：ウ　5番目：イ", "She didn't have time to talk with you.（エ・ア・ウ・オ・イ・カ・キ）time to ～（～する時間）。"]]}, {"t": "問6 対話文：図書館（ジャックとモモ）", "items": [["(1)①", "イ", "「公園のベンチで do that」＝前の文の reading（本を読む）→ read a book。"], ["(1)③", "ア", "「Do you always go there in that way?」＝モモが教えた行き方（電車→バス→歩き）。the way Momo told to Jack。"], ["(2)②", "ウ", "日本語のウェブサイトでしたね、ジャック、「あなたは日本語が読めない」でしょ？ → you can't read Japanese。"], ["(2)④", "イ", "模範解答はイ（getting a bike later）。文脈（「電車とバスが大変なら、徒歩で帰る」案）ではエ borrowing the book today も自然に読めるので、公式解答の根拠は確認してください。"], ["(3)", "イ", "日本語ページには図書館の地図があった（Of course, the Japanese pages had a map…）。バス停 → 南プール → 図書館が右側にある図が、モモの道案内に合うイ。"], ["(4)", "エ", "「15冊とDVD1枚を15日間借りられる」ので、2週間より長く借りられる。ア：自転車の規則は書かれていない。イ：15冊借りていてもさらに借りられないとは書かれていない。ウ：DVDは1枚。"], ["(5)", "エ", "ジャックは「DVDがあるかわからない」と言っている（Does the library have any DVDs?）。ア：本は図書館で借りる。イ：英語のページは見つからなかった。ウ：モモは図書館に行ったことがある。"]]}, {"t": "問7 スピーチ：インターネットと私たち（トム）", "items": [["(1)①", "ウ", "「インターネットのおかげで多くのことが可能になった。しかし、（それは私たちにいくつかの問題ももたらす）」。However（しかし）のあとで、「問題」の話につながる。"], ["(1)②", "ア", "「ゲームはあまり人気がない。意外だ。クラスメートはいつもオンラインゲームについて話しているから」。talk about online games。"], ["(2)ⓐ", "エ（13）", "Graph A：6時間以上が27％、5時間以上は全体で40％。5〜6時間未満＝40−27＝13％。"], ["(2)ⓑ", "キ（282）", "平日の平均利用時間は約5時間。選択肢で約5時間（300分）に近い282分。"], ["(3)ⓐ", "ウ（音楽を聴く）", "4位。ゲームは「音楽を聴くより人気がない」と本文にあるので、音楽がゲームより上位の4位。"], ["(3)ⓑ", "エ（勉強する）", "6位。マンガ（7位）は32％で、勉強にインターネットを使うのは約40％以下。"], ["(4)", "エ・カ", "エ：トムは「5時間は長すぎる」と考えている。カ：動画を見るのは日本語を上達させるため。ア：グラフを使っている、イ：家族と話す機会が減った、ウ：勉強のほうが大事、オ：「使うべきでない」とは言っていない。"]]}, {"t": "問8 英作文（8〜10語）", "items": [["私にこのカメラの使い方を教えてください。", "Please tell me how to use this camera.", "8語。「～してください」なので Please ～（命令文）。疑問文（Can you ～?）は使わない。how to ～＝～のしかた。Please show me how to use this camera. も可。"]]}], "A5_math": [{"t": "問1 計算・方程式の小問", "items": [["(1)", "−2/5", "−9/10 × (−2/3)² ＝ −9/10 × 4/9 ＝ −2/5。2乗を先に計算し、約分する。"], ["(2)", "3", "−4² は「4²の符号を変えたもの」で −16。(−16+1)÷(−5) ＝ −15÷(−5) ＝ 3。"], ["(3)", "(3x−4y)/4", "通分して (2(2x−y) − (x+2y))/4 ＝ (4x−2y−x−2y)/4 ＝ (3x−4y)/4。（3/4x − y と書いても正解）"], ["(4)", "a(x−4)²", "共通因数 a でくくる：a(x²−8x+16) ＝ a(x−4)²。"], ["(5)", "√6", "√24＝2√6。2√12×1/√8 ＝ 2×2√3/(2√2) ＝ 2√3/√2 ＝ √6。2√6−√6＝√6。"], ["(6)", "x = 3", "両辺に35をかけて 7(x+2)＝5(2x+1) → 7x+14＝10x+5 → x＝3。"], ["(7)", "x = 4, y = 6", "上の式を12倍：3x−8y＝−36。下の式を3倍：3x+y＝18。引くと −9y＝−54 → y＝6、x＝4。"], ["(8)", "ウ", "ℓ＝2πr の両辺を 2π でわって r＝ℓ/2π。"]]}, {"t": "問2 小問集合", "items": [["(1)", "21 + 12√3", "a²−2ab+b²＝(a−b)²。a−b＝2√3+3。2乗して 12+12√3+9＝21+12√3。"], ["(2)", "5/36", "偶数は右回り・奇数は左回り。5頂点なので5で割った余りで考える。1→−1（余り4）、2→+2、3→−3（余り2）、4→+4、5→0、6→+6（余り1）。2回の合計が5の倍数になるのは (5,5)の1通りと、余り1と余り4の組（6と1か4）：(6,1)(6,4)(1,6)(4,6)の4通り。合計5通り → 5/36。"], ["(3)", "エ", "36人なので、第1四分位数以下に9人入る。A組・B組とも第1四分位数が15m以下なので、15m以下の生徒が9人以上いる（エ）。アの範囲はB組の方が大きい、イは30mの生徒がいるとは限らない、ウは第3四分位数と第2四分位数の関係が逆。"], ["(4)", "ウ", "展開図を組み立てると、P と C は立方体の同じ辺の両端になるので、線分PCが最も短い（立方体の辺）。"], ["(5)", "25度", "平行四辺形で対角は等しいので ∠ABC＝∠D＝60°。直線ℓ・mが平行なので錯角から、∠x＝60°−35°＝25°。"], ["(6)", "224π cm³", "P：底面の半径5・高さ12の円すい＝1/3×25π×12＝100π。Q：半径9・高さ12＝1/3×81π×12＝324π。差は 324π−100π＝224π。"], ["(7)", "a/3 cm", "正方形の1辺を1とする。AC：y＝1−x（A(0,1)、C(1,0)、B(0,0)）、E(1,1/3)、F(5/7,1)。BE：y＝x/3、BF：y＝7x/5。G(3/4, 1/4)、H(5/12, 7/12)。GHのx座標の差は 3/4−5/12＝1/3、斜め45°なので GH＝√2/3。AC＝√2 なので GH＝AC×1/3＝a/3。"]]}, {"t": "問3 連立方程式（貯金箱の硬貨）", "items": [["(1)", "x + 6 枚", "花子さんから100円硬貨6枚を受け取って貯金箱に入れたので、x＋6枚。"], ["(2)", "エ", "100円硬貨のちょうど…「100円硬貨の枚数は10円硬貨の1/5」という、両替した後の100円硬貨と10円硬貨の枚数の関係。式は x＋6＝(y−60)/5。（100円6枚＝10円60枚に両替）"], ["(3)", "100円硬貨5枚、10円硬貨115枚", "①：100x＋850＋10y＝2500 → 10x＋y＝165。②：5(x+6)＝y−60 → 5x−y＝−90。たすと 15x＝75 → x＝5、y＝115。確認：500＋850＋1150＝2500円。"]]}, {"t": "問4 関数", "items": [["(1)", "(2, −2)", "①y＝−x と②y＝−4/x の交点。−x＝−4/x → x²＝4。Aのx座標が−2なのでBはx＝2、y＝−2。"], ["(2)", "a = −1/2", "③y＝ax² がB(2,−2)を通るので −2＝4a → a＝−1/2。"], ["(3)", "(−3, −9/2)", "P(p, −p²/2)（p＜0）。AB の長さ4√2、直線ABは x＋y＝0。Pと直線ABの距離は |p−p²/2|/√2。面積＝1/2×4√2×|p−p²/2|/√2＝2|p−p²/2|＝15。p＜0 なので p²/2−p＝15/2 → p²−2p−15＝0 → p＝−3。P(−3, −9/2)。"]]}, {"t": "問5 図形（相似の証明）", "items": [["(1)ア・イ・ウ・エ", "ア：ADB　イ：DAE　ウ：EDB　エ：DEA", "∠DAB＝∠ADB（AB＝BDの二等辺三角形）。①②より ∠ACB＝∠DAE（③）。∠EBD＝∠EDB（BE＝EDの二等辺三角形）。④⑤⑥より ∠CBD＝∠EDB（錯角が等しいので CB∥DE）。同位角から ∠ABC＝∠DEA（⑦）。"], ["(1)オ", "2組の角（がそれぞれ等しい）", "③∠ACB＝∠DAE、⑦∠ABC＝∠DEA の2組の角が等しいので △ACB∽△DAE。"], ["(2)", "30度", "円周＝12π、弧BC＝3πなので中心角90°、円周角 ∠BAC＝45°。∠ABD＝∠CBD＝x とすると ∠ABC＝2x、∠ACB＝∠ADB＝(180°−x)/2。△ABCの内角の和：45°＋2x＋(90°−x/2)＝180° → 3x/2＝45° → x＝30°。"]]}, {"t": "問6 規則性（正六角形の模様とコマ）", "items": [["(1)", "エ（6, 2）", "EからDへは1回で動けない。2回で E→（6の位置）→D となる組を探す。EからDのとなりを通ってDへ、(6,2) が条件に合う。"], ["(2)", "1/18", "Cの位置へ2回で行く組み合わせは2通り。2/36＝1/18。"], ["(3)a・b・c", "a：12　b：15　c：I", "3回投げて、Eにいる場合は12通り、Iにいる場合は15通り。したがって、Iの位置にいる確率のほうが大きい。"]]}], "A5_english": [{"t": "問1 対話文", "items": [["(1)", "ア", "「カップを取って」→「はい、どうぞ（Here you are.）」。物を手渡すときの決まり文句。"], ["(2)", "イ", "May I help you?（いらっしゃいませ／お手伝いしましょうか）— 「いいえ、結構です（No, thank you.）。見ているだけです」。「見ているだけ」と続くので断る返事。"], ["(3)", "ア", "「私はキャシーに賛成です」—「私も（Me, too.）。彼女の意見は正しいと思う」。賛成に同意する返事。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "late（手書き解答は last と読めます）", "「父は夜（　）帰ってくる。昨夜は午後11時に帰ってきた」。l＋3文字で「遅く」＝late が文意に合う。手書き解答欄は last と読めるので、原本を確認してください。"], ["(2)", "daughter", "ケイコは女の子。彼女は両親のたった1人の娘（daughter）。"], ["(3)", "often", "How often do you go to the library?（どのくらいの頻度で）— 月に一度。"], ["(4)", "full", "Would you like another dish?—いいえ、結構です。おなかがいっぱい（I'm full）です。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ア", "Let me introduce my uncle to you.（私のおじをあなたに紹介させてください）。let＋人＋動詞の原形。"], ["(2)", "ウ", "How do you come to this gym on the rainy day?—バスで来ます。手段をたずねる How。"], ["(3)", "エ", "She has been painting a picture since 10 a.m.（午前10時からずっと絵を描いている）。現在完了進行形（have been ＋ ～ing）。"], ["(4)", "ウ", "Let's ask the police officer standing over there.（あそこに立っている警察官にたずねよう）。現在分詞の後置修飾。"], ["(5)", "イ", "He is the artist who made a lot of popular songs.（人を表す関係代名詞 who）。"]]}, {"t": "問4 同じ意味の書きかえ", "items": [["(1)", "has / lived", "He began to live ... two years ago and still lives there. ＝ He has lived in New York for two years.（現在完了・継続）"], ["(2)", "going / to", "I will go ... ＝ I am going to go camping next Saturday.（be going to ～）"], ["(3)", "smaller / than", "not as big as ＝ smaller than（～より小さい）。"], ["(4)", "My / favorite", "I like P.E. the best. ＝ My favorite subject is P.E."]]}, {"t": "問5 並べかえ（3番目と5番目）", "items": [["(1)", "3番目：エ　5番目：ウ", "Don't be afraid of making a speech in English.（オ・イ・エ・キ・ウ・ア・カ）be afraid of ～ing＝～するのを恐れる。"], ["(2)", "3番目：ウ　5番目：ア", "What do you want me to do?（カ・オ・ウ・キ・イ・ア・エ）want 人 to ～。※解答の並びは「What do you want me to do?」"], ["(3)", "3番目：カ　5番目：オ", "Will you tell them how to play the sport?（キ・エ・カ・イ・オ・ア・ウ）how to ～＝～のしかた。"], ["(4)", "3番目：オ　5番目：エ", "I am good at playing the guitar.（ウ・キ・オ・イ・エ・ア・カ）"], ["(5)", "3番目：オ　5番目：エ", "Who can play basketball the best of the three?（ウ・キ・オ・イ・エ・カ・ア）the best of the three＝3人の中でいちばん。"], ["(6)", "3番目：ア　5番目：ウ", "There is a large park in front of my house.（オ・キ・ア・カ・ウ・イ・エ）in front of ～＝～の正面に。"]]}, {"t": "問6 対話文：クラブ活動は全員がするべきか", "items": [["(1)", "チームメイトとうまくやる方法や、年上の人とコミュニケーションを取る方法。", "These things は直前のジュディの発言「勉強では学べない多くのこと」＝For example の2つ（①how to do well with teammates ②how to communicate with older persons）。"], ["(2)②", "エ（I'm for Kaori, too.）", "キャシーは、トシ（カオリに賛成）に続けて自分の考えを述べる。同じくクラブ活動は全員がやる必要はないという立場なので「私もカオリに賛成です」。"], ["(2)③", "ウ（OK）", "森先生のまとめ：「どちらの場合も（OK）。生徒にはそれぞれの事情があるから」。"], ["(3)(a)", "エ", "トシ（My dream is to become a professional soccer player）とキャシー（I want to become a professional pianist）は、どちらも夢のために時間を使いたい。"], ["(3)(b)", "ア", "「お金を払う」という話は出ていない。ウ（休日にも活動：on many of our holidays）、エ（good times and bad times）、イ（the things I need…）は本文にある。"], ["(4)", "イ", "カオリは、週末や長期休みに「家で自分の好きなことがしたい」から。"], ["(5)", "イ", "ヒデは、クラブ活動を通して「本当の友達」ができると言っている。"]]}, {"t": "問7 長文：インターネットの歴史", "items": [["(1)①", "エ（the history of the Internet）", "直前に「いつ、どのように生まれたか知っていますか」とあり、続くのはインターネットの歴史の話。"], ["(1)②", "イ（hard）", "「コンピュータは大きくて重く、動かすのが（hard）だった」。so ～ that…＝とても～なので…。"], ["(2)(a)", "エ", "約60年前、研究者たちは「コンピュータの中のデータをもっと簡単に手に入れたかった」（Many researchers wanted to improve the bad situation.）。"], ["(2)(b)", "ウ", "スプートニクは、アメリカにコンピュータネットワークシステムをつくる発想を与えた（戦争後もデータをやり取りする方法を考え始めた→1969年に最初のシステム）。"], ["(3)", "エ", "this problem＝直前の「システムを使うことを許された人が少数だった」。つまり、多くの人がネットワークシステムに参加できなかった。"], ["(4)", "ア・ウ", "ア：60年ほど前に政府の研究者がコンピュータを使っていた（本文冒頭）。ウ：1967年に考え始め、1969年に最初のシステムができた＝約2年。イ：最初の人工衛星はソビエト連邦。エ：最初のシステムはアメリカ。オ：インターネットの誕生は約25年ではなく、1983年。"]]}, {"t": "問8 自由英作文（10〜15語）", "items": [["What do you want to try at high school?", "I want to try a sport that I have never played at high school.", "例（14語）。I want to ～ で始め、10〜15語。例：I want to be a member of the baseball club at school."]]}], "A6_math": [{"t": "問1 計算・方程式", "items": [["(1)", "35/8", "−7/12 ÷ (−2/15) ＝ 7/12 × 15/2 ＝ 105/24 ＝ 35/8。わり算は逆数をかけ、約分する。"], ["(2)", "−15/2", "(−3²)＝−9。−9 − 5×(−3/10) ＝ −9 ＋ 3/2 ＝ −18/2 ＋ 3/2 ＝ −15/2。（−3² は「3²の符号を変えたもの」）"], ["(3)", "6x³", "9x² × 4x²y² ÷ 6xy² ＝ 36x⁴y² ÷ 6xy² ＝ 6x³。"], ["(4)", "x²＋5x−19", "(x+2)(2x−5)＝2x²−x−10、(x−3)²＝x²−6x+9。引くと x²＋5x−19。"], ["(5)", "4√3", "√24÷√8＝√3、√27＝3√3。√3＋3√3＝4√3。"], ["(6)", "x = −0.3（−3/10）", "両辺を10倍して 5(8x+3)＝6(5x+2) → 40x+15＝30x+12 → 10x＝−3 → x＝−3/10。"], ["(7)", "x = 2±√7", "解の公式：x＝(4±√(16+12))/2 ＝ (4±2√7)/2 ＝ 2±√7。"], ["(8)", "−13", "式を整理：10x+2y−12x+4y＝−2x+6y。x＝2, y＝−3/2 を代入して −4−9＝−13。"]]}, {"t": "問2 小問集合", "items": [["(1)", "ア, イ", "4＜√6n＜5 の各辺を2乗して 16＜6n＜25。n＝3 のとき18、n＝4 のとき24 で条件に合う。ウ(36)・エ(108)・オ(144)は大きすぎる。"], ["(2)", "12個", "18の約数は 1,2,3,6,9,18。正の組が6個、負の組が6個で合計12個。"], ["(3)", "0.48", "8.0〜8.5 の度数は 25−(1+4+10+2+1)＝7。8.5秒未満は 1+4+7＝12人。12÷25＝0.48。"], ["(4)", "エ", "中心角45°は360°の 45/360＝1/8。したがって円の1/8倍。"], ["(5)", "45度", "四角形AODCに注目。∠ODC＝180°−55°＝125°。△OBDは OB＝OD の二等辺三角形で ∠BOD＝180−55×2＝70°。∠AOD＝360−150−70＝140°。四角形の内角の和360°より ∠OAC＝360−(140+125+50)＝45°。"], ["(6)", "54cm²", "BG:GD＝BE:AD＝1:3、DH:HB＝DF:AB＝1:2。五角形＝△BCD(72) − △BEG − △DFH。△BEG＝△ABE(24)×1/4＝6、△DFH＝△ADF(36)×1/3＝12。72−6−12＝54。"], ["(7)", "243cm³", "立体ACFHは、立方体から角の三角すい4つ（各 9×9÷2×9÷3＝121.5）を引いたもの：729−4×121.5＝243。"]]}, {"t": "問3 運動量（表の読み取り・連立方程式）", "items": [["(1)", "1.5エクササイズ", "普通歩行の強度は3メッツ。30分＝0.5時間なので 3×0.5＝1.5。"], ["(2)", "3x＋6y＝23", "普通歩行（強度3）がx時間、バスケットボール（強度6）がy時間。エクササイズ＝強度×時間なので 3x＋6y＝23。"], ["(3)", "普通歩行 2時間20分、バスケットボール 2時間40分", "x＋y＝5 と 3x＋6y＝23 を解く。y＝5−x を代入して 3x＋30−6x＝23 → x＝7/3（＝2時間20分）、y＝8/3（＝2時間40分）。"]]}, {"t": "問4 関数", "items": [["(1)", "(−2, −1)", "A の x座標は −2。Cは直線 x＝−2 と ②y＝−x²/4 の交点なので y＝−(4)/4＝−1。"], ["(2)", "y＝2/3 x＋1/3", "B(1, 1)、C(−2, −1)。傾き＝(1−(−1))/(1−(−2))＝2/3。B を通るので 1＝2/3＋b → b＝1/3。"], ["(3)", "16/3", "△PBC＝△ABC で BC が共通なので、AP∥BC。A(−2, 4) を通る傾き2/3の直線 y＝2/3(x+2)＋4 の y切片が P。x＝0 で y＝4/3＋4＝16/3。"]]}, {"t": "問5 円と相似", "items": [["(1)⑦", "DBE", "AEに対する円周角：∠ACE＝∠ABE（＝∠DBE）。"], ["(1)⑧", "BCD", "BEに対する円周角：∠DAE＝∠BAE＝∠BCE（＝∠BCD）。"], ["(1)⑨", "DAE", "AE∥FD より、錯角で ∠FDA＝∠DAE。"], ["(1)⑩", "DBE", "④(∠DAE＝∠DBE)と⑤より ∠FDA＝∠DBE。"], ["(1)⑪", "BED", "BCに対する円周角：∠DAF＝∠BAC＝∠BEC＝∠BED。"], ["(1)⑫", "2組の角", "⑥∠FDA＝∠DBE と ⑦∠DAF＝∠BED より「2組の角がそれぞれ等しい」。相似条件の言い方を覚えておく。"], ["(2)", "25/6 cm²", "CEは∠ACBの二等分線なのでAE＝BE＝5。ABは直径なので∠AEB＝90°、△ABEは直角二等辺三角形で面積 5×5÷2＝25/2。角の二等分線の性質で AD:DB＝AC:BC＝2:1。△EDB＝△ABE×1/3＝25/6。"]]}, {"t": "問6 ナースウォッチ（反比例）", "items": [["(1)a", "100", "表の「時間×脈拍数」は 15×60＝900 で一定。a＝900÷9＝100。"], ["(1)b", "45", "b＝900÷20＝45。"], ["(2)", "反比例", "時間と脈拍数の積が一定（900）なので「反比例」。"], ["(3)", "80回", "20回数えるものでは 20秒で60回なので積は 20×60＝1200。15秒のとき 1200÷15＝80回。"]]}], "A6_english": [{"t": "問1 対話文", "items": [["(1)", "ウ", "「あのレストランで昼食を食べるのはどう？」—「いい考えだね」。How about ～ing? で「～するのはどう」。having が続くので How about。（Why don't we は後ろが動詞の原形）"], ["(2)", "ア", "「私はスポーツが好き。（あなたは？）」—「うーん、私はあまりスポーツが好きじゃない」。How about you?（あなたはどう？）が自然。"], ["(3)", "ウ", "「私はダンスが好きではない」—「私もです（Me, either.）。なぜ友達が好きなのか理解できない」。否定文への同意は either（too は肯定文）。"]]}, {"t": "問2 語を書く（頭文字つき）", "items": [["(1)", "dictionary", "「私たちは言葉の意味を知るために（辞書）を使う」。"], ["(2)", "September", "「（9月）は1年の9番目の月」。"], ["(3)", "famous", "「だれもが彼を知っている。彼は（有名な）科学者です」。"], ["(4)", "hungry", "「私はとても（おなかがすいて）います」—「私も！ あのハンバーガー店で昼食にしよう」。"]]}, {"t": "問3 適語選択", "items": [["(1)", "ア", "主語が Mike and his brother（複数）で現在の習慣なので get。「毎朝6時30分に起きる」。"], ["(2)", "ウ", "「ふだんアンドリューを（何と）呼びますか」—「アンディと呼びます」。call A B の B をたずねるので What。"], ["(3)", "エ", "「消しゴムを貸してくれませんか」—（もちろん）。続く「はい、どうぞ」とつながるのは Sure。"], ["(4)", "ウ", "be good at ～「～が得意」。「数学は私が得意ではない教科です」。"], ["(5)", "ウ", "While I was in the United States,「アメリカにいる間に」。後ろに主語＋動詞が続くので接続詞 While。（During は後ろが名詞）"]]}, {"t": "問4 書きかえ", "items": [["(1)", "teaches us", "「スミス先生は私たちの英語の先生です」＝ Mr. Smith teaches us English.（teach 人 物）"], ["(2)", "Because, met", "「なぜケンは公園に行ったの？」—「旧友に会うために」＝「Because he met his old friend.」（旧友に会ったから）"], ["(3)", "made, me", "「私はその映画を見てわくわくした」＝ The movie made me excited.（〜が私を…にした）"], ["(4)", "Do, waste", "「時間をむだにしてはいけない」＝ Do not waste your time.（must not ＝ Do not）"]]}, {"t": "問5 並べかえ（3番目と5番目の記号）", "items": [["(1)", "3番目：カ　5番目：ウ", "I want those poor children to live a happy life.（want 人 to ～）→ キ イ カ エ ウ ア オ。"], ["(2)", "3番目：ウ　5番目：キ", "We don't know how old Mr. Mori is.（間接疑問文：how old ＋ 主語 ＋ be動詞）→ カ オ ウ イ キ エ ア。"], ["(3)", "3番目：ウ　5番目：エ", "You will be able to ride a unicycle soon.（will be able to ＝ できるようになるだろう）→ オ キ ウ イ エ ア カ。"], ["(4)", "3番目：ア　5番目：キ", "Have you ever been to foreign countries?（経験をたずねる現在完了）→ オ エ ア ウ キ イ カ。"], ["(5)", "3番目：カ　5番目：ウ", "All of them know that I am from Hokkaido.（all of them 彼らはみな）→ キ エ カ ア ウ イ オ。"], ["(6)", "3番目：キ　5番目：イ", "The chorus contest was held at this concert hall last year.（受け身）→ ウ オ キ エ イ ア カ。"]]}, {"t": "問6 対話文：サヤカと先生の将来の夢", "items": [["(1)①", "ウ", "空所は「あなたの夢が（　）ことを願っています」。サヤカは「アニメ制作に関わる仕事をする夢がある」と話しているので、ウ「your dream will come true（夢がかなう）」。"], ["(1)②", "ア", "空所は「もちろんそれらの職業がすばらしいことは分かります。でも（　）」。サヤカは自分の夢（アニメーター）を持っているので、ア「I'm not interested in them at all（それらにはまったく興味がない）」。"], ["(2)", "エ", "Chart A の1・2・3・5位は Chart B にもある職業。4位だけは Chart B にない職業なので、選択肢で Chart B にないエ「Actor or singer」。（Teacher・Doctor・Nurse は Chart B にある）"], ["(3)(a)", "イ", "先生の説明「Parents usually want their children to be always happy.」（親は子供が常に幸せであってほしい）。サヤカの夢は安定していないので、「生活が大変かもしれないから」。"], ["(3)(b)", "ウ", "先生の発言「I found an article about that on an online news site this morning.」→ On the Internet。"], ["(4)", "エ", "「Many of them often come to Japan and travel all over. anime is important economically.」→ 日本のファンは日本に来て、お金を使う＝Lots of money。"], ["(5)", "イ", "サヤカは「好きなことを将来の仕事に生かしたい（I want to use my ability for my favorite thing）」。先生も最後に「アニメーターになる夢を誇りに」と励ましている。アは completely agrees が誤り、ウ「ずっと重要な貿易品だった」は本文は「今日」の話、エは「安定した仕事だと確信している」が誤り。"]]}, {"t": "問7 メール文：オーストラリアからの生徒の来校", "items": [["(1)①", "イ", "「祭りで日本舞踊や金魚すくいなどを体験できる。それらの活動は日本の文化を学ぶのに役立つ。きっと（　）」。ここまでの流れから、イ「they'll have a very good time（きっと楽しい時間を過ごすだろう）」。"], ["(1)②", "イ", "「9月20日…午後は通りが混んでいる。また長旅のあとなので（　）」。イ「the students must be tired（生徒たちは疲れているにちがいない）」。休憩（short break）をとる提案につながる。"], ["(2)(a)", "ア", "「Next day, at English class, they will make a speech to tell us how they spend at their school.」→ 学校生活についてスピーチ。"], ["(2)(b)", "イ", "ナンシーのクイズ大会の提案：「オーストラリアの生徒と日本の生徒がたがいにクイズを出し合う」＝たくさん話し合えるように。"], ["(3)", "エ", "「飛行場から桜駅へは電車、桜駅から緑駅へも電車、緑駅から学校へバス」と本文。→ エ。"], ["(4)", "ウ, カ", "ウ：ナンシーは回復してきているが、「来週は学校に行ける」ので明日はまだ行けない。エ・オは本文に合わない。カ：「通りが午後は混んでいる」と書いている。"]]}, {"t": "問8 英作文", "items": [["(1)", "He has been making a cake for three hours.", "「3時間ずっと作っている」＝現在完了進行形 has been ～ing ＋ for three hours。数字もアルファベットで three と書く。"]]}], "A7_math": [{"t": "問1 計算・方程式", "items": [["(1)", "−11/4", "11/6 × (−3/2) ＝ −33/12 ＝ −11/4。"], ["(2)", "5", "1−2²＝1−4＝−3。(−15)÷(−3)＝5。"], ["(3)", "−3a", "−2a² ÷ (4/3 ab) × 2b ＝ −2a² × 3/(4ab) × 2b ＝ −12a²b/(4ab) ＝ −3a。"], ["(4)", "x²−3x＋2", "2(x²−2x＋1)−(x²−x)＝2x²−4x＋2−x²＋x＝x²−3x＋2。"], ["(5)", "2√3", "√48＝4√3、√72÷√6＝√12＝2√3。4√3−2√3＝2√3。"], ["(6)", "x = 25", "両辺を10倍して 5(x＋3)＝2(3x−5) → 5x＋15＝6x−10 → x＝25。"], ["(7)", "x = −3, y = 2", "上の式を2倍：2x＋5y＝4。下の式を6倍：4x−3y＝−18。上を2倍して引くと 13y＝26 → y＝2、x＝−3。"], ["(8)", "エ", "S＝1/2 ℓr の両辺に 2 をかけて 2S＝ℓr、r でわって ℓ＝2S/r。"]]}, {"t": "問2 小問集合", "items": [["(1)", "4√6", "a³＝6√6、12/a＝12/√6＝2√6。6√6−2√6＝4√6。"], ["(2)", "7/18", "a÷b が整数になる (a, b)：b＝1 → 6通り、b＝2 → 3通り(2,4,6)、b＝3 → 2通り(3,6)、b＝4,5,6 → 各1通り。合計 14通り。14/36＝7/18。"], ["(3)", "イ", "軽井沢町の中央値は約15.8℃で、16℃を下回る日は半数以上。アは平均でなく中央値の比較ではわからない、ウ27℃を上回る日は
