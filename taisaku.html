const DATA={"english": {"問1": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問1 対話文", "sg": [[1, 0.0793, 0.3192, 1.4143]], "it": [["(1)", "イ", "「あとで映画に行きましょうか？—はい、そうしましょう」。Shall we ～? ＝ ～しましょうか（誘い）。答えの Yes, let's. が手がかり。", 1], ["(2)", "ウ", "Why don't you ～? ＝ ～したらどうですか（提案）。「早く家に帰って寝たらどう？—わかった」。", 1], ["(3)", "エ", "「これはだれのかばんですか？—私のです（That's mine.）」。持ち主をたずねるのは Whose。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問1 対話文", "sg": [[1, 0.0641, 0.3359, 1.4143]], "it": [["(1)", "エ", "「（なんてかわいい）Tシャツ！ どこで買ったの？」— What a cute T-shirt! の感嘆文。", 1], ["(2)", "ウ", "「私はそのバンドのファンです。」—「（あなたも）そうなの？ 私もです」。Are you?（あなたもそう？）。", 1], ["(3)", "エ", "「水族館への道を教えてください」—「いいですよ。あの緑のバスに乗ってください」。道案内の答えになるのはエ。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問1 対話文", "sg": [[1, 0.0657, 0.2929, 1.4143]], "it": [["(1)", "エ", "Thank you for your support.（応援ありがとう）。thank you for ～＝～をありがとう。", 1], ["(2)", "ア", "What's wrong?（どうしたの？）— 頭痛がします。具合の悪い人にたずねる決まり文句。", 1], ["(3)", "イ", "I'm looking forward to seeing you.（お会いするのを楽しみにしています）。look forward to ～ing。", 1]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問1 対話文", "sg": [[1, 0.0283, 0.3217, 1.4143]], "it": [["(1)", "ウ", "「あのレストランで昼食を食べるのはどう？」—「いい考えだね」。How about ～ing? で「～するのはどう」。having が続くので How about。（Why don't we は後ろが動詞の原形）", 1], ["(2)", "ア", "「私はスポーツが好き。（あなたは？）」—「うーん、私はあまりスポーツが好きじゃない」。How about you?（あなたはどう？）が自然。", 1], ["(3)", "ウ", "「私はダンスが好きではない」—「私もです（Me, either.）。なぜ友達が好きなのか理解できない」。否定文への同意は either（too は肯定文）。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問1 対話文", "sg": [[1, 0.0602, 0.3339, 1.2943]], "it": [["(1)", "イ", "「（　）I go to the festival tonight, mom?」「いいよ。でも8時までに帰ってきなさい」。許可を求める Can I ～?（～してもいい？）。", 1], ["(2)", "エ", "電話の定番表現。May I speak to Judy? に Speaking.（私です）と答える。", 1], ["(3)", "エ", "「水族館までの道を教えてください」→「いいですよ。あの青いバスに乗ってください（Take that blue bus.）」。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問1 対話文", "sg": [[1, 0.051, 0.3313, 1.4143]], "it": [["(1)", "ア", "「カップを取って」→「はい、どうぞ（Here you are.）」。物を手渡すときの決まり文句。", 1], ["(2)", "イ", "May I help you?（いらっしゃいませ／お手伝いしましょうか）— 「いいえ、結構です（No, thank you.）。見ているだけです」。「見ているだけ」と続くので断る返事。", 1], ["(3)", "ア", "「私はキャシーに賛成です」—「私も（Me, too.）。彼女の意見は正しいと思う」。賛成に同意する返事。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問1 対話文（適切な文を選ぶ）", "sg": [[1, 0.0516, 0.3256, 1.4129]], "it": [["(1)", "ウ", "「このぼうしはいくらですか」→「3,000円です」。How much（値段）にはIt's 3,000 yen.で答える。", 1], ["(2)", "ウ", "「（　）」— 「いい考えだね。図書館でやろう」。直前に「放課後に勉強しませんか（Why don't we ～?）」と誘ったと考える。", 1], ["(3)", "エ", "電話の会話。This is Bob.（こちらはボブです）に対して Speaking.（私です）と答えている → May I speak to Meg, please?（メグさんをお願いします）が自然。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問1 アクセント", "sg": [[1, 0.0546, 0.2189, 1.4129]], "it": [["(1)", "ア", "de-SIGN（デザイン）は後ろを強く読む。birth-day、pow-er、cul-ture はどれも前を強く読む。", 1], ["(2)", "イ", "a-GREE（賛成する）は後ろ。bor-row、an-swer、wel-come は前。", 1], ["(3)", "イ", "ex-PEN-sive（高価な）は2番目。DIF-fi-cult、BEAU-ti-ful、NA-tion-al は1番目。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問1 発音", "sg": [[1, 0.0546, 0.2199, 1.4129]], "it": [["(1)", "ア", "life の i は［アイ］。give・fish・drink の i は短い［イ］。", 1], ["(2)", "イ", "book の oo は短い［ウ］。noon・cool・school は長い［ウー］。", 1], ["(3)", "エ", "gesture の g は［ヂ］。good・grow・together の g は［グ］。", 1]]}], "問2": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問2 語を書く（頭文字つき）", "sg": [[1, 0.3192, 0.5803, 1.4143]], "it": [["(1)", "weather", "B が「雨です」と答えているので天気。How is the weather in ～? ＝ ～の天気はどうですか。", 1], ["(2)", "season", "答えが Summer（夏）なので季節。Which season do you like the best?", 1], ["(3)", "aunt", "父または母の姉妹＝おば。（おじは uncle）", 1], ["(4)", "hospital", "兄は医者なので、働く場所は病院。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問2 語を書く（頭文字つき）", "sg": [[1, 0.3359, 0.5808, 1.4143]], "it": [["(1)", "month", "8月は1年の8番目の「月」。", 1], ["(2)", "cousin", "父の兄弟の息子＝いとこ。", 1], ["(3)", "subject", "「科学は好き？」— 「うん！ 私の好きな教科（favorite subject）だよ」。", 1], ["(4)", "front", "郵便局の「前」に家がある（in front of ～）。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問2 語を書く", "sg": [[1, 0.2929, 0.5621, 1.4143]], "it": [["(1)", "color", "Which color do you like better, black or blue?（どちらの色が好き？）", 1], ["(2)", "would", "What would you lik 2+5＝7、3+4＝7、3+5＝8、4+4＝8、4+5＝9。8以上は3通り → 3/6 ＝ 1/2。", 1], ["(3)", "ウ", "箱の左端（第1四分位数）は110分。ア：範囲は約235−31≒204分で210分ではない。イ：四分位範囲は158−110＝48分。エ：第3四分位数は約158分なので、上位30人は158分以上だが、160分以上が30人以上いるとは必ずしもいえない。", 1], ["(4)", "36π cm³", "半球の表面積＝球の半分（2πr²）＋切り口の円（πr²）＝3πr²。3πr²＝108π → r²＝36 → r＝6。球Pの直径＝6cmなので半径3cm。体積＝4/3×π×3³＝36π。", 1], ["(5)", "40°", "図の角はすべて五角形の外角。120°の頂点の外角は180−120＝60°。外角の和は360°なので、x ＝ 360 −(84+49+65+60+62) ＝ 360 − 320 ＝ 40°。", 1], ["(6)", "27本", "n角形の対角線は n(n−3)/2 本。9×6÷2 ＝ 27。", 1], ["(7)", "8本", "正六角柱の辺は18本。ABと同じ面（上の面）の辺はねじれにならない。下の面の6本のうち、ABに平行な2本以外の4本がねじれ。側面の縦の辺6本のうち、A・Bを通る2本以外の4本がねじれ。4＋4＝8本。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問2 小問集合", "sg": [[2, 0.0818, 1.0, 1.4143], [3, 0.0, 1.0, 1.4143]], "it": [["(1)", "4√6", "a³＝6√6、12/a＝12/√6＝2√6。6√6−2√6＝4√6。", 1], ["(2)", "7/18", "a÷b が整数になる (a, b)：b＝1 → 6通り、b＝2 → 3通り(2,4,6)、b＝3 → 2通り(3,6)、b＝4,5,6 → 各1通り。合計 14通り。14/36＝7/18。", 1], ["(3)", "イ", "軽井沢町の中央値は約15.8℃で、16℃を下回る日は半数以上。アは平均でなく中央値の比較ではわからない、ウ27℃を上回る日は軽井沢町にはない、エは四分位範囲は松本市のほうが大きい。", 1], ["(4)", "23度", "正三角形の1つの角は60°。平行線の錯角より 37°＋∠x＝60° → ∠x＝23°。", 1], ["(5)", "96cm³", "立面図は底辺6cmの二等辺三角形で面積24cm²なので、高さは 24×2÷6＝8cm。体積＝1/3×6×6×8＝96cm³。※手書き解答は「12√55」となっていますが、立面図の面積が24cm²ならば高さは8cmです（12√55 は側面の三角形の面積が24のときの値）。", 1], ["(6)", "ウ", "展開図を組み立てて直方体をつくると、AB と CD は直方体の平行な面上の、平行な対角線になる。（手書き解答に従う）", 1], ["(7)", "9/2π−9 cm²", "半円の面積＝1/2×π×3²＝9π/2。△ABC は直角二等辺三角形で AC＝BC＝3√2、面積＝1/2×3√2×3√2＝9。色をつけた部分の面積＝9π/2−9 cm²。（手書き解答に従う）", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問2 小問集合", "sg": [[2, 0.0894, 1.0, 1.4143], [3, 0.0, 1.0, 1.4143]], "it": [["(1)", "5", "a²−3ab+b² ＝ (a+b)² − 5ab。a+b＝2√5、ab＝5−2＝3 → 20−15＝5。（対称式は a+b と ab で表す）", 1], ["(2)", "7/10", "袋は0〜4の5個。順に2個取るので 5×4＝20通り（同じ玉は取れない）。12の約数は 1,2,3,4,6,12。a+b＝1：2通り、2：2通り（(1,1)は不可）、3：4通り、4：4通り、6：2通り（(3,3)は不可）。合計14通り → 14/20＝7/10。", 1], ["(3)", "ウ", "ヒストグラムから、最小値30〜35、最大値65〜70、第1四分位数は45〜50、第2四分位数（中央値）は50〜55、第3四分位数は55〜60の階級。これに合う箱ひげ図がウ。", 1], ["(4)", "イ", "球の半径をrとすると、円柱は半径r・高さ2r。水の体積＝円柱−球＝2πr³−4/3πr³＝2/3πr³。底面積πr²で割ると水の高さ＝2/3r。全体の高さ2rの 1/3倍。", 1], ["(5)", "120度", "∠COD＝130°より、弧CDの円周角 ∠CAD＝65°。∠BAD＝95°なので ∠BAC＝30°。弧AB＝弧BC なので ∠ADB＝∠BDC＝30°。∠ADC＝60° → 円に内接する四角形の対角の和は180°なので x＝∠ABC＝180°−60°＝120°。", 1], ["(6)", "1/3倍", "BE・CD は中線なので、F は △ABC の重心。重心は中線を 2：1 に分けるので、△FBC は △ABC の 1/3。", 1], ["(7)", "207π cm³", "FC（辺CDの上）を軸に回転させる。正方形（1辺6cm）を回転させると円柱（半径6・高さ6）＝216π。切り取った直角二等辺三角形DEFを回転させると円すい（半径3・高さ3）＝1/3×9π×3＝9π。216π−9π＝207π。", 1]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問2 小問集合", "sg": [[2, 0.0636, 1.0, 1.4143], [3, 0.0, 1.0, 1.4143]], "it": [["(1)", "ア, イ", "4＜√6n＜5 の各辺を2乗して 16＜6n＜25。n＝3 のとき18、n＝4 のとき24 で条件に合う。ウ(36)・エ(108)・オ(144)は大きすぎる。", 1], ["(2)", "12個", "18の約数は 1,2,3,6,9,18。正の組が6個、負の組が6個で合計12個。", 1], ["(3)", "0.48", "8.0〜8.5 の度数は 25−(1+4+10+2+1)＝7。8.5秒未満は 1+4+7＝12人。12÷25＝0.48。", 1], ["(4)", "エ", "中心角45°は360°の 45/360＝1/8。したがって円の1/8倍。", 1], ["(5)", "45度", "四角形AODCに注目。∠ODC＝180°−55°＝125°。△OBDは OB＝OD の二等辺三角形で ∠BOD＝180−55×2＝70°。∠AOD＝360−150−70＝140°。四角形の内角の和360°より ∠OAC＝360−(140+125+50)＝45°。", 1], ["(6)", "54cm²", "BG:GD＝BE:AD＝1:3、DH:HB＝DF:AB＝1:2。五角形＝△BCD(72) − △BEG − △DFH。△BEG＝△ABE(24)×1/4＝6、△DFH＝△ADF(36)×1/3＝12。72−6−12＝54。", 1], ["(7)", "243cm³", "立体ACFHは、立方体から角の三角すい4つ（各 9×9÷2×9÷3＝121.5）を引いたもの：729−4×121.5＝243。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問2 小問集合", "sg": [[2, 0.0889, 1.0, 1.2943], [3, 0.0, 1.0, 1.2943]], "it": [["(1)", "−36−24√2", "a²−2ab−3b² ＝ (a−3b)(a+b) に因数分解。a+b＝6、a−3b＝3−√2−9−3√2＝−6−4√2。積は −36−24√2。", 1], ["(2)", "1/4", "大小2個のさいころで36通り。Pは右回りにa（大）、Qは左回りにb（小）進む。同じ頂点で出会うのは a+b が4の倍数のとき。和が4：3通り、8：5通り、12：1通りで計9通り。9/36 ＝ 1/4。", 1], ["(3)", "ア：②　イ：③　ウ：③　エ：①", "数学は Q1＝45・Q3＝85（四分位範囲40）、国語は Q1＝40・Q3＝75（35）。ア：国語のほうが大きいとはいえない（②）。イ：箱ひげ図では平均点はわからない（③）。ウ：85点の生徒がいるかは、最大値・四分位数の位置だけではわからない（③）。エ：第1四分位数が数学45点・国語40点なので、36人の1/4（9人）以上が45点以下（①）。", 1], ["(4)", "ウ", "立方体の面を、AからEFを通ってGまでの線が一直線になるよう展開する。展開図ウのように、辺EFをまたぐ2つの面が横にならんだ図で、A〜Gが直線になるものが最短の糸の通り道。", 1], ["(5)", "65度", "AB∥DO より ∠OAB＝∠AOD＝50°（錯角）。OA＝OB の二等辺三角形なので ∠AOB＝80°。∠BOD＝80°＋50°＝130°。円周角 ∠BCD＝130°÷2＝65°。", 1], ["(6)", "12cm", "水の量が1/8になると、水面の相似比は 1/2（体積比＝相似比の3乗）。深さは 24×1/2 ＝ 12cm。", 1], ["(7)", "1/24倍", "平行四辺形を、B(0,0)、C(3,0)、A(0,3)、D(3,3) の正方形に置いて考える（面積の比は変わらない）。O(1.5,1.5)、E(2,0)。直線DEとACの交点F(2.25,0.75)、OG∥BC なので G(2.5,1.5)。△OFG＝OG(1)×高さ(0.75)÷2＝0.375。0.375÷9＝1/24。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問2 小問集合", "sg": [[2, 0.0747, 1.0, 1.4143], [3, 0.0, 1.0, 1.4143]], "it": [["(1)", "21 + 12√3", "a²−2ab+b²＝(a−b)²。a−b＝2√3+3。2乗して 12+12√3+9＝21+12√3。", 1], ["(2)", "5/36", "偶数は右回り・奇数は左回り。5頂点なので5で割った余りで考える。1→−1（余り4）、2→+2、3→−3（余り2）、4→+4、5→0、6→+6（余り1）。2回の合計が5の倍数になるのは (5,5)の1通りと、余り1と余り4の組（6と1か4）：(6,1)(6,4)(1,6)(4,6)の4通り。合計5通り → 5/36。", 1], ["(3)", "エ", "36人なので、第1四分位数以下に9人入る。A組・B組とも第1四分位数が15m以下なので、15m以下の生徒が9人以上いる（エ）。アの範囲はB組の方が大きい、イは30mの生徒がいるとは限らない、ウは第3四分位数と第2四分位数の関係が逆。", 1], ["(4)", "ウ", "展開図を組み立てると、P と C は立方体の同じ辺の両端になるので、線分PCが最も短い（立方体の辺）。", 1], ["(5)", "25度", "平行四辺形で対角は等しいので ∠ABC＝∠D＝60°。直線ℓ・mが平行なので錯角から、∠x＝60°−35°＝25°。", 1], ["(6)", "224π cm³", "P：底面の半径5・高さ12の円すい＝1/3×25π×12＝100π。Q：半径9・高さ12＝1/3×81π×12＝324π。差は 324π−100π＝224π。", 1], ["(7)", "a/3 cm", "正方形の1辺を1とする。AC：y＝1−x（A(0,1)、C(1,0)、B(0,0)）、E(1,1/3)、F(5/7,1)。BE：y＝x/3、BF：y＝7x/5。G(3/4, 1/4)、H(5/12, 7/12)。GHのx座標の差は 3/4−5/12＝1/3、斜め45°なので GH＝√2/3。AC＝√2 なので GH＝AC×1/3＝a/3。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問2 小問集合", "sg": [[2, 0.0723, 1.0, 1.4129], [3, 0.0, 1.0, 1.4129]], "it": [["(1)", "ウ・オ", "96 = 2⁵×3。√(96/n) が整数になるには 96/n が平方数。n=6→16、n=24→4で整数。n=2→48、3→32、16→6 は平方数でない。", 1], ["(2)", "a = −4", "y=ax−3 の変化の割合は常に a。y=x² の −3→−1 の変化の割合は {(−1)²−(−3)²}÷{−1−(−3)} = (1−9)÷2 = −4。よって a=−4。", 1], ["(3)", "a = 13、中央値 12.5点", "平均12.8×10人=合計128。a以外の合計は115なので a=13。並べると 8,9,10,11,12,13,15,15,17,18。10個なので5番目と6番目の平均 (12+13)÷2=12.5。", 1], ["(4)", "イ", "円柱は半径4・高さ8。表面積=2π×16+8π×8=96π、球は4π×16=64π。96π÷64π=3/2。体積は円柱128π、球256π/3 で円柱は球の3/2倍（ウ・エは誤り）。", 1], ["(5)", "65度", "直径ABと下の弦は平行。25°の錯角から、弧は 50°（平行な弦にはさまれた弧は等しい）。下半円180°から 50°+50° を引くと弧は80°。xが対する弧は 50+80=130° なので円周角は 65°。", 1], ["(6)", "12倍", "点Dは中点なので △ABD=△ABC の1/2。Eは BD の中点。座標を B(0,0)、C(2,0)、A(0,2) と置くと D(1,1)、E(½,½)、直線AEとBCの交点Fは (2/3, 0)。△BEF=1/6、△ABC=2 なので 12倍。（メネラウスの定理でも BF:FC=1:2 が出る）", 1], ["(7)", "80cm³", "正四角錐A-BCDEの体積240。△BCE は底面の半分なので 三角錐A-BCE=120。AF:FB=1:2 より F-BCE は高さが 2/3 倍になるので 120×2/3=80。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問2 小問集合", "sg": [[2, 0.0814, 1.0, 1.4129]], "it": [["(1)", "−4041", "x²−y²＝(x+y)(x−y) と因数分解してから代入。(2020+2021)×(2020−2021)＝4041×(−1)＝−4041。", 1], ["(2)", "4/15", "取り出し方は 6×5＝30通り。b/a が自然数＝b が a の倍数（b≠a）。a＝1のとき b＝2〜6 の5通り、a＝2のとき b＝4,6 の2通り、a＝3のとき b＝6 の1通り。合計8通りで 8/30＝4/15。", 1], ["(3)", "55°", "接線と半径は垂直なので ∠OAP＝∠OBP＝90°。四角形の内角の和360°より ∠x＝360−90−90−125＝55°。", 1], ["(4)", "6cm³", "組み立てると点Cで AC・BC・CD が互いに垂直に交わる三角すいになる。底面△BCD＝3×3÷2＝9/2、高さAC＝4。体積＝1/3×9/2×4＝6。", 1], ["(5)", "32π/3 cm", "2つの円の中心と交点を結ぶと、半径8の正三角形が2つできる。影の部分の弧は中心角120°の弧が2本。8×2×π×120/360×2＝32π/3。", 1], ["(6)", "正八面体", "立方体の6つの面の中心を結ぶと、頂点6個・正三角形の面8個の正八面体ができる。", 0], ["(7)", "ア、ウ、エ", "ア：9²＝81、(−9)²＝81 で正しい。イ：x＝5、y＝−1 でも x+y＞0 なので誤り。ウ：外角の和360°÷5＝72° で正しい。エ：y＝−x² は x＜0 の範囲では右上がり（−16→−1 と増加）なので正しい。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問2 小問集合", "sg": [[2, 0.0779, 1.0, 1.4129]], "it": [["(1)", "4040000", "因数分解してから代入。a²−18a−19＝(a−19)(a+1)＝2000×2020＝4040000。", 1], ["(2)", "1/3", "和が3,6,9,12になる目は、(1,2)(2,1)(1,5)(2,4)(3,3)(4,2)(5,1)(3,6)(4,5)(5,4)(6,3)(6,6)の12通り。12/36＝1/3。", 1], ["(3)", "50°", "AB∥OC より錯角で ∠OCA＝∠BAC＝20°。中心角 ∠BOC＝2×20＝40°。△OBCは二等辺三角形で ∠OCB＝(180−40)÷2＝70°。∠x＝70−20＝50°。", 1], ["(4)", "384cm³", "底面は1辺12cmの正方形、高さは8cm。1/3×12×12×8＝384。", 1], ["(5)", "x＝5", "AB∥CD より △EAB∽△EDC で、AE：ED＝AB：DC＝4：12＝1：3。AD＝20cmなので AE＝20×1/4＝5。", 1], ["(6)", "9：7", "円Oの半径は8cm、円O′の半径は O′B＝8−2＝6cm。円O′は36π、影の部分は64π−36π＝28π。36π：28π＝9：7。", 0], ["(7)", "ア、ウ", "ア：√(1/49)＝1/7 なので有理数。イ：x＝1、y＝3 などもある。ウ：正しい。エ：y＝−2x² は変化の割合が一定ではない（一次関数ではない）。", 0]]}], "問3": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問3 連立方程式の利用", "sg": [[4, 0.0813, 1.0, 1.4143]], "it": [["(1)㋐", "48", "箱の合計は48箱なので x＋y＝48。", 1], ["(1)㋑", "5y", "機械Bの時間は5y秒、機械Aは7x秒。Bのほうが12秒長いので 5y − 7x ＝ 12。", 1], ["(2)㋒", "336−7a", "機械Bでa箱詰めると、機械Aは残りの(48−a)箱。かかる時間は 7(48−a) ＝ 336−7a 秒。", 1], ["(2)㋓", "12a−336", "Bの時間5a秒からAの時間をひく：5a −(336−7a) ＝ 12a − 336。", 0], ["(3)", "2分20秒", "2台が同時に終わるとき最短。12a−336＝0 → a＝28。Bは28箱で5×28＝140秒、Aは20箱で7×20＝140秒。140秒＝2分20秒。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問3 窓口と行列", "sg": [[4, 0.0813, 1.0, 1.4143]], "it": [["(1)", "15分間で入館した人数", "1つの窓口から1分間に y人入館するので、15y＝15分間に入館した人数。（20人の行列＋15分間に増えた15x人−入館した15y人＝50人）", 1], ["(2)", "イ", "9時15分から10時5分までの50分間で、行列は 50＋50x（増える）−2つの窓口の入館 2×50y＝50＋50x−100y が0になる。", 1], ["(3)", "増える人数 5人、入館できる人数 3人", "①より 15x−15y＝30 → x−y＝2。②より 50x−100y＝−50 → x−2y＝−1。引くと y＝3、x＝5。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問3 方程式の利用（なしとももの販売）", "sg": [[4, 0.0889, 1.0, 1.4143]], "it": [["(1)⑦", "31−x", "箱は全部で35個。なしが x 箱なら、ももは 35−x 箱。そのうち4箱は値引きなので、定価で売れたのは (35−x)−4＝31−x 箱。", 1], ["(1)①", "4", "売れ残った4箱を 900円の10％引き（900×0.9）で売った。", 1], ["(2)⑦", "x/4 + y/3", "1箱になしが4個、ももが3個。なし x 個は x/4 箱、もも y 個は y/3 箱。合計35箱。", 0], ["(2)①", "y − 12", "4箱（1箱3個）は値引きなので 12個。定価で売れたももは y−12 個。", 0], ["(3)", "なし72個、もも51個", "①：x/4＋y/3＝35 → 3x＋4y＝420。②：250x＋300(y−12)＋3240＝32940 → 5x＋6y＝666。①×3：9x＋12y＝1260、②×2：10x＋12y＝1332。引くと x＝72、y＝51。（確認：72÷4＝18箱、51÷3＝17箱、合計35箱）", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問3 運動量（表の読み取り・連立方程式）", "sg": [[4, 0.0556, 1.0, 1.4143]], "it": [["(1)", "1.5エクササイズ", "普通歩行の強度は3メッツ。30分＝0.5時間なので 3×0.5＝1.5。", 1], ["(2)", "3x＋6y＝23", "普通歩行（強度3）がx時間、バスケットボール（強度6）がy時間。エクササイズ＝強度×時間なので 3x＋6y＝23。", 1], ["(3)", "普通歩行 2時間20分、バスケットボール 2時間40分", "x＋y＝5 と 3x＋6y＝23 を解く。y＝5−x を代入して 3x＋30−6x＝23 → x＝7/3（＝2時間20分）、y＝8/3（＝2時間40分）。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問3 連立方程式（予防接種）", "sg": [[4, 0.0877, 1.0, 1.2943]], "it": [["(1)", "3000人", "12000人の75％＝9000人が1回または2回受けた。受けていない住民は 12000−9000＝3000人。", 1], ["(2)", "80/100 x + y", "8月1日に2回目を終えていた人＝2月1日にすでに2回目を終えていた人 y ＋ 1回目だけを終えていた人 x の80％。0.8x＋y＝8400。", 1], ["(3)", "1回目：3000人　2回目：6000人", "x＋y＝9000、0.8x＋y＝8400 を引くと 0.2x＝600 → x＝3000、y＝6000。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問3 連立方程式（貯金箱の硬貨）", "sg": [[4, 0.0763, 1.0, 1.4143]], "it": [["(1)", "x + 6 枚", "花子さんから100円硬貨6枚を受け取って貯金箱に入れたので、x＋6枚。", 1], ["(2)", "エ", "100円硬貨のちょうど…「100円硬貨の枚数は10円硬貨の1/5」という、両替した後の100円硬貨と10円硬貨の枚数の関係。式は x＋6＝(y−60)/5。（100円6枚＝10円60枚に両替）", 1], ["(3)", "100円硬貨5枚、10円硬貨115枚", "①：100x＋850＋10y＝2500 → 10x＋y＝165。②：5(x+6)＝y−60 → 5x−y＝−90。たすと 15x＝75 → x＝5、y＝115。確認：500＋850＋1150＝2500円。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問3 連立方程式の利用（リサイクル）", "sg": [[4, 0.0784, 1.0, 1.4129]], "it": [["(1)", "エ", "空き缶は4%減なので今月は (1−0.04)y = 96/100 y。つまり「今月の空き缶の回収量」。", 1], ["(2)", "112/100 x", "ペットボトルは12%増なので 今月は (1+0.12)x = 112/100 x。", 1], ["(3)", "ペットボトル168kg、空き缶96kg", "x+y=250、1.12x+0.96y=264。上の式を0.96倍して 0.96x+0.96y=240 を引くと 0.16x=24 → x=150、y=100。今月は 150×1.12=168kg、100×0.96=96kg。※「先月の量」ではなく「今月」を聞かれている点に注意。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問3 連立方程式の利用", "sg": [[3, 0.0829, 1.0, 1.4129]], "it": [["(1)", "x+y＝100、100x+120y＝10800", "袋の数の合計が100袋、売り上げの合計が10800円、の2つの関係で式をつくる。", 1], ["(2)", "2枚入り60袋、3枚入り40袋", "上の式を100倍して引くと 20y＝800 → y＝40、x＝60。", 1], ["(3)", "1600g", "クッキーの枚数は 2×60＋3×40＝240枚。100gで15枚なので、240÷15×100＝1600g。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問3 連立方程式の利用（出会い算）", "sg": [[3, 0.0814, 1.0, 1.4129]], "it": [["(1)", "y/80＋4", "妹が歩いた時間は x/60 分、兄は y/80 分。妹は兄より4分長く歩いているので x/60＝y/80＋4。", 1], ["(2)", "60x＋80y", "妹が歩いた道のり60x と兄が歩いた道のり80y の和が1080m。", 1], ["(3)", "妹 600m、兄 480m", "x＝4+y を代入：60(4+y)+80y＝1080 → 140y＝840 → y＝6、x＝10。妹 60×10＝600m、兄 80×6＝480m。", 0]]}], "問4": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問4 関数（放物線と直線・台形）", "sg": [[5, 0.0813, 1.0, 1.4143]], "it": [["(1)", "(7, 8)", "Aは直線上で x＝−7 → y＝−4/3×(−7)−4/3 ＝ 28/3−4/3 ＝ 8。A(−7, 8)。ADはx軸に平行で、y＝ax²のグラフはy軸について対称なので D(7, 8)。", 1], ["(2)", "a = 1/4", "xの変域に0をふくむので最小値は0。最大値はxの絶対値が大きい x＝−6 のとき。36a＝9 → a＝1/4。", 1], ["(3)", "b = 1", "A(−4, y)：y＝16/3−4/3＝4 → A(−4, 4)、D(4, 4)、AD＝8。△ACDと△ABCは、ADとBCが平行なので高さが等しく、面積比は底辺の比 AD：BC。2倍なので BC＝4。B、Cはy軸について対称なので Cのx座標は2。直線に代入して C(2, −4)。−4＝−b×2² → b＝1。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問4 関数", "sg": [[5, 0.0869, 1.0, 1.4143]], "it": [["(1)", "a＝1/2"  1.4143]], "it": [["(1)", "ア", "n行n列目は各列の一番上の数で、1、9、17、25…と8ずつ増える。8n−7。（n＝1で1、n＝2で9）", 1], ["(2)Ⓑ", "m−2", "同じ列では下へ1マス進むと2増える。上の数は m−2。", 1], ["(2)Ⓒ", "m+2", "下の数は m+2。", 0], ["(2)Ⓓ", "m−6", "左の数：例の11の左は5で 11−6。m−6。", 0], ["(2)Ⓔ", "m+6", "右の数：11の右は17で 11+6。m+6。（和は (m−2)+(m+2)+(m−6)+(m+6)＝4m）", 0], ["(3)", "18行16列目", "第n列には上から 8n−7、8n−5、8n−3、8n−1 の4つが n行目〜(n+3)行目に並ぶ。8n−3＝125 → n＝16。16列目の3番目なので 16+2＝18行目。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問6 タイルの規則性", "sg": [[7, 0.1015, 1.0, 1.4143]], "it": [["(1)", "41枚", "1, 5, 13, 25, … 増え方が 4, 8, 12, 16 → 5番目は 25＋16＝41枚。", 1], ["(2)a", "36cm", "周りの長さ 4, 12, 20, … は8ずつ増える。5番目は 4＋8×4＝36cm。", 1], ["(2)b", "8n−4（＝4＋8(n−1)）", "初項4、公差8の数列なので 4＋8(n−1)＝8n−4。※手書きは「12＋8(n−1)」で、これは誤りですが「8n−4でもマル」と書き足されていました。", 0], ["(3)", "8番目、113枚", "8n−4＝60 より n＝8。タイルの枚数は 1, 5, 13, 25, 41, 61, 85, 113 → 113枚。（枚数＝2n²−2n＋1）", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問6 平方根と整数部分・小数部分", "sg": [[7, 0.0924, 1.0, 1.4143]], "it": [["(1)⑦・①", "⑦：2　①：√5−2", "2²＜5＜3² より 2＜√5＜3。整数部分は2、小数部分は √5−2。", 1], ["(2)⑦", "5−2√5", "x＝√5−2 を x(x+2) に代入：(√5−2)×√5＝5−2√5。", 1], ["(3)", "a = (1+√17)/2", "a²＝6＋b、0≦b＜1 より 6≦a²＜7。2²＜a²＜3² なので a の整数部分は 2。a＝2＋b → b＝a−2。a²＝6＋(a−2) → a²−a−4＝0 → a＝(1±√17)/2。a＞0 より a＝(1+√17)/2。", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問6 ナースウォッチ（反比例）", "sg": [[7, 0.0586, 1.0, 1.4143]], "it": [["(1)a", "100", "表の「時間×脈拍数」は 15×60＝900 で一定。a＝900÷9＝100。", 1], ["(1)b", "45", "b＝900÷20＝45。", 1], ["(2)", "反比例", "時間と脈拍数の積が一定（900）なので「反比例」。", 0], ["(3)", "80回", "20回数えるものでは 20秒で60回なので積は 20×60＝1200。15秒のとき 1200÷15＝80回。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問6 数の性質（因数分解の利用）", "sg": [[7, 0.0872, 1.0, 1.2943], [8, 0.0, 1.0, 1.2943]], "it": [["(1)", "m = 4、n = 2", "m²−n²＝(m+n)(m−n)＝12。m+n＞m−n で3通りの連立方程式（12×1、6×2、4×3）のうち、m、nが自然数になるのは m+n＝6、m−n＝2 → m＝4、n＝2。", 1], ["(2)", "2³×11×23", "2024÷2＝1012、÷2＝506、÷2＝253＝11×23。", 1], ["(3)", "4組", "2024＝(m+n)(m−n)で、m+n と m−n はともに偶数。2024＝2³×11×23 なので、2つの偶数の積に分けると (1012,2)、(506,4)、(92,22)、(46,44) の4通り（m+n＞m−n）。それぞれ m、 "よい", "宵。日がくれて間もないころ。「宵の明星」＝夕方、西の空に見える金星。", 1], ["(2)", "もよお（す）", "催す。会などを開くこと。", 1], ["(3)", "とふ", "塗布。薬などを表面にぬりつけること。", 1], ["(4)", "らいひん", "来賓。式や会に招かれて来た客。「来賓の祝辞」。", 1], ["(5)", "どんよく", "貪欲。非常によくばりなこと。「貪欲に勝利を求める」＝勝ちへのこだわりが強いこと。", 1], ["(6)", "額", "「猫の額ほどの庭」＝とてもせまいことのたとえ。", 1], ["(7)", "供える", "神仏や死者の前に物をささげること。「備える」と区別する。", 1], ["(8)", "衛生", "清潔にして病気を防ぐこと。", 1], ["(9)", "盛大", "集まりなどが大がかりでりっぱなこと。「盛大な拍手」。", 1], ["(10)", "保障", "地位・状態などがおかされないように守ること。「安全保障」。「保証（うけあう）」「補償（つぐなう）」と区別する。", 1]]}], "小説・随筆": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問二 小説（重松清『タカシ丸』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["(1)", "a", "a「片づけ（る）」は下一段活用。b「つくれ（る）」、c「待っ（つ）」、d「行く」はすべて五段活用。", 1], ["(2)", "考える余裕すらない", "「今年は、それもできそうにない。母親はこの夏休み、宿題のことをほとんど口にしていない。そんなことを考える余裕すらないのだろう。」（9字）父の入院で、母は工作のことを考える余裕もないと雅也は思った。", 1], ["(3)", "I さらに痩せて　II 倒れてしまう", "「お盆が終わった頃から父親はさらに痩せてしまって」「まっすぐ座ろうとしても体がすぐに左右に倒れてしまう」。（各6字）", 1], ["(4)", "船より車がいいと思い、気乗りしない様子。", "「ピンと来ない。どうせつくるのなら車のほうがいいな、と思った」。父の提案「船」にすぐには乗り気になれない様子。（15〜20字）", 1], ["(5)", "ウ", "母親が目配せで「船にしなさい」と言ったのは、父親の願いをかなえてあげたいから。雅也は母の考えを理解し、うなずいた。母はほっとした。", 1], ["(6)I", "体調の悪い父親を、混み合っているホームセンターに連れて行くのは心配だったから。", "母はとっさに「二丁目のホームセンターの混み具合」を思い浮かべた。弱った父が買い物に行けるのか不安だった。（35〜40字）", 0], ["(6)II", "イ", "母は「デパートに行くときもそうだったじゃない」と、わざとおどけて昔の話を持ち出した。父と雅也だけで行けるよう、角が立たない言い方をした。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問二 随筆（角田光代『さがしもの』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414]], "it": [["あらすじ", "—", "「私」は祖母のメモにあった本を探して、大学の近くの本屋に入る。本の表紙と、メモの文字がぴったり重なり、探していた本を見つける。大学卒業後、「私」は本屋に就職した。そして「定食屋の娘」というエッセイを読み、若い日のおばあちゃんの光景を思い浮かべる。", 1], ["(1)", "c", "「ない」の中で品詞が違うもの。a・b・dは形容詞「ない」、cは助動詞「ない」（打ち消し）。※手書き解答はcでした。", 1], ["(2)", "イ", "「沈殿していった」＝常に心にある存在ではなくなっていった（記憶が心の底に沈んでいった）という意味。", 1], ["(3)", "平積みにされた本", "「私が偶然訪れた本屋で（　）の書名と同じもの」＝メモに書かれていた書名は、本屋の「平積みにされた本」の表紙と同じだった。", 1], ["(4)", "ア", "「それでも私は決めていた。本屋で働こう」＝探している人の役に立ちたいと思ったから。※手書き解答はアでした。", 1], ["(5)i", "例：大学生のときに探していた本を見つけて、読んだことで知った。", "「私」はおばあちゃんが探していた本を実際に見つけて読んだことで、その理由を知った（25〜30字）。※手書きは読み取りに自信が低い箇所です。", 1], ["(5)ii", "自分の字の最初の五字（要確認）", "「定食屋の娘」を読んで思い浮かべた光景を書いた連続した三文の初めの五字を答える問題です。※手書き解答は読み取れませんでした。", 1], ["(5)iii", "例：おばあちゃんが「定食屋の娘」を読んで、自分のことが書かれていると気づいたのではないかと考えている。", "本文中の言葉を使って45〜50字で書く問題。※手書きは読み取りに自信が低い箇所です。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問二 小説（森谷明子『春や春』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["あらすじ", "—", "俳句甲子園をめざす高校の俳句同好会。5人目のメンバーを決める場面で、会長の茜と1年生のトーコは、すでに瑞穂以外の4人に決めていた。瑞穂は自分が「いらない人間」と感じて傷つき、「補欠に回る」と言うトーコの言葉に複雑な思いをいだく。", 1], ["(1)", "a", "a「決めて」は下一段活用の動詞。b「押し隠して」・c「うなずいた」・d「わめく」は五段活用。", 1], ["(2)", "イ（倒置法）", "「実際、王道の俳句を作り続ける。先生の言うポイントの第二、『七点の句』を」のように、語順を入れかえて強調する倒置法。", 1], ["(3)", "教科書通り", "「自分には茜のような『教科書通り』の句を作ることはできないが、俳句甲子園ではそのような俳句は評価されるから」。", 1], ["(4)", "ウ", "「いらない人間」と思ったのは、俳句甲子園で勝つための貢献度の低さ（鑑賞点を稼げるのはトーコ）を認めざるを得ないから。ア・イ・エは本文と合わない。", 1], ["(5)", "予期しない言葉（別解：思ってもみない言葉）", "「…だから瑞穂、おねがいね」は、補欠に回ると決まっていると思っていなかった瑞穂にとって、思いがけない言葉だった（10字以内）。", 0], ["(6)", "例：創作ができる人には自分の気持ちはわからないとあきらめる気持ち。", "「不思議な笑い方」は、自分の悩みを説明してもわかってもらえないというトーコのあきらめ。35〜40字。", 0], ["(7)i", "さかあがり・音痴の人間", "トーコが具体例として挙げた文：「さかあがりができない人に…」「音痴の人間は…」。それぞれ初めの5字。", 1], ["(7)ii", "エ", "瑞穂は、曲げたくない自分と、周囲に認められたい気持ちの間で揺れる、プライドが高い人物。", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問二 小説（谷瑞恵『神さまのいうとおり』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414], [6, 0, 1, 1.414]], "it": [["あらすじ", "—", "武は、いなくなった猫「ゴン」を探していて、神社の石段で転校生の拓也（フォトブックを持つ写真部）と出会う。武の名前をおぼえていない拓也が、ふつうに接してくれることに戸惑う。拓也の家で自転車を直してもらい、父親にも親切にされる。武は自分の父親とは全然違うと感じ、ゴンを探す気持ちも薄れて帰る。", 1], ["(1)", "b", "動詞の活用の種類：a「続く」（五段）、b「消える」（下一段）、c「持って／荷って」、d「回り込む」（五段）。bだけ種類が違う。", 1], ["(2)", "エ", "「武の名前をおぼえていない」ことに「目立っているはずなのに」「武だって転校生の名前をおぼえていないのに」と腹を立てている。自分が常に中心にいるのが当然だと考える人物。", 1], ["(3)", "イ", "武は猫を「ゴン」と呼ぶ。その猫は茶色で耳が大きく、「ごん狐」という物語に出てくる狐のようだから、その猫が「狐に似ているから」。", 1], ["(4)", "ア", "「わかっていて、そんな無茶を言いつけたくなる」…武は、自分の評判が学校で知れ渡っていて、周囲に近寄る生徒もいないことを自覚している。友達とも言えないような人間関係に嫌気がさしている心情。", 1], ["(5)", "何なんだ、", "転校生の言動に戸惑っているのがわかる連続した二文は「何なんだ、こいつは。想像していない展開に、武はどうしていいかわからなくなった。」初めの五字は「何なんだ、」（読点も1字）。", 1], ["(6)i", "ごくふつうのクラスメイトに接する態度", "武の評判を知っているはずなのに、拓也は武を特別視せず、ふつうのクラスメイトとして接している（18字）。", 0], ["(6)ii", "ウ", "武の父親は市議会議員だが、「人前で怒鳴り散らしたり、えらそうにしたりしない」穏やかな人。武は「うちの親父とは全然違う」と感じている。※ア〜エの選び方に自信が低い問題です。", 1], ["(7)", "例：見つけたとしても、ゴンを飼えないことはわかっていたし、特に親しいわけでもない転校生親子に優しくされたことで、意地を張る気持ちが薄れてしまったから。", "「ゴンを飼えない」（見つけても飼えない）と「意地を張る気持ち」（拓也に張っていた意地）の両方を入れ、60〜75字にまとめる。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問二 小説（東直子『階段にパレット』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["あらすじ", "—", "絵画教室で心を開き始めた小学3年生のルイが、母の英里子を外へ連れ出し、空に絵を描くしぐさをして、3歳のときに家族3人で行った伊豆の海水浴の思い出を伝えようとする場面。", 1], ["(1)", "b", "a「ゆらした」・c「反芻した」・d「見つめ」は動詞。b「まぶしそうに」は形容詞「まぶしい」に「そうだ」がついた形容動詞で、品詞がちがう。", 1], ["(2)", "家族三人で行った海水浴のことを思い出している", "ルイが空に描こうとしているのは、あの日の海水浴の思い出。それを英里子は「はっとして」気づいた（本文：「ルイは、心の中にある夏、家族三人で行った海水浴のことを思い出している」）。", 1], ["(3)", "英里子：勇敢な子ども　夫：少し変な子ども", "英里子は、初めて見る海を怖がらなかったルイを「勇敢な子どもなのだ」と誇らしく思った。一方、夫は「ルイ、あいつやっぱり、ちょっと変だよな」と言った。", 1], ["(4)", "エ", "「ならよかった」は、「ずっとおとなしい」と言われ続けてきたルイが、ちゃんと楽しんでいたと知って安心した気持ち。夫は喜んでいる。期待通りではない反応でも受け入れる気持ちが込められている。", 1], ["(5)", "ア", "「ざらりとしたもの」＝すっきりしない、気がかりな感じ。ルイに対する感じ方が夫とちがうことへの違和感。", 1], ["(6)", "例：ルイが家族三人で海に行ったことを覚えているとは思わなかったから。", "英里子は「ルイは幼すぎて覚えていないだろう」と思い込んでいたので驚いた。", 0], ["(7)", "イ", "「二度と戻らない時間なのだ」という思いは、ルイが幼いころの記憶の中に、大切な家族（父・母）を見ていることを感じたから。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問二 小説（川上弘美『泣くのにいちばんいい時間』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414], [6, 0, 1, 1.414]], "it": [["あらすじ", "—", "「あたし」は公園のベンチに座って泣くことが好きで、他の女のひとが泣いているのを見守っていた。男の子の絵くんと、泣く理由について話し、泣くことは悪いことではなく、気持ちのいいことだと考えている。", 1], ["(1)", "b", "a「すわって」・c「だまっていた」・d「めざして」は活用の種類が同じ。b「泣きつづけている」は「泣き続ける」で複合動詞…活用の種類が他と異なる。（解答はb）", 1], ["(2)", "女の人が長い時間泣いていたことを表す効果。", "「アリがミミズを運んでいってしまってからも、女のひとは泣きつづけていた」は、アリがミミズを運び去るほどの長い時間、泣いていたことを表している。", 0], ["(3)", "ウ", "絵くんは、教室では「あたし」といっしょにいたがらない。それは、学校で女の子と仲良くしているところを他の男の子たちに見られたくないから。", 1], ["(4)", "ア", "「あたしはその理由を絵くんといっしょに考えたい」。絵くんはわからないと答え、それでもいっしょに考えたいというのが「あたし」の気持ち。", 1], ["(5)", "誇りを保てなくなる", "本文：「誇りを保てなくなるわけだね」（9字）。", 1], ["(6)i", "クラスの女〜ていること", "「あたし」が先生にほめられるのは、いつも宿題をきちんとやってくるからだ、と女の子たちに思われている。学校でいやなことがある例。", 1], ["(6)ii", "X：真面目だから　Y：ウ", "大人から見ると「真面目だから」ほめられるのに、「あたし」自身は「大人の世界では評価されない」と考えている。", 1], ["(7)", "悪口を言う女の子たちが知らないうちにだまってがまんしている…（例）", "「ちょっといじわるな感じ」の『すかっと』とは、悪口を言われる経験を、泣くことでいやされた気持ち…の意味。40〜50字で、本文の言葉を使ってまとめる。※読み取りに自信が低い問題です。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問二 小説（沢木耕太郎『彼らの流儀』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["あらすじ", "—", "「彼」はバスで席を譲るかどうか悩むのがいやで、席にあえて座らない。老女が若い母親に大根の半分をあげようとするやりとりを聞き、一人暮らしの自分の母親を思い出し、母親の悩みに気づかないふりをしている自分を省みる。", 1], ["(1)", "d", "a「少し」・b「多少」・c「ほとんど」は副詞。d「素直に」は形容動詞「素直だ」の連用形で、品詞がちがう。", 1], ["(2)", "ウ", "席に座ると、「譲るべきか、譲らなくていいか」と悩まなくてはならない。それがいやで、あえて座らなかった。（本文の「譲るべきかどうか悩まなくてはならないこと」に対応）", 1], ["(3)", "半分に切られた太い大根", "老女は「これ、もらっていただけませんか」と、手に持っていた半分に切られた太い大根をあげようとしている（11字）。", 1], ["(4)", "たぶん、そ", "彼が老女のことを推測した形式段落は「たぶん、その老女は…」で始まる。初めの5字は句読点も1字に数える。", 1], ["(5)", "初め：母親がひと　終わり：理解できた", "「母親がひとりで暮らしているということの意味が理解できた」（27字）。老女の姿を通して、ひとり暮らしの母親の苦労を実感した。", 1], ["(6)", "イ", "老女の「一本では多すぎるが一本でなければ買えない」という悩みを聞き、半分の大根をもらってほしいと願う。それは老女を自分の母親と重ね合わせて見ているから。", 1], ["(7)", "ア", "「彼」だけでなく、周りの乗客も老女が大根をもらってもらえるよう助けてほしいと内心で思っていた。それがかなったので空気がやわらいだ。", 1], ["(8)", "例：母親にいくつもの小さな悩みを押しつけていることをわかっていて、気づかないふりをしていること。", "「彼」は買い物のたびに半分の大根のことで悩む母親のことをわかっていながら、あえて考えないようにしてきた。それは、席を譲るべき人が目の前にいるのに気づかないふり（狸寝入り）をする男と「ほとんど同じ」だと気づいた。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問二 小説（本多明『幸子の庭』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["(1)", "c", "a「わからない」・b「見られない」・d「見えない」は打ち消しの助動詞（「ぬ」に言いかえられる）。c「わけでもない」は形容詞（「ぬ」に言いかえられない）。", 1], ["(2)", "縁側からだ", "「縁側からだと職人さんに見られるから、玄関から出て木戸にまわった。」人に見られるのをさけている行動。", 1], ["(3)", "エ", "母は手入れされた庭を見て、市村さんや田坂さんの仕事ぶりを楽しそうに話している。職人たちの腕前に感心してはしゃいでいる。", 1], ["(4)", "予想外のところに槙の長い枝がのびていたことに驚く気持ち。", "「あぜんとする」＝思いがけないことにおどろきあきれる。木戸の上に槙の長い枝が伸びていたことに驚いた。", 0], ["(5)", "ヒゲモジャ", "「ヒゲモジャの不潔な親父みたいだったのに、今は天からスーッと降りてきてポーズをキメている若い役者みたい。」松を人にたとえている。", 1], ["(6)i", "イ", "母は娘が人と会うのが苦手なのを知っていて、何も言わずにそっと横に立った。", 1], ["(6)ii", "予想よりもきれいな声だったこと。", "「予想外にきれいな声だった」とある。", 0], ["(6)iii", "エ", "人に会うのをいやがっていた幸子が、すっきりした庭と職人の好ましい姿にふれ、「あの人なら庭にいてもいい」と思えるようになった。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問二 小説（岡本かの子『鮨』より）", "sg": [[2, 0, 1, 1.414], [3, 0, 1, 1.414], [4, 0, 1, 1.414], [5, 0, 1, 1.414]], "it": [["(1)", "b", "「ころ合い」は名詞。b「あじわい」も名詞。a「ほろほろに」は形容動詞（または副詞的な語）、c「おいしい」は形容詞、d「きまり悪い」は形容詞。", 1], ["(2)", "イ", "「手品師のように」と「ように」を使ってたとえているので直喩。", 1], ["(3)", "ア", "「使う道具は、みんな新しいものだよ」「手はこんなにもよくきれいに洗ってあるよ」と、子供が安心して食べられるように見せている。体内に入れる物への安心感を与えたい気持ち。", 1], ["(4)", "ア", "玉子焼の次に烏賊の鮨を出すので、「白い玉子焼だと思って食べればいい」と言って、警戒する子供をなだめている。", 1], ["(5)", "冒険", "「烏賊鮨を食べていたその冒険のさなか、詰めていた息のようなものを、はっ、として顔の力みを解いた」とある。", 1], ["(6)", "驚きであり嬉しい", "今まで食べられなかったものをおいしいと感じられたことが、子供にとって「驚き」であり「嬉しい」ことだった。（解答例。同じ内容なら可）", 1], ["(7)①", "子供に鮨を食べさせ、食べる喜びを感じさせること。", "母親の「勝利」とは、偏食の子供に鮨を食べさせることができ、子供が食べる喜びを感じたこと。（25字以内）", 0], ["(7)②", "母親が握っ", "「母親が握って皿の上に置くのと、子供が摑み取る手と、競争するようになった」の部分が、「勝利」を裏付ける母と子の行動。", 1], ["(8)", "ア", "子供は鮨を食べられたことで、母親の自分への深い愛情を強く感じた。だから母の顔が「生涯忘れ得ない美しい顔」に見えた。", 0], ["(9)", "ウ", "子供は、自分の本当の母親は別にいるという幻想（内しょで呼んでいる母）をもっていた。鮨を食べさせてくれる目の前の母と、その幻想の母の姿が重なっていく。", 0]]}], "論説文": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問三 論説文（齋藤孝『不機嫌は罪である』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414]], "it": [["(1)", "b", "b「大きな」は連体詞（活用しない）。a「不機嫌な」、c「あからさまに」、d「高度な」は形容動詞。", 1], ["(2)", "イ", "A：前の「代金を払った場所で提供されるもの」と反対に、今ではカフェのアルバイトにまで求められる→「しかし」。B：傷つきやすさの難点の具体例として上司の場合をあげる→「たとえば」。", 1], ["(3)", "I 態度が大きくなって　II 傲慢や不機嫌", "「緊張すると態度が大きくなってしまう」「傲慢や不機嫌に感じられる」。緊張感や不安感で態度が大きくなってしまい、他人から傲慢や不機嫌だと見られてしまう。（I 9字・II 6字）", 0], ["(4)", "ウ", "「愛想を良くさせるシステムが全業種で整ってきた」とは本文に書かれていない。ア業種間の競争、イアンケートやSNSで苦情、エ人々がサービスで店を選ぶ、は本文にある。", 1], ["(5)", "誰かの不機", "「誰かの不機嫌を感知するとすぐに委縮してしまう」（22字）人が増えている。だから上司の不機嫌な指摘は通じず、新卒社員が会社を辞めることもある。", 1], ["(6)", "不機嫌に厳しい", "「現代は、とかく不機嫌に厳しい時代なのです」。不機嫌に厳しい傾向が逆行することはないと筆者は考えている。（7字）", 1], ["(7)", "例：私は後輩に教えるとき、つい不機嫌な言い方をしてしまい、相手が黙ったことがある。上機嫌で声をかけるようにすると、質問してくれるようになった。上機嫌で接すると相手が安心し、よい関係が作れると考える。", "条件：①「上機嫌」を使う、②自分の体験をもとに理由を書く、③80〜100字。（解答は例）", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問三 論説（三井秀樹『かたちの日本美』より）", "sg": [[5, 0, 1, 1.414], [6, 0, 1, 1.414], [7, 0, 1, 1.414]], "it": [["要旨", "—", "日本は四方を海で囲まれた島国で、山が多く、豊かな自然に恵まれてきた。そのため日本人は自然に畏敬の念をもち、自然を模した紋様や、季節の移ろいを大切にする美意識をつくりあげた。", 1], ["(1)", "エ", "A「そして」、B「だからこそ」の組み合わせ。※手書き解答はエでした。", 1], ["(2)①", "自然に畏敬の念をもつようになった", "本文：「自然への畏敬の念をもつようになった」→ 16字で抜き出す。", 1], ["(2)②", "地理的", "日本列島の「地理的」条件に始まる数々の理由。", 0], ["(3)", "ウ", "「文化の質」を変容させてきたのは大陸文化の影響を色濃く受けた…ではなく、日本列島の自然（風土）が、日本人の感性を育んだことを指す。※手書き解答はウでした。", 1], ["(4)", "ア", "衣服、インテリア、美術などの「自然と融合し一体化させる」＝自然のかたちを装飾に取り入れる。", 1], ["(5)", "季節の色やかたちの移ろい", "「移ろいの美学」は、季節の色やかたちの移ろいから生まれた（15字以内）。", 1], ["(6)", "例：日本の自然に触発されながら、美に目覚め、自然に対する繊細な感受性と鋭い観察眼を養ってきたことから。", "「日本人の自然に対する思いの深さ」は、日本人の編み出した紋様（自然の紋様と幾何学的紋様の融合）から察することができる。※手書き解答は読み取りに自信が低い箇所です。", 0], ["(7)", "例：日本は島国であり、四季があるので、日本人は自然に恵まれた生活や文化を築いてきた。自然の変化を大切にする心は、衣食住や祭りなどに表れている。私もその美意識を大切にしたい。", "条件：「島国」「生活や文化」の二つの言葉を使い、80〜100字で書く。（朱書きの「例」を参考にまとめました）", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問三 論説（上田紀行『生きる意味』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["要旨", "—", "数字で測られる「外側から見る成長」ではなく、人生地図の濃淡のように変わる「生きる意味」の成長＝内的成長が大切。人生に創造性をもつことが、生きることの豊かさにつながる。", 1], ["(1)", "ウ", "「（数字に）表される」の「れる」は受け身。ア「愛される」・イ「閉じられる」・エ「延期される」も受け身だが、ウ「まだ着られる服」は可能（～することができる）で、用法が違う。", 1], ["(2)", "エ", "a：前の内容に付け加える「そして」。b：前とは反対の内容に移る「ところが」。", 1], ["(3)", "ア", "「私たちの成長を内側から見る目」とは、自分自身の経験を積み重ねていく中で見出される成長観。他者との比較で表れる成長観（外側）とは逆。", 1], ["(4)", "人生地図の濃淡の具合が変わっていくこと", "「生きる意味」の成長を比喩で言いかえた部分。本文：「人生地図の濃淡の具合が変わっていく」（17字）。", 0], ["(5)", "人生に「創造性」がないから", "例の中の女性・男性が「何か不自由していない…これでいいのか」と感じたのは、人生に創造性がないからだと筆者は言う（15字以内）。", 1], ["(6)", "ウ", "閉じた「創造性」＝評価や効率のためだけに自分を駆り立てること。具体例は、多くの人に自分の描く絵を高く評価してもらうことを夢見て、一日何時間もデッサンに取り組むウ。", 1], ["(7)", "例：今の私は、バスケットボールに打ち込んでいる。それが筆者のいう内的成長だと考える。試合に勝つための練習を重ね、自分の努力が成果になることを体験すると、人生経験が積み重なり、生きる意味が深まっていくからである。", "条件：①「内的成長」「人生経験」を使う、②自分の体験と理由、③80〜100字。（解答は例）", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問三 論説（藤原智美『スマホ断食』より）", "sg": [[7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414], [10, 0, 1, 1.414]], "it": [["要旨", "—", "現代人は、話し言葉・書き言葉に加え、ネットのデジタル情報に依存するようになった。ネットではフィルターバブルによって、自分の興味のある情報しか見えなくなり（知的孤立）、確証バイアスも加わって、フェイクを信じやすくなる。紙に書かれた言葉を読み、自分で考える習慣が必要。", 1], ["(1)", "エ", "A：「すぐさま全国民に行き渡る」。B：「何を見ているかというと、いうまでもなくスマホです」。", 1], ["(2)①", "デジタル情報", "ネットの世界では言葉の使い勝手が豊かになり、人々は話し言葉・書き言葉以上にネットの「デジタル情報」に（本文中から抜き出し）。", 1], ["(2)②", "依存するように", "本文：「日常的にやりとりされる『話し言葉』以上に、依存するようになってきています」。", 1], ["(3)", "テレビ、新聞からの情報が全国民に行き渡らなくなったから。", "緊急事態宣言が出たのを知らない人が多かったのは、「テレビや新聞」の情報が全国民に届かなくなった（若い世代のテレビ離れ）ため。30字以内。", 0], ["(4)", "ア", "偽の情報に惑わされやすいのは、フィルターバブルで「あらかじめ選別された情報」だけが届き、その上、自分が受け入れたいものだけを集めて他を閉め出してしまう（確証バイアス）から。", 1], ["(5)", "ウ", "「知的孤立」＝フィルターバブルの中で、狭い範囲の情報しか得ようとしない状態。", 1], ["(6)", "読むという思考活動を通った上での判断", "「信じたいか／信じたくないか」という感覚的な判断に対し、本文中の「読むという思考活動を通った上での判断」が対比されている（18字）。", 0], ["(7)", "例：私はスマホを利用するときは、本当に正しい情報なのか、注意して見たい。スマホで得られる情報は狭い範囲の限られたものだから、時々は紙に書かれた情報にもふれて知識がかたよらないようにしたい。", "条件：本文の内容にふれ、「狭い範囲」「紙に書かれた」の二つの言葉を使い、80〜100字で書く。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問三 論説（古井由吉『書く、読む、生きる』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["要旨", "—", "日本語は、かなと漢字を瞬時に切り替えて使いこなしており、バイリンガルなことばである。伝統は「ことば」そのもので、行き詰まりをやわらげる力になるかもしれないので、むやみに捨てず、世界における日本語の意義を再認識する必要がある。", 1], ["(1)", "イ", "a：「それから」。前の「翻訳は非常にうまい」に、別のことをつけ加える。b：「たとえば」。「概念にない言葉」の例として「認識」「観念」を挙げている。", 1], ["(2)", "ア", "日本語は、かなと漢字という異なる体系を、読むときも話すときも瞬時に切り替えて使いこなしている。これが「バイリンガル」ということ。", 1], ["(3)", "ちなみに今", "「翻訳は非常にうまい」と書かれている段落は、「ちなみに今の中国語の中で…」。", 1], ["(4)i", "行き詰まりをやわらげるか、是正する力になる", "本文：「東洋の文明―さらにいえば日本独自の伝統なら、その行き詰まりをやわらげるか、是正する力になるかもしれない」（21字）。", 0], ["(4)ii", "エ", "日本の伝統は、西洋の行き詰まりを是正する力になるかもしれないので、手放してはいけないもの。", 1], ["(5)", "初め：ある程度の　終わり：ことが可能", "「ある程度の広がりをもっている言葉を、その広がりのまま捉えることが可能」な言語が日本語（34字）。", 0], ["(6)", "例：筆者は、日本語は意味を限定せずにあいまいな事柄を捉えることができると述べている。私は、そのような日本の伝統をそのまま続けるのではなく、外国の人にも分かりやすい明確な使い方に変えていくべきだと考える。", "条件：①「意味を限定」「日本の伝統」を使う、②自分の意見と理由を書く、③80〜100字。（解答は例）", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問三 論説（更科功『若い読者に贈る美しい生物学講義』より）", "sg": [[7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414], [10, 0, 1, 1.414]], "it": [["要旨", "—", "生物多様性は、種内の多様性・種の多様性・生態系の多様性を含む。種が多いだけでなく、均等度が高いことが重要。ヒトは爆発的に増え、森林や農地の生物多様性を低くしてきた。ヒトの利益のためだけでなく、生態系全体を守る必要がある。", 1], ["(1)", "イ", "A：「しかし」ではなく、ヒトは一人ぼっちになってしまった。AとB：「Aところが…Bつまり」。「とうとう私たちヒトは一人ぼっちになってしまった」は、ヒトだけが残ったこと（種の多様性が失われたこと）を表している。", 1], ["(2)", "非常に低い状態", "現在、種内の多様性はさまざまな個性が見られるが、種の多様性は「非常に低い状態」である。", 1], ["(3)", "均等度", "「たんに種数が多いという意味ではない」＝木が一本しかないから多様性が低い、という「均等度」も重要。", 1], ["(4)i", "ヒトが変えてしまった", "森林を農地に変えたのは「ヒトが変えてしまった」環境。図の X に当てはまる。", 1], ["(4)ii", "ア", "環境を操作する能力の高いヒトの増加により、地球上の広い範囲で種の絶滅が起こった。", 1], ["(5)", "エ", "かつては多くの種が存在したはずの人類が、現在はヒト一種だけになってしまった。ヒトの爆発的な増加が始まったため。", 1], ["(6)", "ウ", "「生態系サービス」＝生態系がもたらす、ヒトのためになる利益。直接関わらず、安定をもたらすもの全てを指すのではなく、ヒトの営みに関わるもの。ア・イ・エは本文と合わない。", 0], ["(7)", "例：ヒトの手だけで生物多様性を守るべきでなく、ヒトの命のバランスを守る…（記述）", "条件：「ヒトの命」「ヒトの利益」の二つの言葉を使い、本文の内容にふれながら、80〜100字で自分の考えを書く。例：生物多様性は、ヒトの利益のためだけでなく、ヒトの命を守るためにも大切だ。多様性が低下すると生態系が不安定になり、ヒトも危険にさらされるからだ。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問三 論説（榎本博明『「さみしさ」の力』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["要旨", "—", "スマホなどで外的刺激に反応し続けると、思考停止になる。あえて接続を切り、退屈な時間（一人の時間）をもつことで、自分の内側から考えが湧き、人間に深みが出る。", 1], ["(1)", "エ", "a：前の「外的刺激を利用するのも有効だ」の具体例（読書）を挙げているので「たとえば」。b：前の「つながりを求めてしまう」に対し、「受け身の生活から脱するにはあえて退屈な時間をもつことも必要」と反対の考えを述べるので逆接「だが」。", 1], ["(2)", "自分の中に沈潜する（または 自分の世界に沈潜する）", "「だれにも邪魔されない一人の時間」を、自らあれこれ思いをめぐらしたり考えを深めたりして「自分の中に沈潜する時」にするべきだと述べている。※解答用紙の「自分の世界に没頭する」は、本文では「できない」と否定の文脈で出てくる語。", 0], ["(3)", "読書は思考を活性化するのに対して、SNSなどは情報に反応するばかりで思考停止状態になってしまう。", "読書は本の言葉や視点に刺激を受け、さらに言葉が湧き出てくる（活性化）。SNSなどは飛び込んでくる情報に反応するだけで、思考停止状態になる。", 0], ["(4)i", "ウ", "「あえて刺激を絶ち」「退屈でしかたがない状況を自ら生み出す」とは、思い切って接続（インターネット）を遮断すること。※解答用紙は「イ」だが、本文の「接続を極力切断する」からウが正しい。", 1], ["(4)ii", "ア", "退屈の時間にこそ、内側から何かがこみ上げ、自分の心の声が聞こえてきて、考えを深められるから。", 1], ["(5)", "イ", "「一人でいられないことの弊害」＝ネットなど過剰な刺激に翻弄され、自分の考えを深められなくなること。", 1], ["(6)", "例：私は、一人の時間をもつことで人間は成長すると思う。例えば、休日をいつも友達と過ごすのではなく、一人で気になる展覧会に行くと、自分だけの感想や新しい価値観に気づける。こうした経験が考えを深めると思う。（約100字）", "条件：①身近な具体例を入れる、②80〜100字。「賛成か反対か」「具体例」「理由」の順に書くとまとめやすい。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問三 論説文（岡田英弘『歴史とはなにか』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["(1)", "イ", "a：前の「個人の好みが働く」に、さらに「選択が働く」ことを付け加える「しかも」。b：前の内容に「動機」を付け加える「さらに」。", 1], ["(2)", "個人の好み", "史料にはそれを書いた人の個人の好み（筋書）が反映されているので、そのまま事実とは言えない。", 1], ["(3)", "ウ", "「もんきりがた（紋切り型）」＝決まりきった型。わかりやすい筋書なので受け入れやすい。", 1], ["(4)i", "豊かな個性　たくさんの経験", "「その歴史家が、豊かな個性を持っていなくてはいけない」「たくさんの経験を積まなくてはいけない」。", 1], ["(4)ii", "ウ", "完全な説明（窮極の説明）はありえないので、「よい歴史」とは言っても、あくまで「よりよい歴史」でしかない。", 1], ["(5)", "ウ", "一貫した論理で解釈できない歴史＝書き手の思い込みが強く一貫性のない歴史。", 1], ["(6)", "普遍的な個人の立場", "「ここでは、『普遍的な個人の立場』とでも言うしかない。」", 1], ["(7)", "イ", "長い目で見れば、「よい歴史」は文化の違いや時代をこえて多くの人を説得でき、国家間の対立も解消できるだろうと述べている。", 0], ["(8)", "（例）それぞれの国の立場によって歴史の見え方がちがうので、一つの立場からだけ歴史をとらえず、いくつもの立場から考えて、偏ることなく客観的な視点で歴史を見ようとすることが大切だと思う。", "条件：「立場」「客観的な視点」を使う、筆者の考え（歴史は書く人の立場や好みで変わる）をふまえる、80〜100字。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問三 論説文（柏木博『「しきり」の文化論』より）", "sg": [[6, 0, 1, 1.414], [7, 0, 1, 1.414], [8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["(1)", "ウ", "線部の「られる」は「社会の一員として認められる」の受け身。ウ「道を教えられる」も受け身。ア「考えられる」は自発または可能、イ「感じられる」は自発、エ「来られる」は尊敬。", 1], ["(2)", "共用のもの", "「それを共用する人々が際限なく広がっている」の「それ」は、直前の「共用のもの」を指す。", 1], ["(3)", "固有の名前", "「わたしがわたしであることを、固有の名前を持っていることで…感じているのではないか」とある。", 1], ["(4)", "ウ", "名前を与えられなかった人造人間は「怪物」とだけ呼ばれ、社会の一員として認められなかった。名前が「わたし」を意識させる根本的なものであることを示す例。", 1], ["(5)", "エ", "A：前の内容と反対の問いを出すので「しかし」。B：旅行のときの枕やタオルを具体例としてあげるので「たとえば」。", 1], ["(6)", "人が自分の持ち物によって自分の世界を広げたり、他者との境界にしたりしていること。", "枕やタオル、スーツケースなどの持ち物が、自分のテリトリー（世界）を組織し、外部との境界をしきっている。（40字以内）", 0], ["(7)", "自分の周りに組織した世界を失うのは苦痛だから。", "持ち物への欲望は「自らの世界を組織する言葉への欲望」と同じで、それを消すことは「自分の周りに組織した世界を、失うことへの苦痛」と似ている。（25字以内）", 0], ["(8)", "「あなた」〜という欲望", "「「あなた」の世界は消滅してもいいという欲望」（21字）。「わたし」の世界が広がるためには「あなた」の世界は消えてもいいという欲望が暴力を生む。", 1], ["(9)", "ウ", "「わたしたちが抱いているものへの欲望は、…自らの世界を組織する言葉への欲望と相同的なもの」「強大な権力を持つ者が…わたしの世界を揺るぎないものにしようとする欲望」とある。", 0]]}], "古文": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問四 古文（『十訓抄』より）", "sg": [[9, 0, 1, 1.414]], "it": [["(1)", "ものいいける", "語中の「ひ」→「い」。「ものいひける」→「ものいいける」。", 1], ["(2)", "季札が身につけている太刀をほしがっている", "「季札が佩ける太刀を望む気色ありけれども」。「これ」は、徐君が季札の太刀を望んでいることを指す。季札はそれを察した。", 0], ["(3)", "帰りさまに与ふべし", "「帰りさまに与ふべし」と心の中で約束した（9字）。使節の身なので、帰り道で与えようと決めた。", 1], ["(4)", "ア", "徐君が亡くなっていても、季札は心の中の約束を守り、墓に太刀をかけた。相手が死んでも約束を守る信義の厚さを伝える話。", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問四 古文（『沙石集』）", "sg": [[8, 0, 1, 1.414], [9, 0, 1, 1.414]], "it": [["大意", "—", "池に住む蛇・亀・蛙。日照りで池の水がなくなり、蛇は飢えと渇きに苦しんで、亀を使者に立てて蛙に「ちょっとお目にかかりたい」と言わせる。蛙は「異常な事態では、情けも好みも忘れて食を求めるのだから」と断る。", 1], ["(1)", "うえんとして", "「うゑんとして」→ 現代仮名遣いで「うえんとして」。", 1], ["(2)", "亀を使いの者として", "「亀をもて使者として」＝亀を使いの者にして（10字以内）。", 1], ["(3)", "イ", "「飢渇に責めらるれば」＝飢えや渇きに苦しめられているので。", 1], ["(4)", "ウ", "蛙がだまされなかったのは、今が異常な事態であることを冷静に考えていたから。（「情けも好みも世の常の時こそあれ」）", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問四 古文（『宇治拾遺物語』）", "sg": [[10, 0, 1, 1.414]], "it": [["大意", "—", "孔子が道を行くと、八歳ほどの子どもに会い、「日の出る所と洛陽はどちらが近いか」と聞いた。子どもは「日の出る所は近い。洛陽はまだ見えない」と答えた。孔子は「かしこき童なり」と感心した。", 1], ["(1)", "といもうすよう", "「と問ひ申すやう」→歴史的仮名遣い「ひ→い」「やう→よう」。", 1], ["(2)", "1：より遠い　2：日の入る所", "「八つばかりなる童」は、日の入る所と洛陽を比べている。ここからの距離が（日の入る所より遠い洛陽）か、それとも…の形で空所をうめる。（模範解答に従う）", 1], ["(3)", "日の入る所は遠い。洛陽は近い。", "童の答え：「日の入る所は遠し。洛陽は近し」（現代語訳）。※解答用紙には「日の入る所は遠い。洛陽は近い。」と記されている。", 1], ["(4)問1", "かしこき童なり", "孔子が童を感心して言った七字。", 0], ["(4)問2", "ウ", "孔子に問いかける人はいないのに、それができたから、孔子は童を「かしこき童なり」と感じた。", 1]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問四 古文（『沙石集』）", "sg": [[11, 0, 1, 1.414]], "it": [["大意", "—", "賢人の許由は、帝から大臣になるようにと命令（宣旨）を受けたが、それを聞いて川（穎川）で耳を洗った。そこへ巣父が牛に水を飲ませにやってきて、事情を聞くと「汚れた水は牛に飲ませられない」と牛を引いて帰った。", 1], ["(1)", "きょゆうといいし", "「許由と云ひし」→ 歴史的仮名遣いを現代仮名遣いに直す：「ゆう」「いい」。", 1], ["(2)", "耳が汚れたと思ったから。", "帝の宣旨（大臣になれという命令）を聞いて「耳が汚れて覚えつれば」と言っている（15字以内）。", 1], ["(3)", "イ", "巣父は、許由が汚した川の水を牛に飲ませられないと思って、牛を引いて帰った。", 1], ["(4)", "ウ", "「許由巣父」は、栄え貴ばれる地位につくのをいやがる（名誉や地位を求めない）ことのたとえ。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問四 古文（『伊曾保物語』）", "sg": [[10, 0, 1, 1.414]], "it": [["大意", "—", "川のほとりで遊んでいた蟻が水に流され、困っていた。それを見た鳩が木の枝を落として蟻を助けた。のちに、ある人が鳩を鳥もちでとらえようとしたとき、蟻はその人の足に食いついて、鳩を逃がした。恩を受けたら、恩返しをしたいという気持ちをもつべきである。", 1], ["(1)", "おもうよう", "「思ふやう」→歴史的仮名遣いを現代仮名遣いに直す。「ふ」→「う」、「やう」→「よう」。", 1], ["(2)i", "鳩", "「木末を少し食ひ切りて、河の中に落しければ」と、蟻のために枝を落としたのは鳩。", 1], ["(2)ii", "ウ", "川に流されそうな蟻を助けるため。蟻はこの枝に乗って、渚に上がることができた。", 1], ["(3)", "恩を受けたら恩返しをしたいと思うべきということ", "蟻が「ただ今の恩を送らうものを（今の恩に報いたい）」と思い、人の足にかみついた。本文の注に「報ひをせばや＝恩返しをしたい」。20〜30字で、「恩」「恩返し」を入れてまとめる。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問四 古文（『十訓抄』）", "sg": [[11, 0, 1, 1.414]], "it": [["大意", "—", "唐の玄宗皇帝が月夜に笛を吹いていると、竜の鳴く声がしたので、笛の声は竜の声と調和して、符（まじないの札）をとどめた。術者はそれを聞いて、自分の術の効き目が失われたことを知った。", 1], ["(1)", "きわめたまえる", "「きはめ給へる」→「きわめたまえる」（は→わ、へ→え）。", 0], ["(2)", "エ", "「これ」は、前の「竜の鳴く声」を指す。（模範解答はエ）", 1], ["(3)", "イ", "「さとりて」＝術者は、帝の笛の声のせいで自分の術が破られたと悟った。", 1], ["(4)", "自分の笛が竜の声ほどの腕前を極めたと…（20字以内）", "「知り給ひけり」＝帝が悟ったこと。「自分の笛が竜の声に及ぶほど…ということ」を、20字以内でまとめる。※読み取りに自信が低い問題です。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問四 古文（『枕草子』）", "sg": [[10, 0, 1, 1.414]], "it": [["大意", "—", "九月二十日すぎ、初瀬に参詣し粗末な家に泊まった。夜ふけに月の光が窓から差し込み、人々が横たわる衣の上に白く映っているのが、しみじみと心にしみた。そういうときに、人は歌をよむのだ。", 1], ["(1)", "さようなるおりぞ", "歴史的仮名遣い→現代仮名遣い：「やう」→「よう」、「をり」→「おり」、「さやうなる」→「さようなる」。", 1], ["(2)", "ウ", "「洩る」は「もれる」の意味。「月の窓より洩りたりしに」＝月の光が窓から（部屋に）もれてさしていたときに。", 1], ["(3)i", "そのようなとき", "「さやうなるをりぞ」＝「そのようなときこそ」の意味。", 1], ["(3)ii", "エ", "「いみじうあはれとおぼえしか」と強く心を動かされたときに、昔の人は歌をよんだ。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問四 古文（『宇治拾遺物語』より）", "sg": [[10, 0, 1, 1.414]], "it": [["(1)", "といもうすよう", "「ひ」→「い」、「やう」→「よう」と直す。", 1], ["(2)", "イ", "「いづれか遠き」＝どちらが遠いのか。", 1], ["(3)", "A 近い　B 遠い　C 見えたこと", "日の出入る所は見えるから近い。洛陽はまだ見たことがないから遠い、という童の考え。", 0], ["(4)", "エ", "孔子にはこのように物を問いかける人もいないのに、八歳ほどの童が遠慮なく問いかけたから、ただ者ではないと人々が思った。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問四 古文（『沙石集』より）", "sg": [[10, 0, 1, 1.414]], "it": [["(1)", "よろずのやまいいえざるなし", "「万」→「よろず」、「病」→「やまい」、「癒へ」の「へ」→「え」。", 1], ["(2)", "エ", "「いかが仕るべき」＝どのようにすべきか。「いかが」は方法をたずねる言葉。", 1], ["(3)", "在家人", "僧の言葉を信じて藤のこぶを煎じて飲んだのは、在家人。", 0], ["(4)", "藤", "藤のこぶをとり尽くして、近くには藤がなかった（無かりければ）ので、山のふもとまで探しに行った。", 0], ["(5)", "ア", "僧の言うことを信じて藤を探しに山のふもとへ行ったところ、谷のほとりで失った馬を見つけた。信じたことで良い結果になったので「信の致す所」という。", 1]]}]}, "science": {"地学": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問1-I 火成岩と火山灰", "sg": [[1, 0.0167, 1.0, 1.4178]], "it": [["(1)", "斑状組織", "大きな結晶（斑晶）のまわりを、小さな結晶やガラス質（石基）がかこんでいるつくりを「斑状組織」という。マグマが地表付近で急に冷えた火山岩のつくり。", 1], ["(2)", "イ", "無色透明で不規則に割れる鉱物は石英。（長石は白色や桃色で規則的に割れる、黒雲母は黒色で六角形の板状、カンラン石は黄緑色〜褐色）", 1], ["(3)", "ア", "火成岩Aは有色鉱物が多く黒っぽい火山岩なので玄武岩。玄武岩のマグマはねばりけが弱く、傾斜がゆるやかな形の火山になる。（ねばりけが強いと盛り上がった形の火山）", 1], ["(4)", "ウ", "Aは斑状組織で有色鉱物が多い火山岩なので玄武岩。Bは同じくらいの大きさの結晶が集まった等粒状組織の深成岩で、有色鉱物が少ないので花こう岩。", 1], ["(5)", "Q／ウ", "日本の上空には1年を通して西から東へ「偏西風」がふいているため、火山灰は火山の東側へ運ばれて積もる。火山Xは地点P・Qの間にはないので、2地点とも火山Xの東側にある。火山灰の層は火山に近いほど厚いので、層が厚いP（128cm）のほうが火山Xに近く、うすいQ（32cm）のほうがより遠い＝より東側にある。（季節風は季節によって向きが変わる風なので、イ・エは誤り）", 1]]}, {"e": "S8", "l": "令和８年 12月S日程", "t": "問1-II 天気の変化", "sg": [[2, 0.0733, 1.0, 1.4175]], "it": [["(1)", "風向：北東　風力：3　天気：晴れ", "矢ばねは風のふいてくる方向（右上）にのびているので風向は北東。矢ばねの羽根の数が風力を表し、羽根は3本なので風力3（羽根の長さは関係なく1本＝風力1）。円の中に縦線1本は晴れの天気記号（何もない○は快晴）。", 1], ["(2)", "A：寒冷前線（▲を進行方向＝東側にかく）　B：温暖前線（半円を進行方向＝東側にかく）", "低気圧の中心から南西にのびる前線Aは寒冷前線、南東にのびる前線Bは温暖前線。寒冷前線は▲、温暖前線は半円（●の半分）の記号を進む向きの側にかく。", 1], ["(3)", "ウ", "寒冷前線は、冷たい空気が暖かい空気の下にもぐりこみ、暖かい空気を急に押し上げる。前線面の傾きが急なウ。（ア・イ・エは暖かい空気がゆるやかに冷たい空気の上にはい上がる温暖前線）", 1], ["(4)", "ウ", "寒冷前線が通過すると気温が急に下がる。気温は12時の約22℃から15時の約16℃に大きく下がっているので、12時から15時の間。", 1], ["(5)", "15時、0時、24時", "湿度が同じなら、気温が高いほど空気中にふくまれる水蒸気量が多く、露点も高い。気温は15時（約16℃）＞0時（14℃）＞24時（約11℃）の順。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問1 地学", "sg": [[1, 0.0854, 1.0, 1.4129], [2, 0.0, 1.0, 1.4129], [3, 0.0, 1.0, 1.4129]], "it": [["Ⅰ(1)あ", "砂", "砂＝陸地のモデル。", 1], ["Ⅰ(1)い", "水", "水＝海のモデル。", 1], ["Ⅰ(2)2", "イ", "日あたりのよい場所では、砂のほうが水よりあたたまりやすい（水のほうがあたたまりにくい）。砂側の空気があたたまって上昇し、水側から砂側へ向かう風（海風）が生じる。", 1], ["Ⅰ(2)3", "エ", "夜は、砂のほうが冷めやすく、水のほうが冷めにくい。水側の空気が上昇し、砂側から水側へ向かう風（陸風）が生じる。", 1], ["Ⅰ(3)①か", "高く", "夏は、ユーラシア大陸上があたたまって気圧が低く、太平洋上で気圧が高くなりやすい。", 1], ["Ⅰ(3)①き", "エ", "夏は太平洋から大陸へ、南東の季節風がふく。", 1], ["Ⅰ(3)①く", "ア", "冬は大陸から太平洋へ、北西の季節風がふく。", 1], ["Ⅰ(3)②", "シベリア気団", "冬にユーラシア大陸にできる冷たく乾燥した空気のかたまり。", 1], ["Ⅰ(3)③", "ウ", "冬は、日本海側では雪が降り、太平洋側では湿度が低い晴れの日が続く。", 1], ["Ⅱ(1)あ", "おもり", "地震計では、おもりが静止し続けようとするため、地震による動きが記録紙に記録される。", 1], ["Ⅱ(1)い", "慣性", "静止している物体が静止し続けようとする性質。", 1], ["Ⅱ(2)", "主要動", "初期微動のあとにくる大きなゆれ。", 0], ["Ⅱ(3)", "オ", "震度4（資料の図の位置関係から選ぶ）。震源から遠いほど震度は小さくなる。", 0], ["Ⅱ(4)①", "P波：7km/s、S波：3.5km/s", "地点Aは震源から14km。P波は2.0秒で 14÷2＝7km/s、S波は4.0秒で 14÷4＝3.5km/s。", 0], ["Ⅱ(4)②", "イ", "地点AがP波を感知した（地震発生の2秒後）5秒後に緊急地震速報＝地震発生から7秒後。地点E（100km）にS波が到達するのは 100÷3.5≒29秒後。29−7＝22秒後。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問1-I 地層の調査", "sg": [[1, 0.0874, 1.0, 1.4143]], "it": [["(1)", "ア", "泥岩・砂岩・れき岩は、流水のはたらきで運ばれてきた土砂が堆積してできた「堆積岩」。流水で運ばれる間にけずられるので、ふくまれる粒は角がなく、丸みを帯びている。（凝灰岩は火山灰が堆積したもので、粒は角ばっている）", 1], ["(2)", "示相化石", "サンゴの化石で「あたたかく浅い海」とわかるように、堆積した当時の環境を推定する手がかりとなる化石。（時代を示す化石は示準化石）", 1], ["(3)", "a → c → b", "地層は下にあるほど古い。P・Q・Rの地表の標高差と地層の傾きをふまえ、同じ凝灰岩の層（かぎ層）などを手がかりに、標高をそろえて比べる。（模範解答の順番）", 1], ["(4)", "エ", "柱状図では同じ層の高さがちがう。かぎ層の標高を比べ、層が高くなっている方角を考える。（模範解答は北）", 1], ["(5)", "図", "PとSは同じ等高線上にあり標高が等しいので、地層は等高線に平行（同じ高さで同じ層が重なる）。地点Sの10mまでの柱状図は、模範解答の図のように重ねる。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問1-II 空気中の水蒸気", "sg": [[2, 0.0879, 1.0, 1.4143]], "it": [["(1)", "露点", "空気中の水蒸気が水滴に変わり始めるときの温度。", 1], ["(2)", "ア", "金属は熱を伝えやすいので、コップの温度が水温と同じになりやすい。", 1], ["(3)", "75％", "20℃の飽和水蒸気量（露点のとき）は17.3g/m³、実験時の気温25℃では23.1g/m³。湿度＝17.3÷23.1×100＝74.9…→ 75％。", 1], ["(4)①", "3460g", "空気1m³の水蒸気量は17.3g。17.3×200＝3460g。", 0], ["(4)②", "740g", "16℃の飽和水蒸気量は13.6g/m³。13.6×200＝2720g。冷えて水滴になるのは 3460−2720＝740g。", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問1 地学", "sg": [[1, 0.0571, 1.0, 1.4143], [2, 0.0, 1.0, 1.4143]], "it": [["Ⅰ(1)", "ウ", "気温は地上1.2〜1.5mの高さで、温度計の球部に直射日光を当てないようにしてはかる（風通しのよい日かげ）。", 1], ["Ⅰ(2)", "天気：くもり（◎）、風向：南南西、風力：3", "天気図記号は、くもり＝◎。矢ばねは風が吹いてくる向き（南南西）にのばし、羽根の数が風力（3本）。", 0], ["Ⅰ(3)あ", "ウ", "18時から21時に、雨が降り、気温が24.3℃→18.7℃と下がり、風向が南から北に変わっている。", 1], ["Ⅰ(3)い", "寒冷前線", "短時間の強い雨、気温の急降下、風向の急変（南→北）は寒冷前線が通過した特徴。", 1], ["Ⅰ(4)", "ア", "水蒸気量＝飽和水蒸気量×湿度。3時：23.4℃、62%。9時：23.4℃、70%。15時：25.9℃、62%。3時は9時より湿度が低く、15時より気温が低い（飽和水蒸気量が小さい）ので最も少ない。", 1], ["Ⅰ(5)", "80g", "6時：23.0℃、湿度68%の空気1m³には 20.6×0.68＝14.0g の水蒸気。20m³で 280g。11.0℃では飽和水蒸気量10.0g/m³×20＝200g まで。280−200＝80g が水になる。", 0], ["Ⅱ(1)X", "斑状組織", "大きな鉱物（斑晶）が細かい粒（石基）の中に散らばる。火山岩のつくり。", 1], ["Ⅱ(1)Y", "等粒状組織", "大きさのそろった鉱物が組み合わさっている。深成岩のつくり。", 1], ["Ⅱ(2)あ", "B", "火山岩X：斑晶＋細かい粒＝氷水で急に冷やしたペトリ皿B（小さな結晶が散らばる）に似ている。", 1], ["Ⅱ(2)い", "A", "深成岩Y：同じ大きさの大きな結晶＝約80℃の湯でゆっくり冷やしたペトリ皿Aに似ている。", 1], ["Ⅱ(2)う", "火山岩", "Xのつくり（斑状組織）の岩石＝火山岩（マグマが地表付近で急に冷える）。", 1], ["Ⅱ(2)え", "深成岩", "Yのつくり（等粒状組織）の岩石＝深成岩（マグマが地下深くでゆっくり冷える）。", 0], ["Ⅱ(3)", "ア", "観察より、Xは無色鉱物が多い（SiO₂が多い）ので、マグマのねばりけが強い。Yは有色鉱物が多く、ねばりけが弱い。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問1-I 日本の天気", "sg": [[1, 0.0751, 1.0, 1.2943]], "it": [["(1)あ", "シベリア", "冬は大陸にできる冷たく乾燥したシベリア気団が発達する。", 1], ["(1)い", "西高東低", "西に高気圧、東に低気圧が並ぶ冬型の気圧配置。", 1], ["(1)う", "高気圧", "春・秋は、移動性高気圧と低気圧が交互に日本付近を通る。天気が周期的に変わる。", 1], ["(1)え", "小笠原", "夏は太平洋上の小笠原気団が強く、南高北低の気圧配置になる。", 1], ["(2)", "冬：イ（北西）　夏：ウ（南東）", "冬は大陸から海へ（北西の季節風）、夏は海から大陸へ（南東の季節風）。", 1], ["(3)", "偏西風", "中緯度の上空を西から東へ吹く風。天気が西から東へ移り変わる原因。", 1], ["(4)", "ア", "冬の北西季節風が、あたたかい日本海の上で水蒸気を含み、日本列島の山脈にぶつかって上昇気流となり、日本海側に雪を降らせる。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問1-II 地震", "sg": [[2, 0.0922, 1.0, 1.2943]], "it": [["(1)あ・い", "あ：震度　い：マグニチュード", "揺れの強さは震度（10階級）、地震の規模はマグニチュード（M）。", 1], ["(2)", "P波：6km/s　S波：3km/s", "B→Cの30kmで、P波の到着は5秒差 → 30÷5＝6km/s。S波は10秒差 → 30÷10＝3km/s。", 1], ["(3)", "ウ（8時59分45秒）", "地点A（60km）にP波は10秒で届く（60÷6）。初期微動の開始は8時59分55秒なので、発生は 8時59分45秒。", 1], ["(4)か", "7", "地点D（12km）にP波が届くのは 12÷6＝2秒後。そこから5秒後に発信なので、地震発生の7秒後。", 0], ["(4)き", "15", "45kmの地点にS波が届くのは 45÷3＝15秒後。", 0], ["(4)く", "8", "緊急地震速報を受信するのは発生の7秒後、主要動は15秒後。差は 15−7＝8秒。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問1-II 堆積岩", "sg": [[3, 0.0707, 1.0, 1.4143]], "it": [["(1)①②", "①ア（目）　②ウ（手に持った堆積岩）", "ルーペは目に近づけ、見るものを前後に動かしてピントを合わせる（手にもったものを動かす）。", 0], ["(2)", "カ", "Aは大きな丸い小石＝れき岩、Bは1mmくらいの丸い粒＝砂岩。", 1], ["(3)", "ア", "Cは貝などの化石をふくみ、うすい塩酸で泡が出る＝石灰岩。生物の死がいが堆積した岩石で、鉄くぎでこすると傷がつく。", 1], ["(4)①", "イ（サンヨウチュウ）", "フズリナは古生代の化石。サンヨウチュウも古生代。ビカリアは新生代、アンモナイトは中生代、ナウマンゾウは新生代。", 1], ["(4)②", "示準化石", "地層ができた時代を推定できる化石。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問1-I 岩石のつくり（火成岩）", "sg": [[1, 0.0733, 1.0, 1.4129]], "it": [["(1)あ・い・う", "あ：斑晶　い：石基　う：斑状組織", "Aは大きな鉱物（斑晶）のまわりを細かい粒やガラス質（石基）が囲む「斑状組織」。マグマが地表や地表付近で急に冷えた火山岩のつくり。", 1], ["(2)", "①イ　②エ", "Bは大きな鉱物がすき間なく組み合わさる「等粒状組織」。マグマが地下の深いところで、ゆっくり冷えてできる（深成岩）。", 1], ["(3)", "ウ", "Bは全体的に白っぽく等粒状組織 → 深成岩のうち白っぽい花こう岩。玄武岩・流紋岩は火山岩、はんれい岩は黒っぽい深成岩。", 1], ["(4)", "エ", "岩石の色から判断する。黒っぽい（A）→ねばりけが弱いマグマ、白っぽい（B）→ねばりけが強いマグマ。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問1-II 天気図と気団", "sg": [[2, 0.0784, 1.0, 1.4129]], "it": [["(1)", "1024hPa", "等圧線は4hPaごとに引かれ、20hPaごとが太線。Aは1020の太線から1本分高い線上。", 0], ["(2)①", "温暖前線", "前線Xは半円（▲でなく●）の記号の前線。暖気が寒気の上にはい上がる。", 1], ["(2)②", "エ", "P−Qは寒冷前線をはさむ断面。寒気が暖気の下にもぐり込み、暖気が急に押し上げられる（傾きが急）。", 1], ["(3)", "ウ", "この天気図は西高東低の冬型 → 大陸にできるシベリア気団（冷たく乾燥）。", 1], ["(4)", "イ", "冬の季節風は北西から。", 1], ["(5)", "ア", "冬の太平洋側は、乾燥した晴れの日が続く（日本海側は雪）。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問1-I 岩石", "sg": [[1, 0.0809, 1.0, 1.4129]], "it": [["(1)", "あ A　い D　う 火成岩　え A　お 火山岩", "マグマが固まった岩石は、結晶（鉱物）がかみ合ったつくりをもつ A（斑状組織）と D（等粒状組織）。これらを火成岩という。地表付近で急に冷えてできたのは、斑晶と石基からなる A で、火山岩という。B・C は粒が丸みを帯びているので、流水で運ばれてできた堆積岩。", 0], ["(2)", "イ", "サンゴはあたたかくて浅い、きれいな海にすむ。", 1], ["(3)", "示相化石", "地層ができた当時の環境を知る手がかりになる化石。時代を知る手がかりになるのは示準化石。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問1-II 気温と湿度", "sg": [[2, 0.0834, 1.0, 1.4129]], "it": [["(1)", "ア", "金属は熱を伝えやすいので、容器の表面に接する空気の温度が中の水の温度と同じになる。くもり始めた水温＝露点として測れる。", 1], ["(2)①", "飽和水蒸気量", "1m³の空気がふくむことのできる最大の水蒸気量。", 1], ["(2)②", "52%", "9時は室温25℃、露点14℃。図3より14℃の飽和水蒸気量は約12g、25℃は約23g。湿度＝12/23×100≒52%。", 0], ["(2)③", "約1900g", "空気1m³に12gの水蒸気がふくまれている。12×160＝1920g → 十の位を四捨五入して約1900g。", 0], ["(3)", "水蒸気量：変わらない　湿度：下がった", "図2で、くもり始める水温（露点）は14℃のままなので、空気中の水蒸気量は変わらない。室温は上がっているので、飽和水蒸気量が大きくなり、湿度は下がる。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問2-I 火成岩と火山", "sg": [[3, 0.0814, 1.0, 1.4129]], "it": [["(1)", "等粒状組織", "同じくらいの大きさの鉱物の結晶がすき間なく組み合わさったつくり。", 1], ["(2)", "イ", "地下の深いところでマグマが長い時間をかけて冷えると、結晶が大きく成長する（深成岩）。", 1], ["(3)", "あ 斑晶　い 石基", "火山岩の斑状組織。大きな結晶が斑晶、細かい結晶やガラス質の部分が石基。", 1], ["(4)", "あ 急　い 強く　う 激しい", "白っぽいAの火山aは、マグマのねばりけが強いので、傾きが急な形になり、噴火が激しい。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問2-II 日本の天気", "sg": [[4, 0.0177, 1.0, 1.4129]], "it": [["(1)", "梅雨前線", "つゆの時期に、小笠原気団とオホーツク海気団の間にできる停滞前線。", 1], ["(2)", "ウ", "夏は太平洋から大陸に向かって、南東の季節風がふく。", 1], ["(3)", "イ", "夏は大陸があたたまって低気圧になり、太平洋に高気圧が発達するので、高気圧から低気圧へ風がふく。", 1], ["(4)", "シベリア気団", "冬にユーラシア大陸にできる、冷たく乾燥した気団。", 1], ["(5)", "ウ", "北西の季節風が日本海で水蒸気をふくんで日本海側に大雪をふらせ、山をこえた太平洋側は乾燥した晴れになる。", 1]]}], "化学": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問2-I 金属の加熱と質量", "sg": [[3, 0.07, 1.0, 1.4196], [4, 0.0, 1.0, 1.4171]], "it": [["(1)", "2Cu + O₂ → 2CuO", "銅が酸素と結びついて酸化銅になる。矢印の左右で原子の数をそろえる。", 1], ["(2)", "原点を通る直線（銅0.20gで酸素0.05g、0.40gで0.10g、0.60gで0.15g、0.80gで0.20g）", "結びついた酸素の質量＝加熱後の質量−銅の質量。0.05g、0.10g、0.15g、0.20gの点を打ち、原点を通る直線をひく。銅：酸素＝4：1。", 0], ["(3)", "オ", "化学変化の前後で、原子の組み合わせは変わるが、原子の種類と数は変わらない。そのため全体の質量は変わらない（質量保存の法則）。", 1], ["(4)", "0.45 g", "マグネシウム：酸素＝3：2（0.30g：0.20g）。増えた質量1.70−1.20＝0.50gが結びついた酸素の質量。反応したマグネシウムは0.50×3/2＝0.75g。未反応は1.20−0.75＝0.45g。", 0], ["(5)", "1.2 g", "銅をxgとするとマグネシウムは(3.0−x)g。結びついた酸素は4.5−3.0＝1.5g。x/4＋(3.0−x)×2/3＝1.5 を解いて x＝1.2。（確認：銅1.2g→酸素0.3g、マグネシウム1.8g→酸素1.2g、合計1.5g）", 0]]}, {"e": "S8", "l": "令和８年 12月S日程", "t": "問2-II 金属の密度", "sg": [[5, 0.0166, 1.0, 1.4208]], "it": [["(1)", "ウ", "金属に共通する性質は、みがくと金属光沢が出る、電気や熱をよく通す、たたくとのびる（展性）、引っぱるとのびる（延性）など。磁石につくのは鉄などの一部だけ。", 1], ["(2)", "体積：13.0 cm³　密度：2.7 g/cm³", "液面は63.0mL（60の目盛りのすぐ上、最小目盛り1mL）。体積＝63.0−50.0＝13.0cm³。密度＝35.1g÷13.0cm³＝2.7g/cm³（アルミニウム）。", 0], ["(3)", "C、E", "密度を求める。B＝25.2÷2.4＝10.5、C＝134.4÷15.0＝8.96、D＝30.7÷3.9＝7.87、E＝22.4÷2.5＝8.96。CとEが同じ密度で、同じ物質と考えられる。", 1], ["(4)", "8.0 cm³", "Bの密度は10.5g/cm³。体積＝84.0g÷10.5g/cm³＝8.0cm³。", 0], ["(5)", "イ", "物体Dと合わせた全体の密度が水の密度（1.0g/cm³）より小さければ浮く。イは体積50.0＋3.9＝53.9cm³、質量21.0＋30.7＝51.7gで、密度は約0.96g/cm³＜1.0で浮く。（アは約1.06、ウは約1.10、エは約1.11で、いずれも1.0より大きく沈む）", 1]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問2 化学", "sg": [[4, 0.0844, 1.0, 1.4129], [5, 0.0, 1.0, 1.4129]], "it": [["Ⅰ(1)B", "ウ", "硫酸が残っている（水酸化バリウム水溶液が足りない）ので酸性（pHは7より小さい）。", 1], ["Ⅰ(1)C", "イ", "ちょうど中和した（豆電球が点灯しない）ので pH＝7。", 1], ["Ⅰ(1)D", "ア", "水酸化バリウムが多いのでアルカリ性（pHは7より大きい）。", 1], ["Ⅰ(2)", "Ba(OH)₂ → Ba²⁺ ＋ 2OH⁻", "水酸化バリウムは水にとけて電離し、バリウムイオンと水酸化物イオンになる。", 1], ["Ⅰ(3)", "硫酸バリウム", "H₂SO₄＋Ba(OH)₂ → BaSO₄（白色の沈殿）＋2H₂O。", 1], ["Ⅰ(4)", "グラフ", "陽イオンは、はじめ H⁺ が2x個。水酸化バリウムを加えると H⁺ が減り、12cm³で0個。その後は余った Ba²⁺ がふえ、20cm³で 2x/3 個。（折れ線：(0, 2x) → (12, 0) → (20, 2x/3)）", 1], ["Ⅰ(5)", "17.5cm³", "硫酸10.0cm³とちょうど中和する水酸化バリウム水溶液は12.0cm³。硫酸：水酸化バリウム＝10：12＝5：6。水酸化バリウム21.0cm³には 21.0×5/6＝17.5cm³ の硫酸。", 0], ["Ⅱ(1)あ", "溶質", "水溶液にとけている物質。", 1], ["Ⅱ(1)い", "溶媒", "水溶液における水のように、溶質をとかしている液体。", 1], ["Ⅱ(2)", "28%", "80℃で100gの水に塩化ナトリウム38.0gがとける。38.0÷138.0×100＝27.5…≒28%。", 0], ["Ⅱ(3)①", "エ", "ろ過では、ガラス棒を伝わらせて液を注ぎ、ろうとの先をビーカーの内側のかべにつける。", 1], ["Ⅱ(3)②", "38.8g", "60℃で水50gにとける硝酸カリウム：109.2÷2＝54.6g。20℃：31.6÷2＝15.8g。出てくる結晶＝54.6−15.8＝38.8g。", 0], ["Ⅱ(4)", "30g", "海水1000g中の塩化ナトリウム＝1000×0.035＝35g、水＝965g。950g蒸発すると水は15g。20℃で水15gにとけるのは 35.8×15/100＝5.37g。結晶＝35−5.37＝29.63g ≒ 30g。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問2-I 酸化銀の加熱", "sg": [[3, 0.0833, 1.0, 1.4143]], "it": [["(1)", "イ", "酸素は、うすい過酸化水素水（オキシドール）に二酸化マンガンを入れても発生する。アは水素、ウは硫酸バリウムの沈殿、エは二酸化炭素が発生。", 1], ["(2)", "2Ag₂O → 4Ag + O₂", "酸化銀を加熱すると銀と酸素に分解する（熱分解）。左右で原子の数をそろえる。", 1], ["(3)", "グラフ", "横軸＝酸化銀の質量、縦軸＝発生した酸素の質量。酸素の質量＝酸化銀−銀 なので、(0.60,0.04)(1.20,0.08)(1.80,0.12)(2.40,0.16) の4点と原点を通る直線をかく。", 1], ["(4)", "14：1", "酸化銀0.60g中、銀0.56g、酸素 0.60−0.56＝0.04g。銀：酸素＝0.56：0.04＝14：1。", 0], ["(5)", "1.80g", "加熱後の質量が 6.30−6.00＝0.30g 減った＝発生した酸素0.30g。酸化銀0.60gで酸素0.04g発生するので、分解した酸化銀は 0.30×(0.60/0.04)＝4.50g。未反応は 6.30−4.50＝1.80g。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問2-II 水溶液の区別", "sg": [[4, 0.0894, 1.0, 1.4143]], "it": [["(1)", "D・E", "酸性の水溶液がBTB溶液を黄色にする。青色リトマス紙が赤色に変わる（酸性）のはDとE。", 1], ["(2)", "A：アンモニア水　B：塩化ナトリウム水溶液　C：水酸化ナトリウム水溶液", "A・Cはアルカリ性（赤色リトマス紙が青色に）。加熱して何も残らないAはアンモニア水（気体の溶けた水溶液）、白い固体が残るCは水酸化ナトリウム。Bは中性で白い固体が残る塩化ナトリウム水溶液。", 0], ["(3)", "ウ", "D・Eは塩酸と炭酸水。石灰水を加えて白くにごるのは二酸化炭素がとけた炭酸水。", 1], ["(4)", "18.8％", "質量パーセント濃度＝溶質÷水溶液×100＝1.5÷8.0×100＝18.75 → 18.8％。", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問2 化学（電池・酸化と還元）", "sg": [[3, 0.0495, 1.0, 1.4143], [4, 0.0, 1.0, 1.4143]], "it": [["Ⅰ(1)", "190g", "5%水溶液200g の溶質は 200×0.05＝10g。溶媒（水）は 200−10＝190g。", 1], ["Ⅰ(2)陽", "Zn²⁺", "硫酸亜鉛 ZnSO₄ → Zn²⁺ ＋ SO₄²⁻。", 1], ["Ⅰ(2)陰", "SO₄²⁻", "硫酸イオン。", 1], ["Ⅰ(3)ふえる", "亜鉛イオン", "亜鉛板が Zn → Zn²⁺ ＋ 2e⁻ で溶け出すので、亜鉛イオンがふえる。", 1], ["Ⅰ(3)減る", "銅イオン", "銅板では Cu²⁺ ＋ 2e⁻ → Cu で銅が析出するので、銅イオンが減る（青色がうすくなる）。", 1], ["Ⅰ(4)", "エ", "亜鉛板が−極、銅板が＋極。電子は−極（亜鉛板）から導線を通って＋極（銅板）へ移動する。", 1], ["Ⅰ(5)あ", "化学", "電池は化学エネルギーを電気エネルギーに変える装置。", 1], ["Ⅰ(5)い", "電気", "同上。", 1], ["Ⅱ(1)", "2Cu ＋ O₂ → 2CuO", "銅が酸素と結びついて酸化銅（黒色）ができる。", 0], ["Ⅱ(2)", "4：5", "銅0.12g から酸化物0.15g。0.12：0.15＝4：5。（酸素は 0.03g で、銅：酸素＝4：1）", 0], ["Ⅱ(3)", "1.22g", "増えた質量2.07−1.90＝0.17g が結びついた酸素。銅：酸素＝4：1 なので、反応した銅は 0.17×4＝0.68g。未反応の銅は 1.90−0.68＝1.22g。", 0], ["Ⅱ(4)あ", "水", "酸化銅＋水素 → 銅＋水。試験管の内側の細かい液体の粒は水。", 0], ["Ⅱ(4)い", "還元", "酸化物が酸素をうばわれる化学変化は「還元」。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問2-I 溶解度", "sg": [[3, 0.0789, 1.0, 1.2943]], "it": [["(1)あ・い", "あ：溶質　い：飽和水溶液", "溶けている物質＝溶質。限度まで溶けた水溶液＝飽和水溶液。", 1], ["(2)", "ウ（157g）", "60℃のミョウバンは水100gに約57g溶ける。水溶液の質量は 100＋57＝157g。（溶けた質量ではなく「水溶液の質量」を聞かれている点に注意）", 1], ["(3)", "エ（52％）", "60℃の硝酸カリウムは約110g溶ける。濃度＝110÷(100＋110)×100＝約52％。", 0], ["(4)か", "硝酸カリウム", "溶解度が温度で大きく変わる物質ほど、冷やすと多くの結晶が出る。", 1], ["(4)き", "ウ（78）", "20℃の溶解度は約32g。110−32＝78g。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問2-II 中和", "sg": [[4, 0.0905, 1.0, 1.2943]], "it": [["(1)", "中和", "酸の水素イオンとアルカリの水酸化物イオンが結びついて水ができ、たがいの性質を打ち消し合う反応。", 1], ["(2)", "NaCl", "水酸化ナトリウム＋塩酸 → 塩化ナトリウム（塩）＋水。", 1], ["(3)", "エ", "20.0cm³のとき液は黄色＝酸性。青色リトマス紙が赤色になる。ア（石灰水は二酸化炭素に反応）・イ（フェノールフタレインは酸性で無色）・ウ（NaClが残る）は誤り。", 1], ["(4)", "図", "水酸化物イオンは、0cm³のとき 3x 個で、塩酸を加えるごとに直線的に減り、15cm³（中性）で 0 になる。その後は 0 のまま。（塩化物イオンは加えた体積に比例して増える）", 1], ["(5)", "36cm³", "実験で、水酸化ナトリウム水溶液20.0cm³を中和するのに塩酸15cm³必要。48.0cm³なら 20：15＝48：x → x＝36cm³。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問2-I 酸化銅と炭素の反応", "sg": [[4, 0.0813, 1.0, 1.4143]], "it": [["(1)", "ウ", "石灰水が試験管Aに逆流しないよう、火を消す前にガラス管を石灰水から抜く。", 1], ["(2)", "酸化銅：還元　炭素：酸化", "酸化銅は酸素をうばわれて銅になる（還元）。炭素は酸素と結びついて二酸化炭素になる（酸化）。", 1], ["(3)", "赤い物質：3.20g　気体：1.10g", "グラフより、酸化銅4.00gは炭素0.30gと過不足なく反応して銅3.20gになる。炭素が0.40gなら炭素は余るので、赤い物質（銅）は3.20gのまま。発生した気体（二酸化炭素）は 4.00＋0.30−3.20＝1.10g。", 0], ["(4)", "図", "2CuO ＋ C → 2Cu ＋ CO₂。空欄には、左は炭素原子1個、右は銅原子2個をかく。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問2-II 塩酸の電離", "sg": [[5, 0.0707, 1.0, 1.4143]], "it": [["(1)①", "電離", "電解質が水にとけて陽イオンと陰イオンに分かれること。", 1], ["(1)②", "あ：H⁺　い：Cl⁻", "HCl → H⁺ ＋ Cl⁻。", 1], ["(2)", "水素イオン", "青色リトマス紙の色が陰極側に広がった。陽イオン（H⁺）が陰極へ移動して酸性の色（赤）に変えたため。", 1], ["(3)", "エ・オ", "陽極で発生した気体は塩素（刺激臭）。殺菌作用と漂白作用がある。アは二酸化炭素、イは酸素、ウは水素の性質。", 1], ["(4)", "C", "水酸化ナトリウム水溶液ではアルカリ性を示す水酸化物イオンが陽極側へ移動するので、赤色リトマス紙の陽極側（C）が青く変わる。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問2-I 気体の区別", "sg": [[3, 0.0748, 1.0, 1.4129]], "it": [["(1)", "CO₂、NH₃（二酸化炭素・アンモニア）", "化合物は2種類以上の元素でできた物質。水素H₂・窒素N₂・塩素Cl₂は単体。", 0], ["(2)", "B：塩素　C：二酸化炭素", "刺激臭 → アンモニアか塩素（B・D）。水にとけてペットボトルがへこむ → 水にとけやすい気体。フェノールフタレインで赤に変化 → アルカリ性 → D＝アンモニア。Bは刺激臭で酸性（変化なし）の塩素。無臭で水に少しとけるCは二酸化炭素。Aは窒素、Eは水素（音を出して燃える）。", 1], ["(3)", "2H₂ + O₂ → 2H₂O", "水素が燃える（酸素と化合）と水ができる。", 0], ["(4)", "イ", "窒素Aと水素Eは、密度（軽さ）のちがいで区別できる。ポリエチレンの袋に入れて口を閉じて置くと、軽い水素は浮き上がる。石灰水・リトマス紙はどちらも変化なし。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問2-II マグネシウムの加熱", "sg": [[4, 0.0789, 1.0, 1.4129]], "it": [["(1)", "発熱反応", "熱を周囲に出して温度が上がる反応は「発熱反応」（吸熱反応の反対）。", 1], ["(2)", "MgO", "2Mg + O₂ → 2MgO。酸化マグネシウム。", 1], ["(3)", "グラフ", "結びついた酸素＝酸化物−マグネシウム。(0.30,0.20)(0.45,0.30)(0.60,0.40)(0.75,0.50)(0.90,0.60) の5点を取り、原点を通る直線を引く。", 1], ["(4)", "3.50g", "Mg：酸化物＝3：5。2.10：x＝3：5 より x＝3.50。", 0], ["(5)", "0.48g", "加熱後の質量1.18g−もとの0.90g＝結びついた酸素0.28g。Mg：O＝3：2より反応したMg＝0.28×3/2＝0.42g。残り＝0.90−0.42＝0.48g。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問2-I 銅の酸化と酸化銅の還元", "sg": [[3, 0.0814, 1.0, 1.4129]], "it": [["(1)", "2Cu＋O₂→2CuO", "銅と酸素が結びついて酸化銅ができる。左右で原子の数をそろえる。", 1], ["(2)", "0.50g", "表1より銅0.20gで酸化銅0.25g、結びつく酸素は0.05g。銅：酸素＝4：1。2.00gの銅には 2.00÷4＝0.50g。", 1], ["(3)", "0.52g", "ふえた0.32gが結びついた酸素。4：1＝x：0.32 より、反応した銅は1.28g。未反応の銅は 1.80−1.28＝0.52g。", 0], ["(4)", "CO₂", "石灰水を白くにごらせるのは二酸化炭素。炭素が酸化銅から酸素をうばってできた。", 1], ["(5)", "あ 銅　い 酸化銅　う 炭素", "炭素が少ないあいだは酸化銅が残る（銅と酸化銅）。0.15gでちょうど反応し、それ以上は炭素があまる（銅と炭素）ので質量が増えていく。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問2-II 中和", "sg": [[4, 0.0824, 1.0, 1.4129]], "it": [["(1)", "A、C、E", "白い沈殿の量が0.36gで止まるので、硫酸15cm³は水酸化バリウム水溶液20cm³（D）でちょうど中和する。A・Cは酸性（Aのほうが硫酸が多く残るのでpHが小さい）、Eはアルカリ性。", 1], ["(2)", "H⁺ 2個、H₂O 2個、SO₄²⁻ 1個、BaSO₄ 1個（沈殿）", "H⁺とOH⁻が結びついて水になり、Ba²⁺とSO₄²⁻が結びついて硫酸バリウムの沈殿になる。H⁺ 4個のうち2個はそのまま残る。", 0], ["(3)", "イ、ウ、エ", "Fは水酸化バリウム水溶液があまっているのでアルカリ性。アは酸性の水溶液の性質。", 1], ["(4)", "D", "ちょうど中和して、H⁺もOH⁻も残らず、硫酸バリウムは沈殿になるのでイオンがほとんどない。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問3-I 気体の区別", "sg": [[5, 0.0794, 1.0, 1.4129]], "it": [["(1)", "ウ", "袋Aは線香の火が消え、水にとけない＝窒素。水にとけにくい気体は水上置換法で集める。", 1], ["(2)", "イ、エ", "袋Bは線香が激しく燃えた＝酸素。酸化銀の加熱や、二酸化マンガン＋オキシドールで発生する。アは水素、ウは二酸化炭素。", 1], ["(3)", "C CO₂　D NH₃", "袋Dが最もしぼんだ＝水に非常によくとけるアンモニア。袋Cは少ししぼんだ＝水に少しとける二酸化炭素。", 1], ["(4)", "D エ　E ア", "アンモニアの水溶液はアルカリ性で、フェノールフタレイン溶液を赤くする。袋Eは空中に浮いた＝水素で、空気と混ぜて火を近づけると爆発的に燃える。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問3-II 鉄と硫黄の化合", "sg": [[6, 0.0839, 1.0, 1.4129]], "it": [["(1)", "発熱反応", "熱を発生する化学変化。加熱をやめても反応が続く。", 1], ["(2)①", "硫黄", "図2より、鉄7：硫黄4の割合で化合する（鉄7.00gで硫黄4.00g）。", 1], ["(2)②", "0.91g", "鉄4.00gと化合する硫黄は 4.00×4/7≒2.29g。残る硫黄は 3.20−2.29＝0.91g。", 0], ["(3)", "◎○が4組、○が2個", "反応前は鉄原子（◎）4個、硫黄原子（○）6個。鉄と硫黄は1：1で結びつくので、◎○（硫化鉄）が4組でき、硫黄○が2個残る。", 0], ["(4)", "ア", "硫化鉄にうすい塩酸を加えると硫化水素が発生する。硫化水素は卵のくさったようなにおいがする。", 1]]}], "生物": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問3-I 植物のふえ方", "sg": [[6, 0.0711, 1.0, 1.4178]], "it": [["(1)", "柱頭", "花粉は、めしべの先端の柱頭につくと花粉管をのばす。砂糖水は柱頭と同じような環境をつくるために使う。", 1], ["(2)", "①減数分裂　②7本", "花粉などの生殖細胞がつくられるときは、染色体の数が半分になる減数分裂が行われる。体細胞の染色体が14本なので、花粉の染色体は14÷2＝7本。", 1], ["(3)", "あ：精細胞　い：卵細胞", "花粉管の中を精細胞（の核）が移動し、胚珠の中の卵細胞（の核）と合体して受精する。", 1], ["(4)", "ア", "有性生殖では両方の親から染色体（遺伝子）を半分ずつ受けつぐ。無性生殖では体細胞分裂だけでふえるので、親の遺伝子をそのまま（すべて）受けつぐ。", 1]]}, {"e": "S8", "l": "令和８年 12月S日程", "t": "問3-II 呼吸と血液循環", "sg": [[7, 0.0167, 1.0, 1.4203], [8, 0.0, 1.0, 1.418]], "it": [["(1)", "横隔膜", "ゴム膜は、ろっ骨の下にある筋肉の膜「横隔膜」を表している。ゴム風船は肺。", 1], ["(2)", "イ", "ひもを下に引くとゴム膜が下がり、ペットボトル内の体積が大きくなって気圧が小さくなる。そのため外の空気が入ってゴム風船がふくらむ。（息を吸うときの横隔膜の動き）", 1], ["(3)", "オ", "酸素を多くふくむ血液（動脈血）が流れるのは、肺から心臓へ向かう肺静脈（d）と、心臓から全身へ向かう大動脈（c）。a（肺動脈）とb（大静脈）には酸素の少ない静脈血が流れる。", 1], ["(4)", "エ", "心室が収縮すると、心房と心室の間の弁Y（房室弁）は閉じ（f）、心室と動脈の間の弁Z（動脈弁）は開いて血液が動脈へ送り出される（h）。", 1], ["(5)", "50 秒", "1分間に送り出される血液は60×80＝4800cm³。全血液量4000cm³÷4800cm³／分＝5/6分＝50秒。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問3 生物", "sg": [[6, 0.0854, 1.0, 1.4129], [7, 0.0, 1.0, 1.4129]], "it": [["Ⅰ(1)あ", "卵", "雌がつくる生殖細胞。", 1], ["Ⅰ(1)い", "精子", "雄がつくる生殖細胞。", 1], ["Ⅰ(1)う", "有性生殖", "受精によって新しい個体ができるふえ方。", 1], ["Ⅰ(2)", "顕性形質", "対立形質をもつ純系どうしをかけ合わせたとき、子に現れる形質。（子はすべて黒色）", 1], ["Ⅰ(3)", "ウ", "孫の黒色60匹は BB：Bb＝1：2。BB＝60×1/3＝20匹。（黒色の純系と同じ遺伝子 BB をもつ個体）", 1], ["Ⅰ(4)", "Bb", "黄色(bb)とかけ合わせて黒色：黄色＝1：1になったので、黒色のメダカは Bb。（BB なら子はすべて黒色）", 1], ["Ⅱ(1)", "150倍", "接眼レンズ15倍×対物レンズ10倍。", 0], ["Ⅱ(2)", "気孔", "2つの三日月形の細胞（孔辺細胞）がつくるすきま。", 1], ["Ⅱ(3)あ", "蒸発", "水面から水が蒸発するのを防ぐ。", 1], ["Ⅱ(3)い", "大きく", "油でおおわないと水面からも蒸発し、水の減少量が大きくなる。", 1], ["Ⅱ(4)", "1.1cm³", "A：何もしない、B：表側にワセリン、C：裏側にワセリン。A−B＝4.4−3.3＝1.1cm³ が葉の表側から放出された水の量。", 0], ["Ⅱ(5)か", "多い", "裏側の放出量は A−C＝4.4−1.2＝3.2cm³。表側（1.1cm³）より多い。", 0], ["Ⅱ(5)き", "裏側", "気孔は、葉の裏側のほうが多いと考えられる。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問3-I 刺激と反応", "sg": [[5, 0.0818, 1.0, 1.4143]], "it": [["(1)", "あ：感覚　い：運動", "皮ふ（感覚器官）→ 感覚神経 → せきずい → 脳 → せきずい → 運動神経 → 筋肉。", 1], ["(2)", "か：0.27　き：5.47", "12人で一周する時間が平均3.29秒。1人あたり 3.29÷12＝0.274… → 0.27秒。信号の通る道は1人あたり1.5m。速さ＝1.5÷(3.29÷12)＝18÷3.29＝5.47m/s。", 1], ["(3)", "反射", "刺激に対して無意識に起こる反応。", 1], ["(4)", "イ・ウ", "寒くて体がふるえる、食べ物を口に入れるとだ液が出る、は無意識の反応（反射）。ア・エは意識して行う反応。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問3-II 植物の分類", "sg": [[6, 0.0929, 1.0, 1.4143]], "it": [["(1)①", "A：エ　D：ア", "A：根・茎・葉の区別がない（ゼニゴケ）か、あるか。D：子葉が1枚（ツユクサ＝単子葉類）か2枚（タンポポ＝双子葉類）か。", 1], ["(1)②", "イヌワラビ：ウ　マツ：オ　タンポポ：ア", "イヌワラビ＝シダ植物 → ゼンマイ。マツ＝裸子植物 → スギ。タンポポ＝双子葉類 → ダイコン。トウモロコシは単子葉類、スギゴケはコケ植物。", 0], ["(2)", "胞子", "コケ植物とシダ植物は、種子ではなく胞子でふえる。", 1], ["(3)", "あ：主根　い：側根", "タンポポの根は、太い主根と、そこからのびる細い側根からなる（双子葉類）。ひげ根は単子葉類。", 1]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問3 生物", "sg": [[5, 0.0525, 1.0, 1.4143], [6, 0.0, 1.0, 1.4143]], "it": [["Ⅰ(1)あ", "変わらない", "D・E・F（オオカナダモなし）は、オオカナダモがない条件で BTB溶液の色が「変わらない」ことを確認する。", 1], ["Ⅰ(1)い", "対照実験", "調べようとすること以外の条件を同じにして行う実験。", 1], ["Ⅰ(2)", "酸素", "光合成で出る気体は酸素。", 1], ["Ⅰ(3)か", "アルカリ", "BTB溶液：青色＝アルカリ性、緑色＝中性、黄色＝酸性。", 1], ["Ⅰ(3)き", "中", "緑色は中性。", 1], ["Ⅰ(3)く", "酸", "黄色は酸性。", 1], ["Ⅰ(3)け", "二酸化炭素", "息にふくまれる二酸化炭素が水にとけると酸性になる。Aは青色（アルカリ性）→二酸化炭素が減った（光合成で吸収）。Cは黄色（酸性）→二酸化炭素が増えた（呼吸のみ）。", 1], ["Ⅰ(4)", "ウ", "Bは光が弱くて緑色＝二酸化炭素の量が変わらない（呼吸＝光合成）。光が弱いと光合成の量が少ないため、二酸化炭素の吸収量が減少する。", 1], ["Ⅱ(1)あ", "セキツイ動物", "背骨のある動物のなかま。", 1], ["Ⅱ(1)い", "卵", "雌がつくる生殖細胞は卵。", 1], ["Ⅱ(1)う", "精子", "雄がつくる生殖細胞は精子。", 1], ["Ⅱ(2)か", "胎生", "母親の体内である程度育ってから生まれる。", 0], ["Ⅱ(2)き", "卵生", "卵を産む。", 0], ["Ⅱ(3)", "イ", "サンショウウオは両生類。幼生はえらと皮膚、成体は肺と皮膚で呼吸する。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問3-I だ液のはたらき", "sg": [[5, 0.0889, 1.0, 1.2943], [6, 0.0, 1.0, 1.2943]], "it": [["(1)", "あ：A　い：C　う：B　え：D", "ヨウ素液でデンプンの有無を、ベネジクト液（加熱）で糖の有無を調べる。A（水・ヨウ素）は青紫でデンプンあり、C（だ液・ヨウ素）は変化なし → C（だ液）ではデンプンがなくなった。B（水・ベネジクト）は反応なし、D（だ液・ベネジクト）は赤褐色 → D（だ液）で糖ができた。", 1], ["(2)", "エ（アミラーゼ）", "だ液中のデンプンを分解する消化酵素。ペプシンは胃液でタンパク質、トリプシンはすい液でタンパク質、リパーゼは脂肪。", 1], ["(3)", "柔毛", "小腸の内側のひだにある突起。表面積を大きくして養分を効率よく吸収する。", 1], ["(4)", "ウ", "0℃（E・F）でも75℃（G・H）でも、ヨウ素液は青紫のまま・ベネジクト液は水色のまま → デンプンが変化していない。つまり、だ液は0℃でも75℃でもはたらかない。（体温ぐらいの40℃でよくはたらく）", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問3-II エンドウの遺伝", "sg": [[7, 0.0193, 1.0, 1.2943]], "it": [["(1)", "あ：精細胞　い：卵細胞　う：有性", "花粉の中の生殖細胞＝精細胞、胚珠の中の生殖細胞＝卵細胞。合体（受精）して新しい個体ができるふえ方は有性生殖。", 1], ["(2)", "潜性形質", "対立形質をもつ純系どうしをかけ合わせたとき、子に現れない形質（劣性形質）。「緑色」は潜性形質。", 1], ["(3)", "ア（25％）", "草たけ高い子（Aa）を自家受粉すると、孫は AA：Aa：aa＝1：2：1。低い（aa）のは25％。", 0], ["(4)", "イ（約180個）", "丸形の孫（AA：Aa＝1：2）のうち、純系（AA）は 1/3。548×1/3＝約183個 → 約180個。", 0], ["(5)", "Tt", "個体Xに草たけが低い（tt）個体を交配して、高い個体と低い個体がほぼ同数。Xが TT なら子は全て Tt（すべて高い）、Tt なら Tt：tt＝1：1。よってXは Tt。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問3-I 植物の分類", "sg": [[6, 0.0818, 1.0, 1.4143]], "it": [["(1)", "C", "雌花は枝の先端近くにつく小さな松かさ（C）。雄花は根もと側（A付近）。", 1], ["(2)", "胞子", "イヌワラビ（シダ植物）とゼニゴケ（コケ植物）は胞子でなかまをふやす。", 1], ["(3)①", "あ：胚珠　い：子房", "被子植物は、受粉後に胚珠が種子になり、子房の中に包まれている。", 1], ["(3)②", "ウ（イチョウ）", "マツは裸子植物。イチョウ、スギ、ソテツなども裸子植物（スギナはシダ植物）。サクラ・アサガオは被子植物。", 1], ["(4)", "イ", "根・茎・葉の区別があるのは、アブラナ・マツ・イヌワラビ。コケ植物のゼニゴケだけは区別がない。ア（光合成）はすべての植物に当てはまる。ウの花・エの実は、アブラナ以外にもないものがあるので「ゼニゴケだけ」とはいえない。（模範解答に従う）", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問3-II 反射", "sg": [[7, 0.0788, 1.0, 1.4143]], "it": [["(1)", "反射", "刺激に対して無意識に起こる反応。", 1], ["(2)①", "中枢神経", "脳とせきずい。", 1], ["(2)②", "b → f", "反射の経路：皮ふ→（感覚神経b）→せきずい→（運動神経f）→筋肉。脳を通らない。", 1], ["(3)", "イ", "うでを曲げるとき、Aの筋肉が縮み、Bの筋肉がゆるむ。", 1], ["(4)", "ア", "暗い所に入るとひとみが大きくなる。これはこうさいのはたらき。", 0], ["(5)", "ウ", "口にあめを入れるとだ液が出るのは無意識の反応（反射）。ア・イ・エは意識して行う反応。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問3-I ヒトの消化と血液", "sg": [[5, 0.0763, 1.0, 1.4129], [6, 0.0, 1.0, 1.4129]], "it": [["(1)", "イ", "白血球は病原体を分解する。アは赤血球（ヘモグロビンが酸素を運ぶ）、ウは血しょう、エは血小板の説明で、入れかわっている。", 1], ["(2)", "あ：ブドウ糖　い：アミノ酸　う：モノグリセリド", "デンプン→ブドウ糖、タンパク質→アミノ酸、脂肪→脂肪酸とモノグリセリド。", 0], ["(3)", "肝臓", "小腸で吸収されたブドウ糖の一部は肝臓でグリコーゲンに合成され、たくわえられる。", 1], ["(4)", "イ・ウ", "タンパク質を分解する消化酵素は、胃液（ペプシン）とすい液（トリプシンなど）。だ液はデンプン、胆汁は脂肪の消化を助ける（消化酵素ではない）。", 1], ["(5)", "X：酸素　Y：二酸化炭素　Z：水", "細胞での呼吸：栄養分＋酸素 → 二酸化炭素＋水＋エネルギー。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問3-II 細胞分裂の観察", "sg": [[7, 0.0799, 1.0, 1.4129]], "it": [["(1)", "ウ", "根をおして広げ、細胞の重なりを少なくして観察しやすくする。", 1], ["(2)", "あ：少なく　い：暗く", "倍率を高くすると、見える範囲がせまくなり細胞の数は少なく、視野は暗くなる。", 1], ["(3)", "[1]：B　[2]：A", "根の先端（C付近）ほど細胞分裂がさかん。[3]はさかんに分裂中の細胞 → 先端のC。[1]は細胞が長く育っている部分で根もとに近いA、[2]はその中間のB。（解答例の記号に従う）", 0], ["(4)", "染色体", "分裂のときに見られるひも状のもの。染色液（酢酸オルセイン）で染まる。", 1], ["(5)", "a → c → d → b → e", "核の中に染色体が現れる（a）→ 染色体が中央に並ぶ（c）→ 両端に分かれていく（d）→ 細胞が2つに分かれはじめる（b）→ 2つの細胞（e）。", 1], ["(6)", "減数分裂", "生殖細胞をつくるときの分裂。染色体の数が半分になる。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問3-I 血液の循環", "sg": [[5, 0.0819, 1.0, 1.4129], [6, 0.0, 1.0, 1.4129]], "it": [["(1)", "体循環", "心臓から肺以外の全身をめぐって心臓にもどる経路。肺を通るのは肺循環。", 1], ["(2)", "A、D", "心臓から出ていく血液が流れる血管が動脈。Aは肺動脈、Dは大動脈。", 1], ["(3)", "c", "小腸で吸収したアミノ酸やブドウ糖は、小腸から肝臓へ向かう血管（門脈）を通る。", 1], ["(4)", "肺胞", "気管支の先にある小さな袋。表面積が大きくなり、気体の交換がしやすい。", 1], ["(5)", "あ 赤血球　い 血しょう", "酸素は赤血球（ヘモグロビン）が運び、二酸化炭素は血しょうにとけて運ばれる。", 1], ["(6)", "肝臓", "有害なアンモニアを、害の少ない尿素に変える。", 1], ["(7)", "エ", "尿の尿素2.00%÷血液の尿素0.03%≒67倍。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問3-II ナスの花と果実", "sg": [[7, 0.0177, 1.0, 1.4129]], "it": [["(1)", "ウ", "観察するものが動かせない（つみとらない）ときは、ルーペを目に近づけたまま、顔とルーペをいっしょに前後に動かしてピントを合わせる。（元の解答用紙はアとなっていますが、教科書の方法ではウです）", 1], ["(2)", "合弁花類", "花弁がつながっている双子葉類。花弁が離れているのは離弁花類。", 1], ["(3)", "エ", "葉脈が網目状なので双子葉類。根は主根と側根、茎の維管束は輪の形に並ぶ。", 1], ["(4)", "あ 柱頭　い 子房　う 胚珠", "受粉すると子房は果実に、胚珠は種子になる。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問4-I だ液のはたらき", "sg": [[7, 0.0809, 1.0, 1.4129]], "it": [["(1)", "あ C　い A　う D　え B", "ヨウ素液（デンプンの検出）は、だ液を入れたCでは変化しない＝デンプンがなくなった。ベネジクト液（糖の検出）は、だ液を入れたDで赤褐色＝糖ができた。水だけのA・Bと比べる。", 1], ["(2)", "アミラーゼ", "だ液にふくまれる、デンプンを分解する消化酵素。", 1], ["(3)①", "すい液", "タンパク質（胃液のあと）とデンプン・脂肪のすべてにはたらく消化液。胆汁は脂肪の分解を助ける。", 1], ["(3)②", "P ブドウ糖　Q モノグリセリド", "Pは小腸の壁の消化酵素で分解されてできた最終的な物質のうち、デンプン由来のブドウ糖（アミノ酸もふくむ）。脂肪は脂肪酸とモノグリセリドに分解される。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問4-II 蒸散と茎のつくり", "sg": [[8, 0.0824, 1.0, 1.4129]], "it": [["(1)", "蒸散", "植物の体から水が水蒸気となって出ていくこと。主に気孔から出る。", 1], ["(2)", "あ 0.8　い 2.4　う 裏", "Aは茎からだけ（0.1mL）。表側＝C−A＝0.9−0.1＝0.8mL、裏側＝B−A＝2.5−0.1＝2.4mL。裏側のほうが多いので気孔が多い。", 0], ["(3)", "40倍", "拡大倍率＝接眼レンズの倍率×対物レンズの倍率＝4×10＝40倍。", 0], ["(4)", "ウ", "根から吸った水は道管を通る。道管は維管束の茎の中心側にあるQ。", 1]]}], "物理": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問4-I 電流と電圧", "sg": [[9, 0.076, 1.0, 1.4239]], "it": [["(1)", "あ：比例　い：オーム", "電流の大きさは電圧の大きさに比例する。この関係をオームの法則という。", 1], ["(2)", "1.5倍", "図2より電圧3.0Vのとき、Aは750mA、Bは500mA。抵抗A＝3.0÷0.75＝4Ω、抵抗B＝3.0÷0.5＝6Ω。6÷4＝1.5倍。", 1], ["(3)", "0.6 A", "電圧計は抵抗Aにつながっているので、A（4Ω）に2.4Vがかかる。直列回路で流れる電流は同じなので、2.4÷4＝0.6A。", 1], ["(4)", "3.0 V", "並列回路では各抵抗にかかる電圧が等しい。電流計は抵抗Bに流れる電流を測っているので、電圧＝6Ω×0.5A＝3.0V。", 0], ["(5)", "4倍", "抵抗Cの大きさをRとする。直列回路の全体の抵抗は2R、並列回路は R/2。電圧が同じなら消費電力は(電圧)²÷抵抗なので、並列÷直列＝(V²÷R/2)÷(V²÷2R)＝4倍（Vは電圧）。", 0]]}, {"e": "S8", "l": "令和８年 12月S日程", "t": "問4-II 浮力と水圧", "sg": [[10, 0.0767, 1.0, 1.4254]], "it": [["(1)", "エ", "ばねばかりが物体を引く力（上向き）とつり合っているのは、物体にはたらく重力（下向き）。（物体が地球を引く力は、重力と作用・反作用の関係）", 1], ["(2)", "1.6 N", "空気中の重さ5.0N−ばねばかりの値3.4N＝1.6N。", 1], ["(3)", "ウ", "水圧は深いほど大きく、物体の面に垂直にはたらく。下の面にはたらく上向きの水圧が、上の面にはたらく下向きの水圧より大きい。側面の水圧も深いほど大きいウ。", 1], ["(4)", "ウ", "浮力は、深さ0cmで0N、1.0cmで0.8N、2.0cmで1.6N、3.0cmで2.4Nと深さに比例して大きくなり、物体が完全に沈む3.0cm以降は2.4Nで一定になる。", 1], ["(5)", "14 N", "深さ2.5cmのときの浮力は0.8×2.5＝2.0N。物体は水から浮力を受け、水（水そう）は物体から同じ大きさの力で押し返されるので、台ばかりの値＝12＋2.0＝14N。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問4 物理", "sg": [[8, 0.0849, 1.0, 1.4129], [9, 0.0, 1.0, 1.4129]], "it": [["Ⅰ(1)", "図", "斜面に平行な分力（斜面にそって下向き）と、斜面に垂直な分力（斜面を押す向き）を、重力を対角線とする長方形（平行四辺形）の2辺としてかく。", 1], ["Ⅰ(2)", "137cm/s", "cのテープの長さ13.7cmは 0.1秒（50打点/秒で5打点）の移動距離。13.7÷0.1＝137cm/s。", 1], ["Ⅰ(3)", "e", "速さが変わらなくなる（テープの長さが一定になる）最初の区間＝水平面に到達した区間。図のeからはテープの長さが一定。", 1], ["Ⅰ(4)あ", "等しく", "台車がもつ位置エネルギーは高さが同じなら変わらないので、水平面に到達したときの速さは等しい。", 1], ["Ⅰ(4)い", "大きく", "斜面の傾きを大きくすると、速さが変化する割合は大きくなる。", 1], ["Ⅰ(4)う", "短く", "斜面を下るのにかかる時間は短くなる。", 1], ["Ⅱ(1)", "伝導", "熱が高温の部分から低温の部分へ伝わる現象（熱伝導）。", 1], ["Ⅱ(2)", "900J", "電熱線A（12.0Ω）に6.0Vで流れる電流＝6.0÷12.0＝0.5A。電力＝6.0×0.5＝3.0W。5分間＝300秒。電力量＝3.0×300＝900J。", 0], ["Ⅱ(3)あ", "大きく", "電圧が等しいとき、抵抗が小さいほど電流が大きく、電力が大きくなる。", 1], ["Ⅱ(3)い", "激しく（大きく）", "消費電力が大きいので、水の温度の上がり方が激しくなる。", 1], ["Ⅱ(4)", "ア", "直列なので電流は等しい。発熱量は電力量に比例し、電力は I²R なので抵抗に比例する。A（12Ω）はB（6Ω）の2倍の熱を出し、水の温度上昇も約2倍。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問4-I 音の性質", "sg": [[7, 0.0843, 1.0, 1.4143], [8, 0.0, 1.0, 1.4143]], "it": [["(1)", "エ", "空気が音を伝える。真空中（空気がない）では音は伝わらない。", 1], ["(2)", "a", "振幅は、波の中心線からの最大のふれ幅（上下の幅の半分）を表すa。bは1回の振動の長さの一部、cは波長（周期）、dは…別の長さ。", 1], ["(3)", "イ", "強くはじくと、音は大きくなり（振幅が大きい）、音の高さ（振動数）は変わらない。波の数は同じで、山が高く谷が深いイ。", 1], ["(4)", "か：ア　き：カ　く：エ", "条件を1つだけ変えて比べる（対照実験）。か：弦の強さ→AとB。き：太さ→CとD。く：長さ→BとC。", 1]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問4-II 仕事と仕事率", "sg": [[9, 0.0838, 1.0, 1.4143]], "it": [["(1)", "仕事：0.6J　仕事率：0.3W", "仕事＝力×距離＝6.0N×0.10m＝0.6J。引く速さ5cm/sで10cm引くのに2秒。仕事率＝0.6J÷2s＝0.3W。", 1], ["(2)", "エ（A＝B＝C）", "仕事の原理：道具を使っても仕事の大きさは変わらない。滑車・動滑車・斜面とも同じ。", 1], ["(3)", "あ：2　い：1/2", "動滑車を使うと、引く距離は2倍（10cm→20cm）、力は半分（6.0N→3.0N）。", 0], ["(4)", "50cm", "仕事は変わらず0.6J。1.2N×距離＝0.6J → 距離0.5m＝50cm。（3.0N×20cm＝1.2N×50cm）", 0]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問4 物理（光・浮力）", "sg": [[7, 0.0616, 1.0, 1.4143], [8, 0.0, 1.0, 1.4143], [9, 0.0, 1.0, 1.4143]], "it": [["Ⅰ(1)", "屈折", "光が異なる物質の境界で曲がる現象。", 1], ["Ⅰ(2)", "実像", "スクリーン上にうつる像は「実像」。", 1], ["Ⅰ(3)", "ウ", "凸レンズの実像は上下左右が逆。スクリーン上の像を光源側（レンズ側）から見ると、もとのF字を180°回転した形になる。", 1], ["Ⅰ(4)あ", "2", "光源が焦点距離6.0cmの2倍（12.0cm）のとき、像の距離も12.0cmで、実物と同じ大きさの像ができる。", 1], ["Ⅰ(4)い", "遠い", "焦点距離の2倍より遠いとき（実験：14.0〜18.0cm）、実物より小さい像ができる。", 1], ["Ⅰ(4)う", "近い", "焦点距離の2倍より近い（焦点距離より遠い）とき（10.0〜8.0cm）、実物より大きい像ができる。", 1], ["Ⅰ(5)①", "イ", "焦点距離12.0cm、光源までの距離20.0cm。レンズの式 1/20＋1/b＝1/12 → b＝30cm。24.0cmより長くなる。（2f＝24cm より物体が近いので像の距離は2fより遠い）", 1], ["Ⅰ(5)②", "イ", "像の倍率＝30÷20＝1.5倍で、実物より大きくなる。", 1], ["Ⅱ(1)", "弾性力", "変形したばねがもとにもどろうとする力。", 1], ["Ⅱ(2)", "エ", "物体Aには下向きの重力と、上向きの浮力・ばねの力がはたらく。重力と浮力の合力が、ばねの力とつり合っている（浮力はばねの力とは別に上向き）。", 1], ["Ⅱ(3)", "グラフ", "浮力＝3.30−ばねばかりの値。0, 0.25, 0.50, 0.75, 1.00, 1.25 N の点を原点から結ぶ（水面からの距離が5.0cmまで、比例して増加）。", 0], ["Ⅱ(4)", "400Pa", "4.0cmのときの水圧は、浮力1.00N が下面（25.0cm²＝0.0025m²）にはたらくので 1.00÷0.0025＝400Pa。", 0], ["Ⅱ(5)", "ア", "浮力が物体の重さに関係しないことを確かめるには、体積は同じで重さ（密度）だけがちがう物体を使う。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問4-I 回路と電流", "sg": [[8, 0.0861, 1.0, 1.2943]], "it": [["(1)", "図", "電流計は抵抗器Xと直列、電圧計は抵抗器Xと並列につなぐ。電源の＋極からスイッチ→電流計→抵抗器X→電源の−極と1本につなぎ、電圧計は抵抗器Xの両端につなぐ。（電流計・電圧計とも、わからないときは大きい端子から）", 1], ["(2)あ・い", "あ：12　い：0.15", "図2の電圧計と電流計の針を読む。電圧12V、電流0.15A。", 1], ["(2)う", "80Ω", "R＝V÷I＝12÷0.15＝80Ω。", 0], ["(3)", "①：0.24A　②：0.6A", "①直列：P＋Q＝50Ω、12÷50＝0.24A（Pにも同じ電流）。②並列：Pには12Vがかかるので 12÷20＝0.6A。", 0], ["(4)", "W₂＝W₄＞W₁＞W₃", "Qに加わる電圧：②④の並列は30Vそのまま、①は 30V×30/50＝18V、③は 30V×30/80＝11.25V。電力＝V²÷R（R＝30Ω）で W₁＝10.8W、W₂＝W₄＝30W、W₃≒4.2W。※解答用紙の手書きは「W₂＞W₄＞W₁＞W₃」ですが、並列回路ではQに同じ30Vが加わるので W₂とW₄は等しくなります。", 1]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問4-II ばねと仕事", "sg": [[9, 0.0889, 1.0, 1.2943]], "it": [["(1)", "イ・エ", "のびは質量に比例する（イ）。X：Y＝1.5：2.0＝0.75（エ）。ア：長さはもとの長さがあるので比例しない（のびが比例）。ウ：40gのときXは3cm、Yは4cm。", 1], ["(2)", "108g", "のびは 17.1−9.0＝8.1cm。Pは20g、1個でXは1.5cmのびる。8.1÷1.5×20＝108g。", 1], ["(3)①", "12.5cm", "動滑車を使うので、ばねYにかかる力は物体の重さの半分で125g分。Yは20gで2.0cm → 125gで 125÷20×2.0＝12.5cm。", 0], ["(3)②", "0.2J", "物体を8cm引き上げる仕事＝2.5N×0.08m＝0.2J。（ばねYが物体Rにした仕事は、物体の重さ分で 2.5N）", 0], ["(3)③", "0.05W", "動滑車なので糸は16cm引かれる。速さ4cm/sなら 16÷4＝4秒。仕事率＝0.2J÷4s＝0.05W。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問1-I 圧力", "sg": [[1, 0.0722, 1.0, 1.4143], [2, 0.0, 1.0, 1.4143]], "it": [["(1)あ・い・う", "あ：C　い：A　う：750", "机を押す力は物体の重さ。A 0.3N、B 0.8N、C 1.5N なので最大はC。圧力＝力÷面積。A：0.3N÷(0.02m×0.02m)＝750Pa、B：0.8N÷0.0016m²＝500Pa、C：1.5N÷0.0025m²＝600Pa。最大はA、750Pa。", 0], ["(2)", "エ・カ", "机が受ける圧力が最大になるのは、机にふれる面積が最も小さいAが下で、重さが大きい物体を上にのせたとき。", 1], ["(3)", "3つ", "Aを2つ重ねた圧力＝0.6N÷0.0004m²＝1500Pa。Bを n 個重ねると 0.8n÷0.0016＝500n Pa。500n＝1500 → n＝3。", 0], ["(4)", "9000N", "100000Pa×0.09m²（900cm²）＝9000N。", 0], ["(5)", "イ", "菓子袋が山頂でふくらむのは、気圧が下がり、袋の外から押す大気圧が小さくなるから。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問4-I 電流と磁界", "sg": [[8, 0.0783, 1.0, 1.4143]], "it": [["(1)", "ア・イ", "コイルの動く向きを逆にするには、磁石の極か電流の向きのどちらか一方を逆にする。両方逆にすると元と同じ向きになる（ウは誤り）。", 1], ["(2)", "エ", "抵抗が小さいほど電流が大きくなる。Bを2つ並列につなぐと全体の抵抗が最も小さくなる。", 1], ["(3)", "電磁誘導", "コイルの中の磁界が変化して電圧が生じる現象。", 1], ["(4)", "ウ", "磁石のN極を下にして落下させると、コイルに近づくときと遠ざかるときで電流の向きが逆になる（右→左）。", 1]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問4-II エネルギー", "sg": [[9, 0.0768, 1.0, 1.4143]], "it": [["(1)", "C → B → D → E", "運動エネルギーは位置が低いほど大きい。Cが最も低く、次にB、D、Eの順に高くなる。", 1], ["(2)", "力学的エネルギー保存の法則", "運動エネルギーと位置エネルギーの和は一定。", 1], ["(3)", "図", "水平面上の小球にはたらく垂直抗力は、重力（20g＝0.2N）と同じ大きさで上向き。1目盛り0.1Nなので2目盛りの矢印を、小球の中心の●から真上にかく。", 1], ["(4)", "慣性", "物体がそれまでの運動を続けようとする性質。", 1], ["(5)", "エ", "Aより高い位置から転がすと、位置エネルギーが大きくなり、Fでの速さが大きくなる。", 0], ["(6)", "ア", "質量が大きい小球ほど運動エネルギーが大きく、木片が動く距離は長くなる。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問4-I 台車の運動", "sg": [[8, 0.0743, 1.0, 1.4129]], "it": [["(1)", "図", "重力（真下の矢印）を対角線とする平行四辺形をかく。斜面に平行な分力（斜面下向き）と斜面に垂直な分力（斜面に垂直に押す向き）の2つ。", 1], ["(2)", "e", "テープの長さの増え方がeで小さくなり、f以降は一定。傾きがなくなり水平面に入ったと考えられる。", 1], ["(3)", "64cm/s", "5打点＝0.1秒。b・cの2区間は 4.8＋8.0＝12.8cm、0.2秒。12.8÷0.2＝64cm/s。", 0], ["(4)", "等速直線運動", "f〜iは長さが同じ → 一定の速さでまっすぐ進む。", 1], ["(5)", "ア", "斜面の傾きを大きくすると、斜面方向の分力が大きくなり加速が大きい。水平面に着くまでの時間は短く、着いたときの速さは速くなる。", 1]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問4-II 電熱線の発熱", "sg": [[9, 0.0779, 1.0, 1.4129], [10, 0.0, 1.0, 1.4129]], "it": [["(1)", "伝導（熱伝導）", "物体の高温部から低温部へ熱が伝わる現象。", 1], ["(2)", "あ：B　い：12", "6Vで消費電力が一番小さい（3W）Bが、電流が小さいので抵抗が最大。電流 3W÷6V＝0.5A、抵抗 6V÷0.5A＝12Ω。", 0], ["(3)", "3600J", "電熱線Dは12W。12W×(5×60秒)＝3600J。（発熱量＝電力×時間）", 0], ["(4)", "あ：比例　い：大きく", "電圧と電流が一定なら発熱量は時間に比例。電力が大きいほど発熱量も大きい。", 1], ["(5)", "オ（38℃）", "並列なので、A・Dそれぞれに6Vがかかり同じ発熱をする。グラフから5分でA＝3.0℃、D＝6.0℃上昇 → 5分で9.0℃、10分で18.0℃。20.0＋18.0＝38.0℃。", 0]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問4-I 電流による発熱", "sg": [[8, 0.0819, 1.0, 1.4129]], "it": [["(1)", "グラフ（原点を通る直線）", "上昇温度は 1分0.8℃、2分1.6℃、3分2.4℃、4分3.2℃、5分4.0℃。点をとって原点を通る直線をひく。", 1], ["(2)", "900J", "電流＝6.0÷12＝0.5A、電力＝6.0×0.5＝3W。熱量＝3W×300秒＝900J。", 1], ["(3)", "あ 小さく　い 大きく", "電圧が同じなら抵抗が大きいほど電流が小さく、電力も小さい（aは6W、bは3W）。電力が大きいほど水温の上がり方は大きい。", 1], ["(4)", "ウ", "直列では電流が同じなので、電力は抵抗に比例する。bはaの2倍の抵抗なので約2倍温度が上がる。", 1]]}, {"e": "S3", "l": "令和３年 12月S日程", "t": "問4-II 圧力と浮力", "sg": [[9, 0.0824, 1.0, 1.4129], [10, 0.0, 1.0, 1.4129]], "it": [["(1)", "イ", "先がとがっていると、力のはたらく面積が小さく圧力が大きくなる。", 1], ["(2)", "600Pa", "重力は3.6N。面Aは6cm×10cm＝0.006m²。3.6÷0.006＝600Pa。", 1], ["(3)", "あ 2/5　い 5/2　う 5.0", "面Cは4cm×6cm＝24cm²で、面A（60cm²）の2/5倍。面積が2/5倍になると圧力は5/2倍。へこみは2.0×5/2＝5.0cm。", 0], ["(4)", "1.2N", "面Cから上の高さは10cm。半分（5cm）しずめると、図4でばねばかりは2.4N。浮力＝3.6−2.4＝1.2N。", 0], ["(5)", "ア", "質量が480gに変わっても、浮力（最大で4.8−2.4＝2.4N）は物体Xと同じ。浮力は水中にある部分の体積で決まる。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問5-I 凸レンズ", "sg": [[9, 0.0819, 1.0, 1.4129]], "it": [["(1)", "光の屈折", "光が異なる物質の境界で折れ曲がって進む現象。", 1], ["(2)", "実像", "光が実際に集まってできる像。スクリーンにうつる。", 1], ["(3)", "10cm", "光源と同じ大きさの実像は、光源とスクリーンがそれぞれ焦点距離の2倍の位置にあるとき。40÷2÷2＝10cm。", 0], ["(4)", "作図", "光軸に平行な光は凸レンズを通過後に焦点F₂を通る。レンズの中心を通る光はそのまま直進する。2本が交わる点に上下逆さの像の先端をかく。", 1], ["(5)", "イ", "焦点より内側に光源があると実像はできず、レンズを通して見ると、上下が同じ向きで大きい虚像が見える。", 1]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問5-II 電流と電圧", "sg": [[10, 0.0177, 1.0, 1.4129]], "it": [["(1)", "オームの法則", "電流が電圧に比例するという関係。", 1], ["(2)", "2Ω", "図2で、Xは6.0Vで3.0A。抵抗＝6.0÷3.0＝2Ω。", 0], ["(3)", "3倍", "Yは6.0Vで1.0Aなので6Ω。6÷2＝3倍。", 0], ["(4)", "1.5V", "図3の並列回路全体の抵抗は 1÷(1/2+1/6)＝1.5Ω。1.0A流れるので電圧＝1.5×1.0＝1.5V。並列なのでXにも1.5V。", 0], ["(5)", "5.3倍", "図4の直列回路全体の抵抗は 2+6＝8Ω。8÷1.5＝5.33… → 5.3倍。", 0], ["(6)", "エ", "図3：Xは1.5V×0.75A≒1.1W、Yは1.5V×0.25A≒0.4W。図4：電流は1.0Aで、Xは2V×1A＝2W、Yは6V×1A＝6W。最も大きいのは図4のY。", 1]]}], "小問集合": [{"e": "S2", "l": "令和２年 12月S日程", "t": "問1 小問集合", "sg": [[1, 0.0814, 1.0, 1.4129], [2, 0.0, 1.0, 1.4129]], "it": [["(1)①", "あ 3.5　い 0.5", "図1で、S波は20秒で70km進むので 70÷20＝3.5km/s。P波は10秒で70km進むので7km/s。3.5÷7＝0.5倍。", 0], ["(1)②", "10秒", "70kmの地点に、P波は10秒、S波は20秒で届く。初期微動継続時間＝20−10＝10秒。", 0], ["(2)①", "イ、ウ、オ", "水にとけてイオンに分かれる電解質（塩化ナトリウム、塩化水素、硫酸銅）の水溶液は電流が流れる。砂糖とエタノールは非電解質。", 1], ["(2)②", "陽極 O₂　陰極 H₂", "水酸化ナトリウム水溶液の電気分解は、水の電気分解と同じ。陽極から酸素、陰極から水素が出る。", 1], ["(3)①", "有性生殖", "雌と雄の生殖細胞（卵と精子）の核が合体して新しい個体をつくるふえ方。", 1], ["(3)②", "ウ", "精子は減数分裂でできるので染色体は受精卵の半分の11本。おたまじゃくしの体細胞は受精卵と同じ22本。", 1], ["(4)①", "あ 100　い 10", "5kgの台車にはたらく重力は50N。高さ2m引き上げるので、仕事＝50×2＝100J（斜面を使っても仕事は同じ＝仕事の原理）
