00÷25000＝4cm。", 1], ["(1)③", "ア", "大谷川の近くの標高は西側が高く（426m、415m）、東側が低い（369m）。川は高いほうから低いほうへ流れるので、北西から東へ。", 1], ["(2)①", "日本アルプス", "飛驒山脈・木曽山脈・赤石山脈をあわせて日本アルプスという。", 1], ["(2)②", "ウ", "日高山脈は北海道にある。", 1], ["(2)③", "イ", "空港や高速道路の近く、東北地方や九州地方にも多く分布する＝半導体工場（IC工場）。", 1], ["(2)④", "A エ　B イ　C ア　D ウ", "A北海道は食料品、B東京都は印刷業、C愛知県は輸送用機械（自動車）、D大阪府は化学・金属製品など。", 0], ["(2)⑤", "ⓐ ウ　ⓑ イ　ⓒ ア", "輸出は機械類に次いで乗用車。輸入は原油が最も多く、次いで液化ガス・石炭。", 0]]}], "歴史（古代〜近世）": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問3 歴史（古代〜近世）", "sg": [[5, 0.0731, 1.0, 1.4132], [6, 0.0, 1.0, 1.4131]], "it": [["(1)", "渡来人", "4〜7世紀に中国や朝鮮半島から日本列島に移り住み、須恵器、漢字、儒学、仏教などを伝えた人々。", 1], ["(2)", "唐招提寺", "唐から来日した鑑真が、奈良の平城京に建てた寺。", 1], ["(3)", "イ", "平清盛があつく信仰した神社は厳島神社（広島県）。1996年に世界文化遺産に登録された。", 1], ["(4)", "ア", "道元は曹洞宗、栄西は臨済宗を伝えた。どちらも座禅によって自分の力でさとりを開く禅宗。（イは浄土宗・浄土真宗、ウは日蓮宗、エは密教）", 1], ["(5)", "オ→ウ→ア", "室町時代のできごとを古い順に並べる。オ：日明貿易（1404年）→ウ：正長の土一揆（1428年）→ア：応仁の乱（1467年）。（イ：文永の役は鎌倉時代、エ：太閤検地は安土桃山時代）", 0], ["(6)", "天正", "1582年に大友・有馬・大村の3大名が送った使節は「天正遣欧使節」。", 1], ["(7)", "ア、エ、オ", "徳川家康の子を祖とする御三家は、尾張（エ）・紀伊（ア）・水戸（オ）。", 0], ["(8)", "W：イ　X：ア　Y：ウ　Z：エ", "W：徳川綱吉の生類憐みの令。X：徳川吉宗の享保の改革（上げ米）。Y：松平定信の寛政の改革（寛政異学の禁）。Z：水野忠邦の天保の改革（株仲間の解散）。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問3 中世の歴史", "sg": [[5, 0.0839, 1.0, 1.4129], [6, 0.0, 1.0, 1.4129]], "it": [["(1)", "C", "元寇（文永の役）は博多湾（九州北部）で起こったが、地図のCは別の場所を示している。", 1], ["(2)①", "御成敗式目（貞永式目）", "1232年、武士の慣習をもとにつくられた最初の武家法。", 1], ["(2)②", "北条泰時", "第3代執権。", 1], ["(2)③X", "守護", "京都の警備と謀反人・殺人犯の取り締まり。", 1], ["(2)③Y", "地頭", "荘園・公領の管理と年貢の取り立て。", 1], ["(3)", "ウ", "『蒙古襲来絵詞』：日本の武士は一騎打ち、元軍は集団戦法と「てつはう」などの火器を用いた。", 1], ["(4)", "例：天皇を中心に、貴族を重視し、武士に不公平な政策をとった政治。", "「天皇」を使って、建武の新政の特色を書く。", 0], ["(5)", "ウ, エ", "応仁の乱は将軍あとつぎ問題と、細川氏・山名氏の対立。", 1], ["(6)", "ア", "観阿弥・世阿弥が能を大成し、合間に狂言が演じられた（室町文化）。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問3 原始・古代", "sg": [[5, 0.0889, 1.0, 1.4143], [6, 0.0, 1.0, 1.4143]], "it": [["(1)", "X：藤原道長　Y：卑弥呼", "カード1「この世をば わが世とぞ思ふ 望月の」は藤原道長の歌。カード3の邪馬台国の女王は卑弥呼。", 1], ["(2)", "イ", "古い順：カード3（卑弥呼・3世紀）→カード4（十七条憲法・604）→カード2（万葉集・奈良時代）→カード1（藤原道長・平安）。3番目はカード2。", 1], ["(3)", "阿弥陀仏を信じて念仏をとなえることで、死んだ後に極楽浄土に生まれ変われると信じること。", "平等院鳳凰堂（藤原頼通）などが建てられた。", 0], ["(4)", "万葉仮名", "漢字の音を使って日本語を表した文字。（のちに平仮名・片仮名が生まれる）解答用紙は「仮名文字」。", 1], ["(5)", "調", "荷札は、都に納める「調」。", 1], ["(6)", "D", "銅鐸は青銅器（弥生時代）。D「鉄器」が誤り。", 1], ["(7)", "ア", "十七条憲法（604年）のころ、ムハンマドがイスラム教をおこした（610年ごろ）。", 1], ["(8)", "A：ア（天智天皇）　B：ウ（天武天皇）　C：イ（持統天皇）", "645年の大化の改新に着手したのち即位＝中大兄皇子（天智）。672年の壬申の乱に勝利＝大海人皇子（天武）。694年に藤原京に遷都＝持統。", 0]]}, {"e": "S7", "l": "令和７年 12月S日程", "t": "問4 近世・近代", "sg": [[7, 0.0889, 1.0, 1.4143], [8, 0.0, 1.0, 1.4143]], "it": [["(1)①", "あ：エ（スペイン）　い：オ（ポルトガル）", "コロンブスとマゼランはスペインの、バスコ・ダ・ガマはポルトガルの支援を受けた。", 1], ["(1)②", "ア・イ", "ヨーロッパ人が香辛料（胡椒など）や絹織物をアジアから得ようとした。", 1], ["(2)", "ウ（山崎の戦い）※模範解答はエ", "1582年に豊臣秀吉が明智光秀を倒した戦いは山崎の戦い（ウ）。関ヶ原の戦いは1600年。模範解答の「エ」は誤りの可能性があるので、確認してください。", 1], ["(3)", "老中", "資料1の「X」は将軍の下、町奉行などの上にある老中。田沼意次も老中になった。", 1], ["(4)", "オ（水野忠邦）", "株仲間の解散、人返し令（農民を村へ帰す）、倹約・出版統制、上知令、薪水給与令は天保の改革。", 1], ["(5)", "イ（①元禄　②化政　③菱川師宣）", "17世紀末〜18世紀初めの上方の町人文化は元禄文化（井原西鶴・近松門左衛門・松尾芭蕉・菱川師宣）。19世紀初めの江戸の文化は化政文化。", 0], ["(6)①", "エ → イ → ウ → ア", "ペリー来航（1853）→日米和親条約（1854）→日米修好通商条約（1858）→薩長同盟（1866）。", 0], ["(6)②", "ア・ウ", "1841〜1867年のアメリカ：南北戦争（1861〜65）、奴隷解放宣言（1863）。ワシントン就任は1789年、独立宣言は1776年。", 1]]}, {"e": "A6", "l": "令和６年 1月A日程", "t": "問3 中世の歴史", "sg": [[5, 0.053, 1.0, 1.4143], [6, 0.0, 1.0, 1.4143]], "it": [["(1)", "守護大名", "室町幕府の管領には、細川氏や畠山氏などの有力な守護大名が交代で就いた。", 1], ["(2)①", "書院造", "室町時代の部屋のつくり（畳・ふすま・床の間・違い棚）。", 1], ["(2)②", "エ", "水墨画を大成したのは雪舟。", 1], ["(3)", "ウ", "元寇（13世紀後半）のころ、マルコ・ポーロが中国（元）を訪れた。アは11世紀末、イは10世紀、エは15世紀。", 1], ["(4)①", "新古今和歌集", "後鳥羽上皇が藤原定家らに作らせた和歌集。", 1], ["(4)②", "承久の乱、ウ", "後鳥羽上皇が幕府に対して兵を挙げた承久の乱（1221年）。隠岐は島根県の沖で、地図の「ウ」。", 1], ["(5)", "エ, カ", "エ：平清盛が貿易をしたのは「明」ではなく「宋」。カ：定期市は月6回ではなく、鎌倉時代は月3回（三斎市）が一般的だった。", 1], ["(6)", "2番目：ウ　4番目：ア", "カード4（平清盛 12世紀）→ カード3（承久の乱 1221年）→ カード2（元寇 1274・1281年）→ カード1（室町幕府 14世紀）。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問3 原始・古代", "sg": [[5, 0.0933, 1.0, 1.2943], [6, 0.0, 1.0, 1.2943]], "it": [["(1)", "ア", "①秦の始皇帝が中国を統一（前221）→④漢（前漢）が中国を統一（前202）→②ローマ帝国が成立（前27）→③ムハンマドがイスラム教を開く（7世紀）。", 1], ["(2)", "朝貢", "周辺諸国が中国の皇帝に貢ぎ物をさし出して従属を示すこと。", 1], ["(3)", "イ", "仏教を正式に伝えたのは百済（538年ごろ）。", 1], ["(4)①", "推古天皇", "593年、聖徳太子は推古天皇の摂政となった。", 1], ["(4)②", "イ・ウ", "天智天皇（中大兄皇子）は、白村江の戦いに敗れたあと（ウ）、初めての全国的な戸籍の庚午年籍をつくった（イ）。アは聖徳太子（遣隋使）、エは持統天皇（藤原京）。", 1], ["(5)①", "エ", "唐から来日して仏教の正しい教えを広めた僧は鑑真。唐招提寺をひらいた。", 1], ["(5)②", "校倉造・聖武天皇", "東大寺正倉院は三角形の木材を組み上げた校倉造。納められた宝物は聖武天皇の遺品。", 1], ["(6)", "イ", "菅原道真を陥れたのは「平氏」ではなく藤原氏（藤原時平）。", 0]]}, {"e": "S6", "l": "令和６年 12月S日程", "t": "問4 近世", "sg": [[7, 0.0911, 1.0, 1.2943], [8, 0.0, 1.0, 1.2943]], "it": [["(1)", "南蛮貿易", "ポルトガル・スペインとの貿易。", 1], ["(2)①", "イ・ウ", "豊臣秀吉は刀狩（イ）で百姓から武器を取り上げ、太閤検地（ウ）で田畑の良し悪しを調べ耕作者を定めた。", 1], ["(2)②", "武士と農民の身分がはっきりと分けられた（兵農分離）。", "刀狩と太閤検地で、武士は城下町に住み、農民は農業に専念する身分制度の基礎ができた。", 0], ["(3)", "ウ", "秀吉が出兵したのは朝鮮。李舜臣の水軍や民衆の抵抗で苦戦した（文禄・慶長の役）。", 1], ["(4)①", "X：朱印　Y：参勤交代", "海外渡航許可書は朱印状。大名に1年おきに江戸に来ることを義務づけたのは参勤交代（徳川家光、武家諸法度の改定）。", 1], ["(4)②", "ア", "クロムウェルの議会派が国王を処刑して共和政を始めたのは、ピューリタン革命（1642〜49）。", 1], ["(5)①", "イ → エ → ア → ウ", "安政の大獄（1858）→ 生麦事件（薩摩藩士がイギリス商人を殺傷、1862）→ 薩英戦争（1863）→ 四国連合艦隊の下関砲撃（1864）。※解答用紙の手書きは「エ→ウ→ア→イ」ですが、年代順ではイ→エ→ア→ウです。", 0], ["(5)②", "エ（i：金　ii：銀　iii：上昇）", "日本は金銀の交換比率が外国と異なり、金が大量に海外へ流出した。物価は急上昇した。", 0]]}, {"e": "A5", "l": "令和５年 1月A日程", "t": "問3 中世", "sg": [[5, 0.0687, 1.0, 1.4143], [6, 0.0, 1.0, 1.4143]], "it": [["(1)", "承久の乱", "1221年、後鳥羽上皇が鎌倉幕府を倒そうとしておこした戦い。幕府は六波羅探題を置いて朝廷を監視した。", 1], ["(2)①", "元", "1271年、モンゴル帝国のフビライ・ハンが国号を元と定めた。", 1], ["(2)②", "ウ（マルコ・ポーロ）", "『世界の記述（東方見聞録）』で日本を「黄金の国ジパング」と紹介した。", 1], ["(3)", "ア → オ → エ", "チンギス・ハンがモンゴル統一（1206）→御成敗式目（1232）→永仁の徳政令（1297）。", 1], ["(4)", "a：エ（二条河原の落書）　b：キ（後醍醐天皇）", "建武の新政の混乱を風刺した落書が、後醍醐天皇の御所の近くにかかげられた。", 0], ["(5)", "イ（借金）", "正長の土一揆：「ヲヰメ（負い目）」＝借金。土倉・酒屋に借金の帳消しを求めた。", 1], ["(6)", "Y：ウ　Z：ア", "山城の国一揆（京都府南部）＝ウ、加賀の一向一揆（石川県）＝ア。", 1], ["(7)", "分国法", "戦国大名が領国を治めるためにつくった法律。", 0]]}, {"e": "S5", "l": "令和５年 12月S日程", "t": "問3 原始・古代", "sg": [[5, 0.0723, 1.0, 1.4129], [6, 0.0, 1.0, 1.4129]], "it": [["(1)", "イ", "縄文時代は狩りや採集が中心で、豊かな実りを祈って土偶 .4129]], "it": [["(1)", "ア、ウ", "イ：マゼランの船隊はスペインの援助を受けた。エ：鎖国下で出島で貿易を許されたのはオランダ。", 1], ["(2)", "キリスト", "1549年、イエズス会のザビエルが鹿児島に来てキリスト教を伝えた。", 1], ["(3)", "エ", "武田氏を長篠の戦いで破り、安土城を築いたのは織田信長。アは刀狩、イは太閤検地、ウは朝鮮出兵で秀吉。", 1], ["(4)", "イ", "江戸時代の人口の約85％は百姓。", 1], ["(5)①", "ウ", "「白河の清きに魚の住みかねて…」は、白河藩主だった松平定信の寛政の改革のきびしさを皮肉り、田沼時代をなつかしんだ歌。", 1], ["(5)②", "狂歌", "政治や社会を皮肉った、こっけいな和歌。", 1], ["(6)", "ウ", "江戸時代初めは銀の輸出が多く、開国後は生糸が最大の輸出品になった。", 0], ["(7)", "A イ　B エ", "A：わび茶を大成したのは千利休（桃山文化）。B：正確な日本地図を作ったのは伊能忠敬（江戸時代後期）。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問3 古代", "sg": [[5, 0.0789, 1.0, 1.4129], [6, 0.0, 1.0, 1.4129]], "it": [["(1)", "エ", "吉野ヶ里遺跡は佐賀県（九州北部）にある弥生時代の環濠集落。", 1], ["(2)", "ウ", "埼玉県の稲荷山古墳、熊本県の江田船山古墳から「ワカタケル大王」の名が刻まれた鉄剣・鉄刀が出土した。ア：古墳には埴輪が置かれた。イ：大仙古墳は前方後円墳。エ：前方後円墳は日本独特の形。", 1], ["(3)", "ウ", "607年、聖徳太子は小野妹子を遣隋使として隋に送った。", 1], ["(4)", "防人", "北九州の防衛のために3年間送られた兵士。", 1], ["(5)", "荘園", "墾田永年私財法で土地の私有が認められ、貴族や寺社の私有地（荘園）が広がった。", 1], ["(6)", "菅原道真", "894年、唐のおとろえを理由に遣唐使の停止を提言した。", 1], ["(7)", "① イ　② ウ", "①平城京への遷都は710年（701年と743年の間）。②平安京への遷都は794年（743年と894年の間）。", 0], ["(8)", "イ", "Zの時期（平安時代中期〜後期）は国風文化。アは天平文化、ウは古墳時代、エは飛鳥文化。", 0]]}, {"e": "S2", "l": "令和２年 12月S日程", "t": "問4 近世", "sg": [[7, 0.0753, 1.0, 1.4129], [8, 0.0, 1.0, 1.4129]], "it": [["(1)", "（例）市場の税を免除し、座の特権を廃止して、商工業の発展をはかった。", "楽市・楽座＝だれでも自由に商売ができるようにした政策。「座」「税」「商工業」の3語を使う。", 0], ["(2)①", "朱印船", "幕府が発行した朱印状をもって東南アジアと貿易した船。", 1], ["(2)②", "ウ", "朱印船貿易がさかんになり、東南アジア各地に日本町ができた。アは鎖国下の長崎貿易。エ：家光のころは鎖国が進められた。", 1], ["(3)①", "i群 イ　ii群 ク", "「夏草や…」「閑さや…」は松尾芭蕉の『奥の細道』。", 1], ["(3)②", "イ", "歌川広重は化政文化（19世紀前半）。芭蕉が活躍したのは元禄文化。ア・ウ・エは元禄文化。", 1], ["(4)①", "株仲間", "老中田沼意次は、商工業者の同業組合である株仲間をつくることを奨励し、営業税をとった。", 1], ["(4)②", "ウ", "1792年、ロシアの使節ラクスマンが根室に来航し、大黒屋光太夫を送り届けて通商を求めた。", 0], ["(5)", "エ→イ→ア", "エ：ポルトガル船の来航禁止（1639年）→イ：5代将軍綱吉が朱子学を奨励（17世紀末）→ア：公事方御定書（1742年）。ウ（1837年）とオ（16世紀末）は期間外。", 0]]}], "歴史（近代・現代）": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問4 近代・現代の世界と日本", "sg": [[7, 0.0712, 1.0, 1.4123], [8, 0.0, 1.0, 1.4131]], "it": [["(1)-①", "あ：エ（ワシントン）　い：イ（リンカン）", "独立戦争の総司令官 {"e": "A5", "l": "令和５年 1月A日程", "t": "問4 近現代", "sg": [[7, 0.0803, 1.0, 1.4143], [8, 0.0, 1.0, 1.4143]], "it": [["(1)①", "ウ（福沢諭吉）", "『学問のすゝめ』の著者は福沢諭吉。", 1], ["(1)②", "エ（農地改革）", "農地改革は第二次世界大戦後の改革。郵便制度・学制・徴兵令は明治政府の政策。", 1], ["(2)①②", "①c　②b", "南満州鉄道株式会社の設立（1906）はc（1904〜1911）。八幡製鉄所の操業開始（1901）はb（1894〜1904）。", 1], ["(3)", "ア・イ・エ", "ワシントン会議（1921〜22）で、日英同盟の解消、海軍の軍備縮小、山東省の権益の返還が決まった。遼東半島の返還は三国干渉（1895）。", 1], ["(4)", "ア（日本が韓国を併合した）", "石川啄木の短歌は韓国併合（1910）に対する歌。カード2（日露戦争後）とカード3（第一次世界大戦）の間の出来事。", 1], ["(5)", "公共事業を増やすことで雇用をつくり出し、失業率を低下させ、景気を良くするため。", "世界恐慌で各国の失業率が急上昇した。アメリカでは、ダムなどの公共事業で失業者を雇い、景気を回復させようとした（ニューディール政策）。", 0], ["(6)", "イ", "カード4（昭和）：太平洋戦争の終結後、沖縄は20年以上アメリカの占領下にあった。アは日中戦争中の国家総動員法、ウは日本の国際連合加盟は1956年、エはキューバ危機が冷戦の始まりではない。", 0], ["(7)", "イ → ウ → ア", "イ：日露戦争直前（日英同盟とロシア対立）、ウ：第一次世界大戦直前、ア：第二次世界大戦直前（日独とソ連・イギリス）。", 0]]}], "公民": [{"e": "S8", "l": "令和８年 12月S日程", "t": "問5 公民", "sg": [[9, 0.0691, 1.0, 1.415], [10, 0.0, 1.0, 1.4083]], "it": [["(1)", "国際分業", "各国が得意な商品を輸出し、不得意な商品は輸入にたよること。", 1], ["(2)", "イ、ウ", "イ：2014年は中国30.9％＋韓国・朝鮮23.6％＝54.5％、2024年は23.2％＋11.5％＝34.7％。ウ：ベトナム国籍は2014年4.7％でフィリピン10.3％の半分未満、2024年は16.8％でフィリピン9.1％＋ブラジル5.6％＝14.7％を上回る。（アは韓国・朝鮮籍が減少、エはネパール国籍は2014年に約4万人で、2万人程度ではない）", 1], ["(3)", "ア", "社会権を初めて明記したのは1919年のドイツのワイマール憲法。（イはフランス人権宣言、ウは権利章典、エは世界人権宣言）", 1], ["(4)", "三権分立", "モンテスキューは『法の精神』で三権分立を唱えた。", 1], ["(5)", "52", "参議院議員の被選挙権は30歳以上。1997年4月に30歳になった人は1967年生まれ。参議院議員の任期は6年で、2013年7月に初当選、2019年7月に2度目の当選をしたときの年齢は52歳。", 1], ["(6)", "エ", "衆議院の優越は、予算の議決、条約の承認、法律案の議決、内閣総理大臣の指名など。憲法改正の発議は衆議院・参議院が対等。", 1], ["(7)", "ア", "内閣総理大臣は、国会議員（衆議院議員・参議院議員のどちらでもよい）の中から指名される。必ず衆議院議員とは限らない。", 1], ["(8)", "ウ", "裁判員裁判は、重大な刑事事件の第一審で行われる。裁判員は満18歳以上の国民から選ばれる（2022年から）。", 0], ["(9)", "か：条例　き：イ（4万人以上）", "条例の制定・改廃の請求は有権者の50分の1以上の署名を首長に提出。議会の解散や首長・議員の解職請求は有権者の3分の1以上（40万人以下の部分）の署名で選挙管理委員会へ。12万人×1/3＝4万人。", 0]]}, {"e": "A7", "l": "令和７年 1月A日程", "t": "問5 公民", "sg": [[9, 0.0859, 1.0, 1.4129], [10, 0.0, 1.0, 1.4129]], "it": [["(1)", "イ, エ", "経済活動の自由（居住・移転・職業選択の自由、財産権）＝イ・エ。アは身体の自由、ウは表現の自由。", 1], ["(2)", "公正取引委員会", "
