function show(){
 document.querySelectorAll('#rs button,#ra button').forEach(b=>b.classList.toggle('on',b.dataset.k==ex));
 document.querySelectorAll('.sub').forEach(b=>b.classList.toggle('on',b.dataset.k==sb));

 else{$('v1').style.display='none';$('v2').style.display='block';draw()}

function draw(){

 const n=Math.ceil(L.length/2);if(idx<0)idx=0;if(idx>=n)idx=n-1;
 let pr=L.slice(idx*2,idx*2+2),nums=[idx*2+1,idx*2+2].slice(0,pr.length);
 if(rtl)pr=pr.reverse();
 $('sp').className=pr.length==1?'single':'';
 $('sp').innerHTML=pr.map(f=>'<img src="'+f+'">').join('');
 $('pi').textContent=nums.join('-')+' / '+L.length+'ページ';

 if(rtl){nx.textContent='◀ 次へ';pv.textContent='前へ ▶';nx.style.order=0;pv.style.order=2}
 else{nx.textContent='次へ ▶';pv.textContent='◀ 前へ';nx.style.order=2;pv.style.order=0}
 $('pi').style.order=1;
}
